<title>dewi.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=Lilita+One&display=swap">
<style>
/* Layout: eine schmale Heftseite, unten Tab-Leiste. Farben: dunkles Aubergine und Pink passend zu Dewi; Regenbogen-Akzente bleiben. */
:root[data-theme=neon]{--wash:radial-gradient(120% 38% at 50% 0%,rgba(53,220,210,.26),transparent 75%),radial-gradient(70% 34% at 100% 12%,rgba(80,120,255,.24),transparent 70%),linear-gradient(180deg,rgba(40,100,210,.26) 0%,rgba(20,50,130,.2) 50%,rgba(10,24,80,.18) 100%);--bg:#0b1026;--surface:#141c3d;--raised:#1b2550;--line:#2b3a73;--line-soft:#212d5c;--muted:#b4c3e6;--faint:#8697c4;--accent:#35dcd2;--accent-ink:#06202a;--accent-soft:rgba(53,220,210,.18);--grad:linear-gradient(135deg,#7ff0e6,#35dcd2)}
:root{
  --wash:radial-gradient(120% 38% at 50% 0%,rgba(168,136,255,.42),transparent 75%),radial-gradient(70% 34% at 100% 12%,rgba(120,96,235,.28),transparent 70%),linear-gradient(180deg,rgba(120,84,215,.30) 0%,rgba(78,44,150,.24) 50%,rgba(40,20,88,.20) 100%);   /* Version 166: Hintergrundverlauf aller Screens (vorher nur Survival/Rush) */
  --bg:#1a0f24; --surface:#251634; --raised:#301d42; --line:#4a2f63; --line-soft:#3a2450;
  --text:#fbefe9; --muted:#cdb4da; --faint:#aa8fbd;
  --accent:#f566b9; --accent-ink:#2a1630; --accent-soft:rgba(245,102,185,.18); --grad:linear-gradient(135deg,#ff92d2,#f566b9);
  --c-yellow:#ffc23d; --c-orange:#ff8a3d; --c-pink:#ff5c9d; --c-violet:#a888ff; --c-blue:#5aa9ff; --c-cyan:#35dcd2; --c-green:#6ee77a;
  --lv0:#f2907f; --lv1:var(--c-blue); --lv2:var(--c-cyan); --lv3:var(--c-green); --lv4:var(--c-yellow); --lv5:var(--c-pink);
  --rainbow:linear-gradient(90deg,var(--c-blue),var(--c-cyan),var(--c-green),var(--c-yellow),var(--c-orange),var(--c-pink));
  --good:#5fd3a0; --good-soft:rgba(95,211,160,.12);
  --bad:#f2907f; --bad-soft:rgba(242,144,127,.12);
  --num:'Lilita One','Bricolage Grotesque',system-ui,sans-serif;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;min-height:100%;background:var(--bg)}   /* Version 150: Seite füllt immer den ganzen Bildschirm, sonst blitzt bei kurzen Screens die Browser-Standardfarbe unter der Tab-Leiste durch */
body{margin:0;min-height:100vh;min-height:100dvh;background:transparent;color:var(--text);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}
h1{font:700 26px/1.15 var(--display);letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{font:700 18px/1.2 var(--display);margin:0}

body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--wash)}   /* Version 166: Verlauf hinter der Startseite, feststehend (eine statische Ebene, keine Animation) */
.app{max-width:480px;margin:0 auto;padding:18px 16px 104px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:9px;font:700 22px/1 var(--display);letter-spacing:-.01em}
.brand b{color:var(--c-pink);font-weight:700}
/* Chips (Version 132): Pille mit Dewi-Chip, ruhiger Glanz alle paar Sekunden */
.chippill{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 12px 0 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chippill .chipwrap{position:relative;width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none}
.chippill .chipwrap .dchip{width:100%;height:100%;display:block}
.chippill .chipwrap::after{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);transform:translateX(-130%);animation:chipshine 6s ease-in-out 1.5s infinite}
@keyframes chipshine{0%,78%{transform:translateX(-130%)}92%,100%{transform:translateX(130%)}}
.chippill b{font:600 17px/1 var(--display);letter-spacing:0;font-variant-numeric:tabular-nums}
.chippill.bump{animation:chipbump .22s ease-out}
@keyframes chipbump{40%{transform:scale(1.14);border-color:#f566b9;box-shadow:0 0 14px rgba(245,102,185,.55)}}
.chipfly{position:fixed;z-index:60;width:26px;height:26px;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.chipfly svg,.chipline svg,.drain .dchip{width:100%;height:100%;display:block}
.chipline{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px auto 4px;padding:10px 16px;border-radius:14px;background:rgba(245,102,185,.12);border:1px solid rgba(245,102,185,.35);max-width:340px}
.chipline svg{width:26px;height:26px}
.chipline b{font:600 22px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.chippill .chipwrap::after{animation:none;opacity:0}}
.brand em{font-style:italic;font-weight:600;font-size:.82em;letter-spacing:0;color:var(--c-cyan)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hint{color:var(--muted);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.plan{position:relative;overflow:hidden;border:0;border-bottom:5px solid rgba(40,10,90,.55);border-radius:20px;color:#fff;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 5px),linear-gradient(100deg,#5b2bd1,#9b2fe0,#e23aa6,#9b2fe0,#5b2bd1);background-size:100% 100%,300% 100%;
  animation:mrflow 6s linear infinite;box-shadow:inset 0 0 0 2px rgba(255,255,255,.26),0 12px 28px rgba(150,60,230,.25)}
.plan .eyebrow{color:#fff;font:800 14px/1 var(--display);letter-spacing:.1em;text-shadow:0 2px 0 rgba(40,10,90,.5)}
.plan .hint{color:rgba(255,255,255,.95);font-weight:600;text-shadow:0 1px 0 rgba(40,10,90,.45)}
.plan h2{text-transform:uppercase;letter-spacing:.02em;text-shadow:0 2px 0 rgba(40,10,90,.5)}
.plan .btn.primary{background:#fff;color:#6a1fb0;border-color:transparent;box-shadow:0 4px 0 rgba(40,10,90,.55)}
.plan .btn.primary.pulse{animation:planpulse 2.2s ease-out infinite}
.plan .btn.light{box-shadow:0 4px 0 rgba(40,10,90,.55)}
@keyframes planpulse{0%,100%{box-shadow:0 4px 0 rgba(40,10,90,.55),0 0 0 0 rgba(255,255,255,.55)}50%{box-shadow:0 4px 0 rgba(40,10,90,.55),0 0 0 9px rgba(255,255,255,0)}}
.plan .num b,.plan .num:nth-child(1) b,.plan .num:nth-child(2) b{color:#fff;text-shadow:0 2px 0 rgba(40,10,90,.5)}
.plan .num span{color:rgba(255,255,255,.92);font-weight:600}
@media (prefers-reduced-motion:reduce){.plan,.gmcard{animation:none}.plan .btn.primary.pulse{animation:none}}
.plan>*{position:relative}
.nums{display:flex;gap:26px;margin:8px 0 14px}
.num b{display:block;font:400 32px/1 var(--num);font-variant-numeric:tabular-nums}
.num span{font-size:13px;color:var(--muted);display:block;margin-top:3px}
.num:nth-child(1) b{color:var(--c-cyan)}
.num:nth-child(2) b{color:var(--c-pink)}
.plan{padding:22px 20px 18px}
.plan h2{margin:2px 0 16px;font:800 30px/1.05 var(--display);letter-spacing:.01em}
.plan .btn.primary{min-height:56px;font-size:18px}
.plan h2.dn{font-size:clamp(20px,6.2vw,24px);margin:2px 0 16px;letter-spacing:.02em;text-wrap:nowrap}
.btn.primary,.plan .btn,.gmcard .btn,.survcard .btn{text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.plan .streak.foot{margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.28);flex-wrap:nowrap;gap:10px}
.streak.foot .sl{align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.plan .streak.foot .sl{color:rgba(255,255,255,.95);font-weight:600}
.streak.foot .fl{width:24px;height:30px}
.streak.foot b{font:400 21px/1 var(--num);font-variant-numeric:tabular-nums;color:var(--c-orange)}
.plan .streak.foot b{color:#ffc83d}
.plan .streak.foot:not(.on) .sn{color:rgba(255,255,255,.5)}
.streak.foot .sn{font:400 30px/1 var(--num);text-shadow:0 2px 0 rgba(40,10,90,.45)}
.streak.foot .sl{gap:10px}
.dots{display:flex;gap:2px}
.wd{display:grid;place-items:center;width:26px;height:32px;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button.wd{cursor:pointer}
.wd i{display:block;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line)}
.wd.st svg{display:block;width:26px;height:26px;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));transition:transform .15s}
.wd.st.missed{opacity:.75}
.wd.now.st svg{outline:2px solid #f566b9;outline-offset:1px;border-radius:3px}
.wd.now:not(.st) i{outline:2px solid #f566b9;outline-offset:1px}
button.wd:active svg{transform:scale(.88)}
.dots{gap:0;padding-bottom:12px}
.wd{position:relative}
.wd::after{content:attr(data-d);position:absolute;left:0;right:0;top:100%;margin-top:1px;text-align:center;font:700 9px/1 var(--body,inherit);letter-spacing:.02em;color:rgba(255,255,255,.7);text-transform:uppercase;pointer-events:none}
.wd.now::after{color:#fff}
.plan .streak.foot .sl .go{color:#ffe08a;font-weight:800;font-size:13px;white-space:nowrap}
.plan .streak.foot .wd{width:24px}

.streak{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.sl{display:flex;align-items:flex-end;gap:10px}
.streak b{font:400 36px/1 var(--num);font-variant-numeric:tabular-nums;color:var(--c-orange)}
.streak small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.fl{--sh:6px;width:40px;height:50px;flex:none;overflow:visible;filter:drop-shadow(0 0 var(--sh) var(--fg,rgba(255,150,60,.65)))}
.fl.big{--sh:12px;width:72px;height:90px}
.fl.off{filter:none}
.fl .pf{opacity:0}
.fl .pf1{opacity:1}
.fl:not(.off) .pf1{animation:pf1 .8s steps(1,end) infinite}
.fl:not(.off) .pf2{animation:pf2 .8s steps(1,end) infinite}
.fl:not(.off) .pf3{animation:pf3 .8s steps(1,end) infinite}
@keyframes pf1{0%{opacity:1}25%{opacity:0}50%{opacity:1}75%{opacity:0}}
@keyframes pf2{0%{opacity:0}25%{opacity:1}50%{opacity:0}}
@keyframes pf3{0%{opacity:0}75%{opacity:1}}
.fl .em{opacity:0;animation:ember 1.6s steps(6,end) infinite}
.fl .e2{animation-delay:.5s}.fl .e3{animation-delay:1s}
@keyframes ember{0%{opacity:1;transform:translateY(2px)}100%{opacity:0;transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){.fl .pf,.fl .em{animation:none!important}.fl .pf1{opacity:1}}
.week{display:flex;gap:8px}
.day{display:grid;justify-items:center;gap:6px;font-size:11px;color:var(--faint)}
.day i{width:34px;height:34px;border-radius:7px;border:1.5px solid var(--line)}
.day.now span:last-child{color:var(--text);font-weight:700}
.day.now i{outline:2px solid var(--dc);outline-offset:2px}
button.day{background:none;border:0;padding:0;font:inherit;font-size:11px;color:var(--faint);cursor:pointer;-webkit-tap-highlight-color:transparent}
.day .st{display:block;width:38px;height:38px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));transition:transform .15s}
.day .st svg{display:block;width:100%;height:100%;overflow:visible}
button.day:active .st{transform:scale(.93)}
button.day.now .st{outline:2px solid #f566b9;outline-offset:1px;border-radius:3px}
/* Große Marke */
html.sv-open,html.sv-open body{overflow:hidden}
.stampview{position:fixed;inset:0;z-index:60;display:grid;place-items:center;animation:svin .22s ease-out}
.sv-back{position:absolute;inset:0;background:radial-gradient(circle at 50% 44%,rgba(70,25,90,.88),rgba(18,8,26,.95))}
.sv-x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:26px;line-height:1;z-index:2}
.sv-stage{position:relative;display:grid;justify-items:center;gap:16px;padding:20px;max-width:100%}
.sv-wrap{position:relative;width:min(74vw,320px);aspect-ratio:1}
.sv-card{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;will-change:transform;
  filter:drop-shadow(0 0 16px rgba(120,220,255,.28))}
.pl-bg{transform:translate(calc(var(--px,0)*-.4px),calc(var(--py,0)*-.4px))}
.pl-art{transform:translate(calc(var(--px,0)*-1px),calc(var(--py,0)*-1px))}
.card.locked{opacity:.7}
.survcard{position:relative;overflow:hidden;border:0;border-bottom:5px solid rgba(110,8,45,.55);border-radius:20px;color:#fff;padding:12px 14px 12px 12px;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 5px),linear-gradient(100deg,#ff2f55,#ff5a9a);box-shadow:inset 0 0 0 2px rgba(255,255,255,.24)}
.survcard .srow{display:flex;align-items:center;gap:8px}
.survcard{cursor:pointer}
.survcard .svgo{display:inline;background:none;border:0;color:#fff;text-align:left;padding:0;font:inherit;-webkit-tap-highlight-color:transparent}
.survcard .srow{align-items:center;gap:12px;padding:6px 4px;min-height:60px}
.survcard .stxt{flex:1;min-width:0}
.survcard .stitle{display:inline;font:800 23px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase;text-shadow:0 2px 0 rgba(110,8,45,.55)}
.survcard .hint{display:block;color:rgba(255,255,255,.95);margin:4px 0 0;font-size:13px;font-weight:600;text-shadow:0 1px 0 rgba(110,8,45,.5)}
.survcard .gmgo{flex:none;opacity:.9;filter:drop-shadow(0 2px 0 rgba(110,8,45,.5))}
.survcard .ico-lock{flex:none;width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.2}
.survcard .qh.sq{position:relative;top:-2px;margin-left:8px;display:inline-block;text-align:center;line-height:18px;vertical-align:middle;flex:none;width:22px;height:22px;font-size:12px;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff;border-radius:50%;padding:0;text-align:center}
.survcard .qh.sq[aria-expanded="true"]{background:#fff;color:#c4153f}
.survcard .sdesc{margin:8px 4px 4px;font-size:14px;line-height:1.4;font-weight:600;color:rgba(255,255,255,.96)}
.hearts{display:flex;gap:6px;flex:none}
.hearts svg{width:28px;height:28px;filter:drop-shadow(0 2px 0 rgba(130,12,55,.45));animation:shbeat 2.6s ease-in-out infinite;transform-origin:50% 60%}
.hearts svg:nth-child(2){animation-delay:.25s}.hearts svg:nth-child(3){animation-delay:.5s}
.hearts.sm{gap:4px;margin-left:auto}.hearts.sm svg{width:26px;height:26px}
.rushcard{margin-top:-6px;background:linear-gradient(100deg,#4a1fc4 0%,#7d4dff 36%,#c7b2ff 70%,#fff 100%);border-bottom-color:rgba(40,12,110,.55);color:#fff}
.rushcard.locked{background:linear-gradient(100deg,#4a1fc4,#7d4dff 60%,#a98aff)}
.rushcard::before,.rushcard::after{content:"";position:absolute;top:0;bottom:0;left:0;right:-100%;pointer-events:none;will-change:transform;transform:skewX(-20deg)}
.rushcard::before{animation:rushl 1.7s linear infinite;
  background:linear-gradient(90deg,transparent 0,rgba(255,255,255,.8) 38%,transparent 48%,transparent) 0 16%/50% 2px repeat-x,
    linear-gradient(90deg,transparent 0,transparent 30%,rgba(255,255,255,.6) 68%,transparent 80%,transparent) 0 52%/50% 3px repeat-x,
    linear-gradient(90deg,transparent 0,transparent 12%,rgba(255,255,255,.7) 40%,transparent 52%,transparent) 0 86%/50% 2px repeat-x}
.rushcard::after{animation:rushl .95s linear infinite;
  background:linear-gradient(90deg,transparent 0,transparent 20%,rgba(255,255,255,.75) 34%,transparent 42%,transparent) 0 32%/50% 2px repeat-x,
    linear-gradient(90deg,transparent 0,transparent 55%,rgba(255,255,255,.65) 66%,transparent 76%,transparent) 0 70%/50% 2px repeat-x}
@keyframes rushl{from{transform:skewX(-20deg) translate3d(0,0,0)}to{transform:skewX(-20deg) translate3d(-50%,0,0)}}
.rushcard.locked::before,.rushcard.locked::after{animation:none}
@media (prefers-reduced-motion:reduce){.rushcard::before,.rushcard::after{animation:none}}
.rushcard .srow{position:relative}
.rushcard .stitle{font-style:italic;text-shadow:0 2px 0 rgba(40,12,110,.6)}
.rushcard .hint{text-shadow:0 1px 0 rgba(40,12,110,.55)}
.rushcard .gmgo{filter:none}.rushcard .gmgo path{stroke:#4a1fc4}
.rushcard .qh.sq[aria-expanded="true"]{color:#4a1fc4}
.rushcard .rwatch{flex:none;color:#4a1fc4}
.rushcard .sdesc{position:relative;color:#2a1070;text-shadow:none;background:rgba(255,255,255,.88);border-radius:12px;padding:8px 12px;margin:8px 0 2px}
.rushwatch{margin-left:auto;display:flex;flex:none}.rushwatch svg{width:36px;height:36px;filter:drop-shadow(0 2px 0 rgba(40,12,110,.5))}
.rpen{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.survcard.locked{opacity:.82;filter:saturate(.75);animation:none}
.survcard.locked .hearts{display:none}
@keyframes shbeat{0%,40%,100%{transform:scale(1)}10%{transform:scale(1.16)}20%{transform:scale(1)}28%{transform:scale(1.1)}}
.sin.surv{max-width:none;padding-inline:max(16px,calc((100% - 448px)/2))}
.sin.surv .shead{align-items:center}
.mrec{display:block;margin-top:5px;font-size:12px;font-weight:800;color:var(--c-yellow)}
.day.flawed .st{opacity:.85}
.pl-holo{transform:translate(calc(var(--px,0)*.5px),calc(var(--py,0)*.5px))}
.pl-glare{transform:translate(calc(var(--px,0)*20px),calc(var(--py,0)*20px));opacity:calc(.12 + var(--g,0)*.7)}
.pl-mark{transform:translate(calc(var(--px,0)*1.2px),calc(var(--py,0)*1.2px))}
.sv-card.held{cursor:grabbing}
.sv-card svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.sv-shadow{position:absolute;left:6%;right:6%;bottom:-6%;height:16%;border-radius:50%;pointer-events:none;will-change:transform,opacity;
  background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.65),rgba(0,0,0,0) 70%)}
.sv-cap{display:grid;gap:2px;text-align:center;font-size:15px;color:var(--muted)}
.sv-cap b{color:var(--text);font:700 18px var(--display)}
.sv-hint{font-size:13px;color:var(--faint);text-align:center}
@keyframes svin{from{opacity:0}to{opacity:1}}

.stack{display:flex;gap:2px;height:10px;border-radius:999px;overflow:hidden;background:var(--raised);margin-top:12px}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px;min-width:0}
.legend em{width:9px;height:9px;border-radius:50%;flex:none}
.legend b{margin-left:auto;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--raised);font-weight:600;font-size:16px}
.btn.primary{background:var(--grad);border-color:transparent;color:var(--accent-ink);box-shadow:0 4px 0 #a82d7c;transition:transform .06s,box-shadow .06s}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #b3560f}
.btn.primary.pulse{animation:glow 2.2s ease-out infinite}

/* Version 155: Modul Slots – goldener Automat mit glänzenden Symbolen */
.slstage{position:relative;display:flex;justify-content:center;padding:34px 0 4px}
.slstage .qh{top:0;left:6px;right:auto}   /* rechts sitzt der Hebel */
.slmach{position:relative;display:flex;align-items:center;width:min(100%,340px);padding-right:34px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.slcap{width:13px;height:66px;flex:none;background:linear-gradient(#fff4b8,#f7c22e 45%,#b8740a);border:2.5px solid #2a0c20}
.slcap.l{border-radius:12px 0 0 12px;border-right:none}.slcap.r{border-radius:0 12px 12px 0;border-left:none}
.slbody{flex:1;min-width:0;padding:11px 12px;border-radius:40px;background:linear-gradient(180deg,#fff8cc 0%,#ffdc52 20%,#f4ac12 52%,#b8740a 80%,#ffd45c 100%);border:3px solid #2a0c20;box-shadow:inset 0 4px 0 rgba(255,255,255,.75),inset 0 -5px 0 rgba(120,60,0,.35),0 14px 30px rgba(255,170,30,.3)}
.slwin{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;border-radius:14px;background:linear-gradient(#9a5e08,#ffd45c);border:2.5px solid #2a0c20}
.slreel{position:relative;height:120px;overflow:hidden;border-radius:8px;background:linear-gradient(90deg,#d6d6e2,#fff 28%,#fff 72%,#d6d6e2)}
.slreel::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:8px;background:linear-gradient(180deg,rgba(42,12,32,.38),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(42,12,32,.38))}
.slstrip{will-change:transform}
.slc{height:80px;display:grid;place-items:center}
.slsym{width:68px;height:68px;overflow:visible}
.slarr{position:absolute;top:50%;width:11px;height:18px;margin-top:-9px;background:#ff2d4f;z-index:2}
.slarr.l{left:-7px;clip-path:polygon(0 0,100% 50%,0 100%)}.slarr.r{right:-7px;clip-path:polygon(100% 0,0 50%,100% 100%)}
.slword{position:absolute;left:3px;right:3px;bottom:4px;z-index:2;padding:2px 4px;border-radius:999px;background:rgba(255,255,255,.92);color:#2a0c20;font:700 12px/1.25 var(--display);text-align:center;overflow-wrap:anywhere}
.slword:empty{display:none}
.slreel.act{box-shadow:inset 0 0 0 3px #ff4fa3}
.slreel.ok{box-shadow:inset 0 0 0 3px var(--good)}
.slreel.rev{box-shadow:inset 0 0 0 3px var(--bad)}
.slreel.ok .slword{background:var(--good);color:#fff}.slreel.rev .slword{background:var(--bad);color:#fff}
.sllev{position:absolute;right:0;bottom:50%;z-index:3;width:36px;height:104px;touch-action:none;cursor:grab}
.slrod{position:absolute;left:13px;bottom:0;width:9px;height:76px;border-radius:5px;background:linear-gradient(90deg,#8e8e9c,#fff 45%,#b4b4c2);border:2px solid #2a0c20;transform-origin:50% 100%;transition:transform .18s ease-in}
.slball{position:absolute;left:1px;top:0;width:33px;height:33px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fffbe0,#ffd23d 32%,#e8900c 72%,#9a5a06);border:2.5px solid #2a0c20;transition:transform .18s ease-in}
.sllev.pulled .slrod{transform:scaleY(.2)}.sllev.pulled .slball{transform:translateY(64px)}
.slmach[data-st=jack] .slbody{animation:sljack .9s ease-out 2}
@keyframes sljack{50%{box-shadow:inset 0 4px 0 rgba(255,255,255,.75),inset 0 -5px 0 rgba(120,60,0,.35),0 0 40px 8px rgba(255,210,61,.85)}}
.slmach[data-st=lose] .slbody{filter:saturate(.55)}
.slq{min-height:118px;display:flex;flex-direction:column;gap:12px}
.slhint{margin:0;text-align:center;font-weight:700;color:var(--faint)}

#perf{position:fixed;left:6px;top:calc(env(safe-area-inset-top) + 2px);z-index:99;pointer-events:none;white-space:pre;font:600 10px/1.3 ui-monospace,Menlo,monospace;color:#7dffb2;background:rgba(0,0,0,.72);padding:3px 6px;border-radius:6px}
.langrow .flagbox{width:48px;height:48px;display:grid;place-items:center;font-size:36px;line-height:1;flex:none}
.langrow .code{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c-yellow),var(--c-pink));color:var(--accent-ink);font:700 18px var(--display);flex:none}
.langrow b{display:block;font:700 18px/1.2 var(--display)}
.flash{color:var(--good);font-size:14px;min-height:1.4em}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tab{display:grid;justify-items:center;gap:2px;min-height:52px;padding:6px 4px;border:0;border-radius:12px;background:transparent;color:var(--faint);font-size:11px;font-weight:600}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tab[data-v=home]{--tc:var(--accent)}
.tab[data-v=book]{--tc:var(--c-cyan)}
#shoptab{--tc:var(--c-yellow)}
.tab{transition:background .15s,color .15s}
.tab[aria-current=page]{color:var(--tc);background:color-mix(in srgb,var(--tc) 18%,transparent)}
.tab[aria-current=page] svg :is(rect,circle,path:first-child){fill:currentColor;fill-opacity:.28}
.tab[aria-current=page] .tl{font-weight:800}

.sheet{position:fixed;inset:0;z-index:30;background:var(--wash),var(--bg);overflow-y:auto;overscroll-behavior:contain}
.sheet.shop-open{z-index:5}   /* Version 146: im Shop bleibt die Tab-Leiste sichtbar, sie liegt dafür über dem Sheet statt darunter */
.sheet.shop-open .sin.shop{padding-bottom:104px}
.setov{position:fixed;inset:0;z-index:35;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}   /* Version 148: Einstellungen als Ebene übers laufende Spiel */
.sin{max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding:max(14px,env(safe-area-inset-top,0px)) 16px max(24px,env(safe-area-inset-bottom,0px))}
.shead{display:flex;align-items:center;gap:14px}
.iconbtn{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;stroke-linecap:round;fill:none}
.sbar{flex:1;height:6px;border-radius:999px;background:var(--raised);overflow:hidden}
.sbar i{display:block;height:100%;background:var(--rainbow);background-size:calc(100% / var(--p,1)) 100%;border-radius:inherit;transition:width .3s}
.scrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:-6px;min-height:40px}
.scl{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.scbox{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.scline{display:flex;align-items:baseline;gap:9px}
.scnum{display:inline-block;font:400 21px/1.1 var(--num);letter-spacing:.01em;font-variant-numeric:tabular-nums;transform-origin:right center;transition:transform .35s cubic-bezier(.34,1.56,.64,1);color:#fff;text-shadow:0 0 10px rgba(255,255,255,.45),0 0 2px rgba(255,255,255,.6)}
.scnum.bump{transform:scale(1.4)}
.scbox small{font-size:10px;margin-top:7px;color:var(--muted);font-variant-numeric:tabular-nums}
@keyframes scflow{to{background-position:200% 0}}
@media (prefers-reduced-motion:reduce){.scnum{animation:none}.scnum.bump{transform:none}}
.scount{min-width:42px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.smain{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:16px;padding-top:8px;padding-bottom:40px;animation:rise .22s ease-out}
/* Version 109: Die Kicker-Zeile ist nicht mehr sichtbar, bleibt aber für Screenreader im Dokument */
.kicker{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.bigword.tgt,.iopt.tgt{color:var(--c-pink)}
.introstep{font:800 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:-6px}
.wordtap{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 2px;color:inherit;border-radius:16px;-webkit-tap-highlight-color:transparent}
.wordtap .bigword{display:block}
.wordtap .gloss{display:block;margin-top:6px}
.wordtap:active{transform:scale(.98)}
/* Version 124: Neues-Wort-Screen zentriert, Wort poppt, Übersetzung per Tipp */
.intro1{justify-content:center;align-items:center;text-align:center;gap:22px;padding-bottom:14vh;cursor:pointer;position:relative}
.intro1 .wordtap{width:auto;text-align:center;padding:6px 10px}
.intro1 .bigword{font-size:clamp(46px,15vw,64px);line-height:1.05;animation:iwpop .6s cubic-bezier(.2,1.6,.4,1) both,iwshine 1.1s .45s ease-out both}
.intro1 .gloss{opacity:0;transform:translateY(12px);margin-top:12px;font-size:26px;transition:opacity .4s ease,transform .4s ease}
.intro1 .wordtap.shown .gloss{opacity:1;transform:none}
.intro1 .spk{animation:iwfade .4s .45s ease-out both}
.introc{text-align:center;padding-top:9vh;gap:22px}
.introc .bigword{font-size:clamp(44px,14vw,60px)}
.tapdot{position:absolute;left:50%;bottom:9vh;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--c-pink);opacity:.7;animation:tapdot 1.6s ease-in-out infinite}
@keyframes iwpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes iwshine{0%{text-shadow:0 0 0 rgba(255,92,157,0)}35%{text-shadow:0 0 34px rgba(255,92,157,.95),0 0 8px rgba(255,255,255,.7);filter:brightness(1.25)}100%{text-shadow:0 0 18px rgba(255,92,157,.35)}}
@keyframes iwfade{from{opacity:0;transform:translateY(8px)}}
@keyframes tapdot{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.8);opacity:.15}}
@media (prefers-reduced-motion:reduce){.intro1 .bigword,.intro1 .spk,.tapdot{animation:none}.intro1 .gloss{transition:none}}
.wordtap.tapped{animation:wtap .26s ease-out}
@keyframes wtap{40%{transform:scale(1.04)}100%{transform:scale(1)}}
.introrow{display:flex;align-items:center;gap:12px;margin-top:2px}
.spk{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--raised);color:var(--c-pink);display:grid;place-items:center;padding:0}
.spk svg{width:24px;height:24px}
.spk:active{transform:translateY(1px)}
.taphint{animation:tapblink 1.8s ease-in-out infinite}
@keyframes tapblink{50%{opacity:.45}}
.opts.two{grid-template-columns:1fr 1fr}
.gapslot{display:inline-block;min-width:3.2em;text-align:center;color:var(--c-pink);border-bottom:3px solid var(--c-pink);padding:0 4px}
.bigword{font:700 clamp(34px,10vw,50px)/1.05 var(--display);letter-spacing:-.015em;overflow-wrap:anywhere;text-wrap:balance}
.bigword.arc{font:400 clamp(44px,14vw,60px)/1.1 var(--num);letter-spacing:.01em;text-shadow:0 4px 0 rgba(0,0,0,.45)}
.gloss{font:500 24px/1.25 var(--display);color:var(--muted)}
.qform{display:grid;gap:10px;margin-top:6px}
.qform .field{font-size:20px;min-height:58px}
/* Puls beim Tippen: Ring pro Taste, Atem-Glühen solange Text im Feld steht */
.inwrap{position:relative;--pc:var(--accent);--pcs:rgba(245,102,185,.3)}
.inwrap .field{position:relative;z-index:1;transition:border-color .15s}
.inwrap::after{content:"";position:absolute;inset:0;border-radius:12px;border:3px solid var(--pc);opacity:0;pointer-events:none}
.inwrap.pulse::after{animation:ring .55s ease-out}
.inwrap.typing .field{border-color:var(--pc);animation:breathe 1.3s ease-in-out infinite}
@keyframes ring{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.06,1.4)}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 3px var(--pcs)}50%{box-shadow:0 0 0 9px rgba(0,0,0,0)}}
.tries{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--faint)}
.tries i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tries i.x{background:var(--line)}
.tries span{margin-left:4px}
.fb{min-height:1.5em}
.fb.bad{color:var(--bad)}
.res{border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.res.good{background:var(--good-soft);border-color:var(--good);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.res.bad{background:var(--bad-soft);border-color:var(--bad);animation:shake .35s}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
.confetti{position:fixed;width:0;height:0;pointer-events:none;z-index:80}
.confetti i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;background:var(--cf);animation:fly .95s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.3);opacity:0}}
.endstreak{display:flex;align-items:flex-end;gap:14px;font-size:15px;color:var(--muted)}
/* ---- Endscreens als Bühne (Version 126) ---- */
.endstage{justify-content:center;align-items:center;text-align:center;gap:14px;padding-bottom:5vh;cursor:pointer}
.endstage .rv{opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .4s ease,transform .45s cubic-bezier(.2,1.3,.4,1)}
.endstage .rv.on{opacity:1;transform:none;pointer-events:auto}
.es-lab{font:800 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.es-big{font:400 clamp(58px,19vw,84px)/1 var(--num);color:#fff;text-shadow:0 0 28px rgba(255,92,157,.55);font-variant-numeric:tabular-nums;margin:6px 0 0}
.es-big.lock{animation:eslock .55s cubic-bezier(.2,1.8,.4,1)}
.es-big.recd{color:#ffe08a;text-shadow:0 0 34px rgba(255,190,70,.9),0 0 8px rgba(255,255,255,.6)}
.es-big.recd.lock{animation:eslock .6s cubic-bezier(.2,1.8,.4,1),esrec 1.6s .6s ease-in-out infinite}
@keyframes eslock{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes esrec{50%{text-shadow:0 0 54px rgba(255,200,90,1),0 0 12px rgba(255,255,255,.8)}}
.es-rec{font:800 16px/1.2 var(--display);letter-spacing:.06em;color:#ffd166;text-shadow:0 0 14px rgba(255,190,70,.6)}
.es-parts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px;max-width:340px}
.es-parts span{font-size:13px;color:var(--muted);padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.endstage .chipline b.pulse{animation:eslock .5s ease-out}
.es-btns{display:grid;gap:10px;width:100%}
.endstage .btn.rv{width:100%}
@media (prefers-reduced-motion:reduce){.endstage .rv{transition:none}.es-big,.es-big.recd.lock{animation:none!important}}
.endstep.center{align-items:center;text-align:center}
.endstreak.big{flex-direction:column;align-items:center;gap:18px;margin:10px 0}
.endstreak.big b{display:block;font-size:72px;margin:0 0 2px}
.endstreak.big span{display:block;font-size:17px}
.endstreak.big .fl{width:120px;height:150px}
.endstreak.big small{margin-top:10px;font-size:16px}
.endstreak b{font:400 44px/1 var(--num);color:var(--c-orange);margin-right:4px}
.endstreak small{display:block;margin-top:4px;color:var(--c-yellow);font-weight:600}
.endstreak.grew{animation:bounce .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes bounce{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.res .rl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.res.good .rl{color:var(--good)}
.res.bad .rl{color:var(--bad)}
.pair{font:600 22px/1.3 var(--display);margin-top:6px;overflow-wrap:anywhere}
.pair em{font-style:normal;color:var(--faint);padding:0 6px}
.missed{display:flex;flex-wrap:wrap;gap:8px}
.missed span{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .3s}


/* Serien-Karte: Regenbogen-Rahmen, leuchtende Zahl, Flammen-Akzent */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
.streakcard{position:relative}
.streakcard.on{border:2px solid transparent;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(from var(--ang),#ff5c9d,#ffc23d,#6ee77a,#35dcd2,#5aa9ff,#a888ff,#ff5c9d) border-box;
  box-shadow:0 0 26px rgba(168,136,255,.22),0 0 12px rgba(255,138,61,.14);animation:ringspin 4.5s linear infinite}
@keyframes ringspin{to{--ang:360deg}}
/* Gamemodes-Kachel: Arcade-Stil in Blau-Türkis */
.gmcard{position:relative;overflow:hidden;border:0;border-bottom:5px solid rgba(5,40,90,.6);border-radius:20px;color:#fff;padding:12px 14px 12px 12px;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 5px),linear-gradient(100deg,#1d4ed8,#0ea5b7);box-shadow:inset 0 0 0 2px rgba(255,255,255,.22)}
.gmrow{display:flex;align-items:center;gap:8px}
.gmmain{flex:none;max-width:100%;display:flex;align-items:center;gap:14px;background:none;border:0;color:#fff;text-align:left;padding:6px 4px;min-height:56px;font:inherit;-webkit-tap-highlight-color:transparent}
.gmmain svg{flex:none;filter:drop-shadow(0 2px 0 rgba(5,40,90,.5))}
.gmmain b{font:800 23px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase;text-shadow:0 2px 0 rgba(5,40,90,.5)}
.gmcard .gmgo{margin-left:auto;flex:none;opacity:.9;filter:drop-shadow(0 2px 0 rgba(5,40,90,.5))}
.gmcard{cursor:pointer}
/* Shop ab Version 140 nur noch über die Chip-Pille erreichbar, keine eigene Kachel mehr */
/* Vokabelheft-Kachel auf dem Startscreen: wie die alte Fortschritt-Karte, aber antippbar (Version 140) */
.bookcard{display:block;width:100%;box-sizing:border-box;appearance:none;-webkit-appearance:none;font:inherit;text-align:left;cursor:pointer;position:relative;padding-right:46px}
.bookcard:active{transform:translateY(1px)}
.bookrow{display:flex;align-items:center;gap:8px}
.bookgo{position:absolute;right:18px;top:50%;transform:translateY(-50%)}
.bptog{display:block;width:100%;appearance:none;-webkit-appearance:none;background:none;border:0;margin:0;padding:0 34px 0 0;font:inherit;color:inherit;text-align:left;cursor:pointer;position:relative}   /* Version 151: Fortschritt im Vokabelheft ausklappbar */
.bptog .bookgo{right:0;transform:translateY(-50%) rotate(90deg);transition:transform .2s}.bptog[aria-expanded=true] .bookgo{transform:translateY(-50%) rotate(-90deg)}
.spkrow{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--raised);color:var(--c-pink);display:grid;place-items:center;padding:0}.spkrow svg{width:18px;height:18px}.spkrow:active{transform:translateY(1px)}
.bookprog{margin:0 0 16px}
.topl{display:flex;align-items:center;gap:10px;min-width:0}
.backbtn svg{width:20px;height:20px;stroke-width:2.6}
.gearbtn{width:40px;height:40px;color:var(--ink)}.gearbtn svg{width:20px;height:20px;stroke-width:2.2}
/* Chip-Stapel in der Daily Round (Version 139) */

button.chippill{font:inherit;cursor:pointer}
/* Shop-Screen (Version 138) */
.sin.shop{gap:12px;height:100%;min-height:0;box-sizing:border-box}
@media (max-height:700px){.sin.shop{gap:10px}.shdewi{width:100px;height:100px}.shdewi .dw{width:94px}}
.shtitle{flex:1;text-align:center;font:800 13px/1 var(--display);letter-spacing:.14em;color:var(--muted)}
.shroom{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}
.shdewi{width:128px;height:128px;flex:none;display:grid;place-items:center;border-radius:20px;background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.1),transparent 70%)}
.shdewi .dw{width:120px}
.shsay{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.shb{margin-top:0;padding:10px 12px;font-size:14px;line-height:1.35;border-radius:6px 18px 18px 18px;color:#2a1630}
.shinfo{font-size:12px;color:var(--muted)}
.shtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:4px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.shtab{height:36px;border-radius:12px;border:0;background:transparent;color:var(--muted);font:800 13px/1 var(--display)}
.shtab.on{background:var(--accent);color:var(--accent-ink)}
.shmine{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:13px;color:var(--muted)}
.shsw2{width:44px;height:26px;border-radius:999px;border:0;padding:3px;background:var(--line-soft);display:flex}
.shsw2 i{width:20px;height:20px;border-radius:50%;background:#fff;display:block;transition:transform .2s}
.shsw2.on{background:var(--accent)}.shsw2.on i{transform:translateX(18px)}
.shlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:3px 3px 6px;margin:0 -3px}

.shgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.shit{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--text);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.shit.r-common{border-color:#5aa9ff}.shit.r-rare{border-color:#a888ff}.shit.r-legendary{border-color:#ffc23d}.shit.r-shield{border-color:#8fd8ff}

.shart{width:58px;height:58px;display:grid;place-items:center}
.shart .dw{width:58px}
.shsw{width:52px;height:52px;border-radius:14px;overflow:hidden;display:grid;grid-template-rows:2fr 1fr 1fr;border:2px solid #2a1630}
.shshield svg{width:52px;height:52px;display:block}
.shn{font:700 12px/1.1 var(--display);text-align:center}
.sht{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#ffc23d}
.shit.own .sht{color:var(--muted)}.shit.eq .sht{color:var(--c-cyan)}
.shc{width:14px;height:14px;display:block}
#shact[aria-disabled=true]{background:var(--surface);color:var(--faint);box-shadow:none}
.gmmain:active{transform:translateY(1px)}
.gmcard .cq{margin-left:0;top:0;border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff}
.gmcard .cq.on{background:#fff;color:#0f5ba8}
.gmcard .cqtext{margin:8px 4px 4px;color:rgba(255,255,255,.96);font-weight:600;text-shadow:0 1px 0 rgba(5,40,90,.45)}
.card.prog{border-radius:20px;border-bottom:5px solid #2fd5c3}
.streakcard.on .streak b,.endstreak.on b{animation:numcolor 6s linear infinite;text-shadow:0 0 16px currentColor}
@keyframes numcolor{0%,100%{color:#ff7a2e}50%{color:#ffd04a}}

/* Level-up-Vollbild */
.lvl{position:fixed;inset:0;z-index:70;display:grid;place-items:center;overflow:hidden;cursor:pointer;
  background:radial-gradient(circle at 50% 44%,#5a2370 0%,#2a1233 55%,#12081a 100%);animation:lvlin .22s ease-out}
.lvl.out{animation:lvlout .3s ease-in forwards}
.lvl-rays{position:absolute;left:50%;top:44%;width:190vmax;height:190vmax;margin:-95vmax 0 0 -95vmax;opacity:.38;
  background:repeating-conic-gradient(from 0deg,var(--c-pink) 0 6deg,transparent 6deg 18deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 42%);mask-image:radial-gradient(circle,#000 0,transparent 42%);
  animation:lvlspin 18s linear infinite,lvlhue 3.5s linear infinite}
.lvl-in{position:relative;display:grid;justify-items:center;gap:20px;padding:0 24px;text-align:center}
.lvl-lab{font:800 30px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;
  background:linear-gradient(90deg,var(--c-yellow),var(--c-pink),var(--c-violet),var(--c-cyan),var(--c-green),var(--c-yellow));background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:lvldrop .5s cubic-bezier(.2,1.6,.4,1),lvlslide 2.4s linear infinite}
.lvl-badge{position:relative;width:168px;height:168px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(from 0deg,#ff5c9d,#ffc23d,#6ee77a,#35dcd2,#5aa9ff,#a888ff,#ff5c9d);
  box-shadow:0 0 70px rgba(255,194,61,.45),0 0 0 6px rgba(255,255,255,.08);animation:lvlpop .7s cubic-bezier(.2,1.8,.4,1) both}
.lvl-badge::before{content:"";position:absolute;inset:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7a2f8f,#2a1233)}
.lvl-badge span{position:relative;font:400 96px/1 var(--num);color:#fff;text-shadow:0 0 24px rgba(255,194,61,.8)}
.lvl-pips{display:flex;gap:8px}
.lvl-pips i{width:38px;height:12px;border-radius:6px;background:rgba(255,255,255,.14)}
.lvl-pips i.on{background:var(--pc);box-shadow:0 0 14px var(--pc);animation:lvlfill .35s cubic-bezier(.2,1.8,.4,1) both;animation-delay:var(--d)}
.lvl-word{font:700 26px/1.2 var(--display);animation:lvlrise .4s .45s ease-out both}
.lvl-sub{color:var(--muted);font-size:15px;animation:lvlrise .4s .6s ease-out both}
@keyframes lvlin{from{opacity:0}to{opacity:1}}
@keyframes lvlout{to{opacity:0;transform:scale(1.04)}}
@keyframes lvlspin{to{transform:rotate(360deg)}}
@keyframes lvlhue{to{filter:hue-rotate(360deg)}}
@keyframes lvlslide{to{background-position:200% 0}}
@keyframes lvldrop{from{opacity:0;transform:translateY(-30px) scale(.7)}to{opacity:1;transform:none}}
@keyframes lvlpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}
@keyframes lvlfill{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
@keyframes lvlrise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Fehlerliste, Satz-Übung, Bausteine */
.num:nth-child(3) b{color:var(--c-orange)}
.missed em{font-style:normal;color:var(--bad);margin-left:6px;font-size:12px;font-weight:700}
.tag.err{color:var(--bad)}
.ex{border-left:3px solid rgba(255,92,157,.55);padding:2px 0 2px 14px;display:grid;gap:4px}
.ex .xi{font:600 20px/1.3 var(--display)}
.ex .xi b{color:var(--c-pink);font-weight:700}
.ex .xe{color:var(--muted)}
.ex .xe b{color:var(--text);font-weight:700}
.sentbox{font:600 24px/1.35 var(--display);text-wrap:balance}
.sentbox .slot{color:var(--c-pink);border-bottom:3px solid var(--c-pink);padding:0 2px}
.swstage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 4px;min-height:184px}
.swstage .swres{width:100%}
.swstage.answered .swcard{position:absolute;top:8px;pointer-events:none}
.smain #nx,.smain #next{scroll-margin-bottom:20px}
.swcard{position:relative;width:min(100%,300px);min-height:176px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:24px;background:linear-gradient(160deg,var(--raised),var(--surface));border:1.5px solid var(--line);border-bottom-width:4px;font:700 36px/1.15 var(--display);text-wrap:balance;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 14px 34px rgba(0,0,0,.3);will-change:transform;transition:transform .3s cubic-bezier(.2,1.25,.4,1),opacity .3s,border-color .15s}
.swcard.long{font-size:25px}
.swcard.drag{transition:border-color .15s;cursor:grabbing}
.swcard.lean{border-color:#f566b9}
.swcard.gone{opacity:0;transition:transform .32s ease-in,opacity .32s}
.swopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.swb{min-height:70px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);border-bottom-width:3px;background:var(--surface);font-size:17px;font-weight:700;text-align:center;justify-content:center;transition:border-color .15s,background .15s,transform .15s}
.swb i{font-style:normal;color:var(--faint);font-size:20px;flex:none}
.swb span{flex:1;overflow-wrap:anywhere}
.swb.lean{border-color:#f566b9;background:rgba(245,102,185,.14);transform:translateY(-2px)}
.swb.ok{border-color:var(--good);background:var(--good-soft)}
.swb.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.swb:disabled{cursor:default}
.opts{display:grid;gap:10px}
.opt,.iopt{min-height:54px;text-align:left;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);border-bottom-width:3px;background:var(--surface);font-size:17px;font-weight:600}
.opt:active:not(:disabled),.iopt:active:not(:disabled){transform:translateY(2px)}
.opt:disabled,.iopt:disabled{cursor:default}
.opt.ok,.iopt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no,.iopt.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.iopt{text-align:center;font-size:18px}
.sentbox b{color:var(--c-pink);font-weight:700}
.sentbox.tr b{color:var(--text)}
.ans{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;align-content:flex-start;border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);border-bottom-width:3px;background:var(--raised);font:600 17px var(--body);color:var(--text)}
.tile:active:not(:disabled){transform:translateY(2px)}
.bslot{display:inline-block;box-sizing:border-box;width:62px;height:44px;border-radius:12px;border:2px dashed var(--line-soft);background:var(--surface)}
.tile.given{display:inline-flex;align-items:center;box-sizing:border-box;min-height:44px;border:2px solid rgba(168,136,255,.38);background:rgba(168,136,255,.10);color:#bba8ee}
.sentbox .gv{color:#bba8ee;border-bottom:2px solid rgba(168,136,255,.5);padding:0 2px}
.tile.ghost{display:inline-flex;align-items:center;background:var(--surface);border:1.5px dashed var(--line-soft);color:transparent}
.ans.good .tile:not(.given){border-color:var(--good);background:var(--good-soft)}
.ans.bad .tile:not(.given){border-color:var(--bad);background:var(--bad-soft)}

/* ---- Leben und Lückensatz ---- */
.lives{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--faint)}
.lives svg{width:21px;height:21px;fill:var(--c-pink);filter:drop-shadow(0 0 5px rgba(255,92,157,.45))}
.lives svg.x{fill:var(--line);filter:none}
.lives svg.x:not(.fill){animation:heartpop .4s}
.lives svg .hf{fill:var(--c-pink);filter:drop-shadow(0 0 4px rgba(255,92,157,.5))}
.lives svg:not(.x){animation:hbeat 4.8s ease-in-out infinite}
.lives svg:not(.x):nth-child(2){animation-delay:.7s}
.lives svg:not(.x):nth-child(3){animation-delay:1.4s}
.lives svg.heal{animation:heal 1.2s cubic-bezier(.2,1.4,.4,1) both,hbeat 4.8s 1.2s ease-in-out infinite}
@keyframes hbeat{0%,45%,100%{transform:scale(1)}22%{transform:scale(1.13)}}
@keyframes heal{0%{transform:scale(.1);filter:drop-shadow(0 0 0 rgba(255,92,157,0))}55%{transform:scale(1.45);filter:drop-shadow(0 0 12px rgba(255,92,157,.95))}100%{transform:scale(1)}}
.lives span{margin-left:4px}
@keyframes heartpop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.sentbox.tr{font:500 18px/1.4 var(--body);color:var(--muted)}
.gapbox{line-height:1.9}
.gap{display:inline-block;min-width:92px;min-height:40px;vertical-align:middle;padding:0 12px;margin:0 2px;border-radius:12px;border:2px dashed var(--c-yellow);color:var(--c-yellow);text-align:center;line-height:36px;font-weight:700}
.gap.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft);color:var(--text);animation:shake .35s}
.gap.good{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--text)}
.ord{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0;align-content:flex-start;min-height:72px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);position:relative}
.grip{display:inline-block;width:10px;height:16px;margin-right:9px;vertical-align:-3px;opacity:.5;
  background-image:radial-gradient(circle,currentColor 1.6px,transparent 1.7px);background-size:5px 5px;background-position:0 1px}
.otile.dragging .grip{opacity:.85}
.otile.wig{animation:wig .7s ease-in-out .35s 2}
@keyframes wig{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}60%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.otile.wig{animation:none}}
.otile{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.otile.dragging{position:fixed;z-index:80;margin:0;cursor:grabbing;border-color:var(--c-yellow);background:var(--surface);box-shadow:0 12px 26px rgba(0,0,0,.5);transform:scale(1.07) rotate(-2.5deg);transition:none}
.otile.dragging.landing{transform:none;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.oph{display:inline-block;box-sizing:border-box;border:2px solid var(--line-soft);border-radius:12px;background:rgba(255,255,255,.05)}
.ord .otile.good{border-color:var(--good);background:var(--good-soft)}
.ord .otile.bad{border-color:var(--bad);background:var(--bad-soft)}
.ordhint{text-align:center;margin:10px 0 0}
.tile.wrong{opacity:.35;text-decoration:line-through}
.tile.ok{border-color:var(--good);background:var(--good-soft)}
/* ---- Große Momente: Herz zurück und Serienstand (Version 123) ---- */
.moment{position:fixed;inset:0;z-index:80;display:grid;grid-template-columns:minmax(0,100%);place-content:center;place-items:center;cursor:pointer;
  background:rgba(10,4,18,.8);backdrop-filter:blur(4px);animation:mmin .22s ease-out}
.moment.out{animation:mmout .25s ease-in forwards}
@keyframes mmin{from{opacity:0}}
@keyframes mmout{to{opacity:0}}
.mm-in{display:grid;justify-items:center;gap:12px;text-align:center;padding:0 24px}
.mm-lab{font:800 15px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--text)}
.mm-sub{font-size:15px;color:var(--muted)}
.mm-tap{font-size:13px;color:var(--faint);margin-top:10px;animation:tapblink 1.8s ease-in-out infinite}
.mm-art{position:relative;display:grid;place-items:center}
/* Herz: rosa Puls und Herzschlag */
.moment.heart .mm-art{width:210px;height:200px}
.moment.shield .mm-art{position:relative;width:160px;height:160px;display:grid;place-items:center}
.moment.shield .mm-art::before{content:"";position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(143,216,255,.35),transparent 65%)}
.moment.shield .mm-art svg{position:relative;width:132px;height:132px;animation:lvlrise .45s ease-out both}
.moment.shield .mm-lab{color:#c9efff}
.moment.heart .mm-art::before{content:"";position:absolute;inset:-26px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,92,157,.5),transparent 66%);animation:mmglow 1.6s ease-in-out infinite}
.moment.heart svg{position:relative;width:152px;height:152px;fill:var(--c-pink);
  filter:drop-shadow(0 0 26px rgba(255,92,157,.85));animation:hmpop .55s cubic-bezier(.2,1.6,.4,1) both,hmbeat 1.5s .55s ease-in-out infinite}
.moment.heart .mm-big{font:400 44px/1 var(--num);color:#fff;text-shadow:0 0 18px rgba(255,92,157,.9);animation:lvlrise .4s .3s ease-out both}
@keyframes hmpop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes hmbeat{0%,62%,100%{transform:scale(1)}16%{transform:scale(1.13)}34%{transform:scale(1.05)}}
@keyframes mmglow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.12)}}
/* Serie: Flamme steigt auf, Funken fliegen */
.moment.streak .mm-art{width:230px;height:240px}
.moment.streak .mm-art::before{content:"";position:absolute;inset:-18px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,138,61,.45),transparent 68%);animation:mmglow 2s ease-in-out infinite}
.moment.streak .fl{position:relative;width:168px;height:210px;animation:flup .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes flup{0%{transform:translateY(46px) scale(.5);opacity:0}100%{transform:none;opacity:1}}
.moment.streak .mm-big{font:400 84px/1 var(--num);color:var(--c-orange);text-shadow:0 0 26px rgba(255,138,61,.8);animation:lvlrise .4s .3s ease-out both}
/* Level-up der Zahl: alte rutscht nach oben weg, neue springt von unten rein, Lichtring */
.mm-roll{position:relative;display:grid;place-items:center;height:84px;min-width:140px;overflow:visible}
.mm-roll b{grid-area:1/1;font:400 84px/1 var(--num);color:var(--c-orange);text-shadow:0 0 26px rgba(255,138,61,.8)}
.mm-roll .ro{animation:rolout .38s .62s cubic-bezier(.5,0,1,.6) both}
.mm-roll .rn{animation:rolin .55s .85s cubic-bezier(.2,1.7,.4,1) both;color:#fff3c4;text-shadow:0 0 34px rgba(255,170,60,1),0 0 10px rgba(255,138,61,.9)}
.mm-roll::after{content:"";position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;
  border:3px solid rgba(255,200,90,.9);opacity:0;animation:rolring .7s 1.05s ease-out both}
@keyframes rolout{to{transform:translateY(-70px) scale(.6);opacity:0}}
@keyframes rolin{0%{transform:translateY(80px) scale(.5);opacity:0}100%{transform:none;opacity:1}}
@keyframes rolring{0%{opacity:.95;transform:scale(.4)}100%{opacity:0;transform:scale(2.6)}}
.moment.ms .mm-roll .rn{animation-name:rolin,msglow;animation-duration:.55s,1.4s;animation-delay:.85s,1.4s;animation-iteration-count:1,infinite;animation-fill-mode:both,none}
@keyframes msglow{50%{text-shadow:0 0 52px rgba(255,200,90,1),0 0 14px rgba(255,138,61,1)}}
.mm-ms{font:800 14px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--c-yellow);animation:lvlrise .4s 1.3s ease-out both}
.mm-em{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.mm-em i{position:absolute;bottom:10px;width:6px;height:6px;border-radius:2px;background:var(--c-yellow);opacity:0;animation:mmem 2.3s linear infinite}
@keyframes mmem{0%{opacity:0;transform:translateY(0) scale(.5)}14%{opacity:.95}100%{opacity:0;transform:translateY(-250px) scale(.2)}}
@media (prefers-reduced-motion:reduce){.moment,.moment *{animation:none!important}.mm-roll .ro{display:none}}

/* ---- Maskottchen Dewi ---- */
.mascot{display:flex;align-items:center;gap:10px;margin:2px 0 4px}
.mascot .dw{flex:none;width:104px}
.mascot.sm .dw{width:84px}
.mascot.col{flex-direction:column;text-align:center}
.mascot.col .dw{width:150px}
.dw svg{display:block;width:100%;height:auto;overflow:visible}
.mascot .dw{animation:dwpop .5s cubic-bezier(.2,1.5,.4,1) both}
.mascot .dw svg{transform-origin:50% 90%;will-change:transform}
/* Minimale Schleifen je Stimmung: höchstens ca. 2° und 3,5 % Größe */
.dw.m-haughty svg{animation:dw-haughty 5.2s ease-in-out infinite}
.dw.m-bored svg{animation:dw-bored 6.8s ease-in-out infinite}
.dw.m-annoyed svg{animation:dw-annoyed 3.2s ease-in-out infinite}
.dw.m-sly svg{animation:dw-sly 3.8s ease-in-out infinite}
.dw.m-shades svg{animation:dw-shades 3.2s ease-in-out infinite}
.dw.m-sleep svg{animation:dw-sleep 4.4s ease-in-out infinite}
.dw.m-mean svg{animation:dw-mean 3.6s ease-in-out infinite}
.dw.m-superior svg{animation:dw-superior 5.6s ease-in-out infinite}
.dw.m-uninterested svg{animation:dw-uninterested 7.4s ease-in-out infinite}
.dw.m-surprised svg{animation:dw-surprised 1.7s ease-in-out infinite}
.dw.m-cash svg{animation:dw-cash 1.9s ease-in-out infinite}
.dw.m-sigh svg{animation:dw-sigh 3.4s ease-in-out infinite}
.dw .puff circle{fill:#fff;stroke:#b9c4e0;stroke-width:2.4}
.dw .puff{transform-box:fill-box;transform-origin:0 50%;animation:bpuff 3.4s ease-out infinite}
@keyframes dwpop{0%{transform:scale(.86) translateY(5px);opacity:0}55%{transform:scale(1.06);opacity:1}100%{transform:none;opacity:1}}
@keyframes dw-haughty{0%,100%{transform:rotate(-1.2deg) scale(1)}50%{transform:rotate(.8deg) scale(1.02)}}
@keyframes dw-bored{0%,100%{transform:rotate(-1.6deg) translateY(0)}50%{transform:rotate(1.6deg) translateY(1.5px)}}
@keyframes dw-annoyed{0%,60%,100%{transform:none}66%{transform:rotate(-.9deg)}72%{transform:rotate(.9deg)}78%{transform:rotate(-.7deg)}84%{transform:rotate(.6deg)}90%{transform:none}}
@keyframes dw-sly{0%,100%{transform:rotate(0) scale(1)}45%,60%{transform:rotate(2.2deg) scale(1.02)}}
@keyframes dw-shades{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.015)}}
@keyframes dw-sleep{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes dw-mean{0%,100%{transform:scale(1) rotate(-.8deg)}50%{transform:scale(1.03) rotate(.4deg)}}
@keyframes dw-superior{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-2px) rotate(.4deg)}}

  L.words=[];L.catCount=L.cats.map(()=>0);
  L.cats.forEach((c,ci)=>c[1].split('\n').forEach(line=>{
    const i=line.indexOf(' = ');if(i<1)return;
    const id=line.slice(0,i).trim(),en=line.slice(i+3).trim();if(!id||!en)return;
    const wd={k:(L.kp||'')+id.toLowerCase(),id,en,cat:ci};
    if(L.alts)wd.alts=L.alts[id.toLowerCase()]||[];   // Schreibvarianten (z. B. britisch), zählen beim Tippen
    L.words.push(wd);L.catCount[ci]++;
  }));
});

EN_SENT_RAW.split('\n').forEach(l=>{
  const q=l.split(' | ');if(q.length<3)return;
  const m=q[2].match(/\[([^\]]+)\]/);if(!m)return;
  const de=q[2].replace(/[\[\]]/g,'').trim();
  SENT[LANGS.en.kp+q[0].trim().toLowerCase()]={id:q[1].trim(),tpl:q[2].trim(),det:q[2].trim(),en:de,de,slot:m[1]};
});

function migrate(){
  if(!state.list){
    state.list={};
    const y=addDays(today(),-1);
    Object.keys(state.progress||{}).forEach(lg=>{
      const m=state.list[lg]=state.list[lg]||{},pr=state.progress[lg];
      Object.keys(pr).forEach(k=>{if(pr[k].l===0){m[k]={n:1,s:y};pr[k].d=FAR;}});
    });
  }
  if(!state.daily)state.daily={date:'',newCount:0,extra:0,lt:[]};
  if(!state.daily.lt)state.daily.lt=[];
  if(!state.daily.got)state.daily.got=[];
  if(!state.flawed||typeof state.flawed!=='object')state.flawed={};
  /* Version 131: Die Fehlerliste entfällt. Ihre Wörter gehen auf Stufe 0, sind ab sofort fällig (Vorrang im Review,
     am längsten wartende zuerst: Fälligkeit = Tag, an dem sie auf die Liste kamen). Der Fehlerzähler wandert als n ins Wort.
     Läuft bei jedem Start und nach dem Einspielen alter Sicherungen; ist die Liste leer, passiert nichts. */
  {
    const t0=today();
    Object.keys(state.list||{}).forEach(lg=>{
      const m=state.list[lg]||{},pr=state.progress[lg]||(state.progress[lg]={});
      Object.keys(m).forEach(k=>{const e=m[k]||{},q=pr[k]||{};pr[k]={l:0,d:e.s&&e.s<t0?e.s:t0,n:Math.max(e.n|0,q.n|0,1)};});
    });
    state.list={};
    Object.keys(state.progress||{}).forEach(lg=>{const pr=state.progress[lg]||{};Object.keys(pr).forEach(k=>{if(pr[k]&&pr[k].d===FAR)pr[k].d=t0;});});
  }
  /* Version 147: Der Deutschkurs hat keine Artikel mehr („de:der nachbar“ → „de:nachbar“). Fortschritt, Tageslisten und
     ein offener Run wandern auf die neuen Schlüssel. „das dort“ ist ein Pronomen und bleibt. Der Morgen, das Essen und der Arm
     sind entfallen (sie sähen ohne Artikel aus wie morgen, essen, arm) – ihr Fortschritt wird gelöscht, nicht vermischt.
     Läuft bei jedem Start, findet nach dem ersten Mal aber nichts mehr. */
  {
    const DROP={'de:der morgen':1,'de:das essen':1,'de:der arm':1},KEEP={'de:das dort':1};
    const nk=k=>{if(KEEP[k])return k;if(DROP[k])return null;const m=/^de:(?:der|die|das) (\S+)$/.exec(k);return m?'de:'+m[1]:k;};
    const pr=state.progress&&state.progress.de;
    if(pr)Object.keys(pr).forEach(k=>{const n=nk(k);if(n===k)return;if(n&&!pr[n])pr[n]=pr[k];delete pr[k];});
    const d=state.daily;
    if(d)['lt','got'].forEach(f=>{if(Array.isArray(d[f]))d[f]=d[f].map(k=>typeof k==='string'&&k.indexOf('de:')===0?nk(k):k).filter(k=>k!==null);});
    const r=state.run;
    if(r&&r.lang==='de'&&Array.isArray(r.items)){
      if(r.items.some(x=>nk(x.k)===null))state.run=null;   // Run mit entfallenem Wort: verwerfen statt kaputt fortsetzen
      else{r.items.forEach(x=>{x.k=nk(x.k);});if(Array.isArray(r.missed))r.missed=r.missed.map(nk);}
    }
  }
  /* Version 132: Diamanten werden Chips, Kontostand einmalig × 10 (chipV steht bewusst nicht in defaults()) */
  if(!state.chipV){
    state.chips=Math.max(state.chips|0,(state.gems|0)*10);state.chipShown=Math.min(state.chips,(state.gemShown|0)*10);
    delete state.gems;delete state.gemShown;delete state.gemSurv;state.chipV=1;
  }
  if(!Array.isArray(state.owned))state.owned=[];
  if(!state.equip||typeof state.equip!=='object')state.equip={};
  if(!state.musDef){state.musDef=1;state.music=true;if(!(+state.mvol>0))state.mvol=35;}   // Version 103: Musik ist jetzt standardmäßig an (einmalig auch für bestehende Stände)
  if(!state.holoDef){state.holoDef=1;state.mtrack='holo';}   // Version 129: Holo-Aufstieg (seit Version 151 „Indie“) ist der neue Standard-Soundtrack (einmalig für alle Stände)
  if(!Array.isArray(state.chars)||!state.chars.includes('dewi'))state.chars=['dewi'].concat(Array.isArray(state.chars)?state.chars:[]);
  if(!state.char)state.char='dewi';
  if(!state.best||typeof state.best!=='object')state.best={};
  if(!state.bestV){   // Version 79: Score hat jetzt feinere Punkte, alte Rekorde (je Sieg 1 Punkt) werden x100 umgerechnet
    Object.keys(state.best).forEach(lg=>{const m=state.best[lg];if(m&&typeof m==='object')Object.keys(m).forEach(k=>{m[k]=Math.round((m[k]||0)*100);});});
    state.bestV=2;
  }
  delete state.newPerDay;
  if(!state.ui&&state.lang)state.ui=detectUi();   // bestehende Nutzer: Sprache des Handys, ohne Nachfrage
  if(!Array.isArray(state.form))state.form=[];
  if(state.quips===undefined)state.quips=true;
  if(!state.stamps||typeof state.stamps!=='object')state.stamps={};
  if(typeof state.name!=='string')state.name='';
  if(state.nameAsked===undefined)state.nameAsked=false;
  if(state.sound===undefined)state.sound=true;
  if(typeof state.vol!=='number')state.vol=40;
  if(typeof state.dvol!=='number')state.dvol=state.vol;   // Version 151: eigener Regler für Dewis Stimme, startet so laut wie bisher (Effekt-Lautstärke)
  if(!state.mus151){state.mus151=1;if(state.music!==true)state.mvol=0;}   // Version 151: Musik nur noch über den Regler, ausgeschaltete Musik steht auf 0
  state.music=(+state.mvol||0)>0;
  if(typeof state.roundN!=='number')state.roundN=10;
  state.v=2;
  save();
}

const curLang=()=>LANGS[state.lang];

/* Plan der nächsten Daily Round (Version 131, ohne Fehlerliste):
   fresh  = das eine neue Wort (erstes noch ungesehenes) oder null
   review = 4 bekannte Wörter (ohne neues Wort 5):
            1. Vorrang: fällige Wörter auf Stufe 0 (verlorenes Modul), am längsten wartende zuerst
            2. dann wie bisher: die 2 am längsten überfälligen + zufällige weitere fällige
            3. aufgefüllt mit noch nicht fälligen (früheste Fälligkeit zuerst)
            Die Reihenfolge in der Round wird gemischt. */
function plan(){
  const L=curLang(),t=today(),prog=state.progress[L.id]||{};
  const fresh=L.words.find(w=>!prog[w.k])||null;
  const want=fresh?4:5;
  const known=L.words.filter(w=>prog[w.k]);
  const byD=(a,b)=>prog[a.k].d<prog[b.k].d?-1:prog[a.k].d>prog[b.k].d?1:(a.k<b.k?-1:1);
  const due=known.filter(w=>prog[w.k].d<=t).sort(byD);
  let pick=due.filter(w=>prog[w.k].l===0).slice(0,want);
  const rest=due.filter(w=>pick.indexOf(w)<0);
  const over=rest.slice(0,Math.max(0,Math.min(2,want-pick.length)));
  pick=pick.concat(over);
  pick=pick.concat(shuffle(rest.slice(over.length)).slice(0,want-pick.length));
  if(pick.length<want)pick=pick.concat(known.filter(w=>pick.indexOf(w)<0).sort(byD).slice(0,want-pick.length));
  return {fresh,review:shuffle(pick)};
}
function streak(){   // Version 137: geschützte Tage (Streak-Schutz) überbrücken die Serie, zählen aber nicht mit
  const t=today(),sh=state.shielded||{};let d=state.done[t]?t:addDays(t,-1),n=0;
  while(state.done[d]||sh[d]){if(state.done[d])n++;d=addDays(d,-1);}
  return n;
}
function record(w,ok,type){
  const L=curLang(),prog=state.progress[L.id]||(state.progress[L.id]={});
  const prev=prog[w.k],dq=daily(),n0=prev?prev.n|0:0;
  let res;
  if(ok){   // Stufe +1 (max. 5), nächster Termin nach INTERVALS; ein Wort auf Stufe 0 steigt so auf Stufe 1 (morgen)
    const level=Math.min((prev?prev.l:0)+1,5);
    const days=INTERVALS[level-1];
    prog[w.k]={l:level,d:addDays(today(),days)};
    if(n0)prog[w.k].n=n0;
    res={level,days,saved:!!prev&&prev.l===0};
  }else{   // Version 131: verloren = Stufe 0, morgen fällig, Fehlerzähler n +1 (für Dewis „Zum {n}. Mal“)
    prog[w.k]={l:0,d:addDays(today(),1),n:n0+1};
    res={n:n0+1};
  }
  state.form=(state.form||[]).concat(ok?1:0).slice(-12);
  if(!prev)dq.newCount++;
  if(ok&&dq.got.indexOf(w.k)<0)dq.got.push(w.k);
  save();
  return res;
}

function pfFrame(tip,c){

   Physik: Federn (Position, Neigung, Größe). Beim Halten folgt die Marke dem Finger fast 1:1 und schnell (steife, fast kritisch gedämpfte Feder),
   weiche Begrenzung statt hartem Anschlag; die Neigung folgt zusätzlich der Geschwindigkeit. Beim Loslassen federt sie federnd zurück (unterdämpft). */
function makeStampSim(idle){
  const MX=120,MY=150,rub=(v,m)=>m*Math.tanh(v/m),clamp=(v,m)=>Math.max(-m,Math.min(m,v));
  const S={x:0,y:0,vx:0,vy:0,rx:0,ry:0,vrx:0,vry:0,s:1,vs:0,tx:0,ty:0,held:false,t:0,lift:0,px:0,py:0};
  const sp=(p,v,target,k,c,h)=>{v+=(k*(target-p)-c*v)*h;return [p+v*h,v];};
  S.press=()=>{S.held=true;S.tx=S.x;S.ty=S.y;};
  S.drag=(dx,dy)=>{S.tx=rub(dx,MX);S.ty=rub(dy,MY);};
  S.release=()=>{S.held=false;S.tx=0;S.ty=0;};
  S.step=dt=>{
    dt=Math.min(Math.max(dt,0),.05);
    const n=Math.max(1,Math.ceil(dt*240)),h=dt/n;
    for(let i=0;i<n;i++){
      S.t+=h;
      const k=S.held?900:420,c=S.held?2*Math.sqrt(900)*.9:2*Math.sqrt(420)*.42;
      [S.x,S.vx]=sp(S.x,S.vx,S.tx,k,c,h);[S.y,S.vy]=sp(S.y,S.vy,S.ty,k,c,h);
      const sw=(idle&&!S.held)?1:0;
      const try_=clamp(S.x/MX*30+S.vx*.012,32)+Math.sin(S.t*1.3)*6*sw;
      const trx=clamp(-S.y/MY*30-S.vy*.012,32)+Math.cos(S.t*1.3)*4*sw;
      [S.ry,S.vry]=sp(S.ry,S.vry,try_,420,2*Math.sqrt(420)*.55,h);
      [S.rx,S.vrx]=sp(S.rx,S.vrx,trx,420,2*Math.sqrt(420)*.55,h);
      [S.s,S.vs]=sp(S.s,S.vs,S.held?1.06:1,520,2*Math.sqrt(520)*.7,h);
    }
    S.px=clamp(S.ry/32,1);S.py=clamp(-S.rx/32,1);
    S.lift=Math.min(1,Math.hypot(S.px,S.py)*.7+Math.max(0,(S.s-1)/.06)*.3);
    return S;
  };
  return S;
}

  const card=$('#svcard',o),sh=$('#svsh',o),sim=makeStampSim(!reduceMotion());let sx=0,sy=0,last=0;
  const apply=()=>{
    card.style.transform=`perspective(700px) rotateX(${sim.rx.toFixed(2)}deg) rotateY(${sim.ry.toFixed(2)}deg) scale(${sim.s.toFixed(4)})`;
    card.style.setProperty('--px',sim.px.toFixed(3));card.style.setProperty('--py',sim.py.toFixed(3));
    card.style.setProperty('--g',Math.min(1,Math.hypot(sim.px,sim.py)).toFixed(3));
    sh.style.transform=`scale(${(1+sim.lift*.14).toFixed(3)})`;
    sh.style.opacity=(.85-sim.lift*.3).toFixed(2);
  };
  const loop=ts=>{sim.step(last?(ts-last)/1000:.016);last=ts;apply();svRaf=requestAnimationFrame(loop);};
  apply();svRaf=requestAnimationFrame(loop);
  const down=e=>{
    sim.press();sx=e.clientX;sy=e.clientY;card.classList.add('held');

  const up=()=>{if(!sim.held)return;sim.release();card.classList.remove('held');};
  card.addEventListener('pointerdown',down);card.addEventListener('pointermove',move);
  card.addEventListener('pointerup',up);card.addEventListener('pointercancel',up);card.addEventListener('lostpointercapture',up);
}

/* Version 144: Vom linken Bildschirmrand nach rechts wischen = zurück, wie der Pfeil oben links.
   Version 151: überall außer im laufenden Spiel – Vokabelheft, Einstellungen, Shop, Gamemodes, Blind-Wahl und die
   Einstellungen im Spiel. Startstreifen doppelt so breit (48 px) und Touch- statt Pointer-Ereignisse: Safari bricht
   Pointer-Gesten ab, sobald der Finger leicht nach oben/unten wandert (es hält das für Scrollen), Touch-Ereignisse laufen weiter. */
const EDGESW=(function(){
  const EDGE=48,DX_MIN=60,SKIP='input,textarea,select,.chips';
  let p0=null;
  /* Was ein Zurück-Wisch gerade auslösen würde; null = hier nicht */
  function target(){
    if($('.askbox,.lvl,.moment,.stampview'))return null;   // Rückfrage oder Feier-Moment offen
    const ov=$('#setov');if(ov&&!ov.hidden)return ()=>{ov.hidden=true;};   // Einstellungen im Spiel: zurück ins Spiel
    if(!sheet.hidden){
      if(S)return null;   // laufende Round oder ihr Endscreen: nie
      const b=$('.shead .iconbtn',sheet);   // Shop, Gamemodes, Playmodes, Blind-Wahl: derselbe Knopf wie oben links
      return b?()=>b.click():null;
    }
    if(view==='book'||view==='settings')return ()=>go('home');
    return null;
  }
  function down(x,y,el){p0=(x>EDGE||(el&&el.closest&&el.closest(SKIP))||!target())?null:{x,y};}
  function move(x,y){if(p0&&Math.abs(y-p0.y)>Math.max(90,(x-p0.x)*1.2))p0=null;}   // klar senkrecht = Scrollen
  function up(x,y){
    const p=p0;p0=null;if(!p)return false;
    const dx=x-p.x,dy=y-p.y;
    if(dx<DX_MIN||Math.abs(dy)>dx)return false;
    const f=target();if(!f)return false;
    f();return true;
  }
  try{
    document.addEventListener('touchstart',e=>{if(e.touches.length!==1){p0=null;return;}const t=e.touches[0];down(t.clientX,t.clientY,e.target);},{passive:true});
    document.addEventListener('touchmove',e=>{const t=e.touches[0];if(t)move(t.clientX,t.clientY);},{passive:true});
    document.addEventListener('touchend',e=>{const t=e.changedTouches&&e.changedTouches[0];if(t)up(t.clientX,t.clientY);},{passive:true});
    document.addEventListener('touchcancel',()=>{p0=null;},{passive:true});
    /* Maus am Computer: dieselbe Geste */
    document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')down(e.clientX,e.clientY,e.target);});
    document.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')up(e.clientX,e.clientY);});
  }catch(e){}
  return {down,move,up,target};
})();

/* Version 151: Die Fortschrittsleiste ist immer voll und zeigt, wie sich die begonnenen Wörter auf die Stufen verteilen.
   Vorher war sie anteilig zu allen Wörtern gefüllt, der Regenbogen war erst ganz am Ende zu sehen. */
function progParts(L,prog){
  const lv=[0,0,0,0,0,0];let nNew=0;
  L.words.forEach(w=>{const q=prog[w.k];if(!q)nNew++;else lv[q.l]++;});
  const N=L.words.length,Ns=N-nNew;
  const parts=[5,4,3,2,1,0].map(n=>({c:LVCOL[n],n:lv[n],l:t('Stufe {0}',n)}));
  const seg=Ns?parts.filter(p=>p.n>0).map(p=>`<i style="width:${(p.n/Ns*100).toFixed(2)}%;background:${p.c}"></i>`).join(''):'';
  const bar=`<div class="stack" role="img" aria-label="${parts.map(p=>p.n+' '+p.l).join(', ')}">${seg}</div>`;
  return {parts,nNew,N,Ns,bar};
}

function renderList(){
  const L=curLang(),t0=today(),prog=state.progress[L.id]||{};
  const groups=L.cats.map(()=>[]);
  L.words.forEach(w=>{
    const pr=prog[w.k];
    if(bookF==='due'&&!(pr&&pr.d<=t0))return;
    if(bookF==='learned'&&!(pr&&pr.l>=1))return;
    if(bookF==='new'&&pr)return;
    if(bookF==='shaky'&&!isShaky(pr))return;
    if(bookQ&&!(fold(w.id).includes(bookQ)||fold(w.en).includes(bookQ)||fold(w.de).includes(bookQ)))return;
    groups[w.cat].push(w);
  });

    }).join('')}</ul></details>`;

  $('#vlist').innerHTML=html||'<div class="empty">'+t('Nichts gefunden.')+'</div>';
}

/* Version 153: Leistungsanzeige (Testbereich). Zeigt Bilder pro Sekunde, das schlechteste Bild der letzten 5 Sekunden,
   wie viele Animationen laufen und welche am häufigsten. So sehen wir auf dem iPhone, wo es heiß wird. */
let perfEl=null,perfRaf=0;
function perfSet(on){
  if(!on){if(perfRaf)cancelAnimationFrame(perfRaf);perfRaf=0;if(perfEl){perfEl.remove();perfEl=null;}return;}
  if(perfEl||typeof requestAnimationFrame!=='function')return;
  perfEl=document.createElement('div');perfEl.id='perf';perfEl.setAttribute('aria-hidden','true');document.body.appendChild(perfEl);
  let last=0,frames=0,t0=0,worst=[],slow=0;
  const loop=ts=>{
    if(!perfEl)return;
    if(last){const d=ts-last;if(d>34)slow++;worst.push(d);if(worst.length>300)worst.shift();}
    last=ts;frames++;
    if(!t0)t0=ts;
    if(ts-t0>=1000){
      const fps=Math.round(frames*1000/(ts-t0));let an=[],names={};
      try{an=document.getAnimations();an.forEach(a=>{const n=a.animationName||a.transitionProperty||'js';names[n]=(names[n]||0)+1;});}catch(e){}
      const top=Object.entries(names).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]+'×'+x[1]).join(' ');
      const w=Math.round(Math.max.apply(null,worst.concat([0])));
      perfEl.textContent=fps+' fps · max '+w+' ms · lahm '+slow+' · Anim '+an.length+(top?'\n'+top:'');
      frames=0;t0=ts;slow=0;
    }
    perfRaf=requestAnimationFrame(loop);
  };
  perfRaf=requestAnimationFrame(loop);
}
perfSet(!!state.perf);
