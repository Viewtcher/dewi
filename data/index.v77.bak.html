/* ===== modules/_shared.js ===== */
const toGl=()=>t(state.ui==='de'?'ins Deutsche':'ins Englische');

const toIdl=()=>t(state.lang==='en'?'ins Englische':'ins Indonesische');

/* Hervorhebung: Wort im Satz finden (nur ganze Wörter) */
/* Wort im Satz finden: Token-Bereich [von,bis] oder null. Erst exakt, dann gebeugte Form
   (z. B. menjawab → jawab, tagihan → tagihannya, dua belas → kedua belas). Zerlegung wie tokensOf. */
function wordSpan(text,word){
  const T=tokensOf(text).map(x=>x.toLowerCase()),W=tokensOf(word).map(x=>x.toLowerCase());
  if(!W.length)return null;
  const stems=b=>{const o=[b],m=b.match(/^(meng|meny|mem|men|me|ber|ter|di|per|pe|ke)(.{3,})$/);if(m)o.push(m[2]);return o.filter(x=>x.length>=3);};
  const find=eq=>{for(let i=0;i+W.length<=T.length;i++){let ok=true;for(let j=0;j<W.length;j++)if(!eq(T[i+j],W[j])){ok=false;break;}if(ok)return [i,i+W.length-1];}return null;};
  return find((a,b)=>a===b)||find((a,b)=>stems(b).some(x=>a.includes(x)));
}
/* Wörter eines Satzes (nach Token-Nummer) mit gelber Unterstreichung; gleiche Zerlegung wie tokensOf */
function markTokens(text,idx,cls,extra,xcls){
  const set=new Set(idx),ex=new Set(extra||[]),re=/[^\s.,!?;:"“”]+/g;let out='',last=0,i=0,m;
  while((m=re.exec(text))){const c=set.has(i)?(cls||'slot'):ex.has(i)?(xcls||'gv'):'';out+=esc(text.slice(last,m.index))+(c?'<span class="'+c+'">'+esc(m[0])+'</span>':esc(m[0]));last=m.index+m[0].length;i++;}
  return out+esc(text.slice(last));
}
function hlId(text,word){
  const lt=text.toLowerCase(),lw=word.toLowerCase(),isL=ch=>!!ch&&/[a-zäöüß]/i.test(ch);
  let i=lt.indexOf(lw);
  while(i>-1&&(isL(lt[i-1])||isL(lt[i+lw.length])))i=lt.indexOf(lw,i+1);
  if(i<0){
    const sp=wordSpan(text,word);if(!sp)return esc(text);
    const re=/[^\s.,!?;:"“”]+/g;let k=0,a=-1,b=-1,m;
    while((m=re.exec(text))){if(k===sp[0])a=m.index;if(k===sp[1]){b=m.index+m[0].length;break;}k++;}
    return a<0?esc(text):esc(text.slice(0,a))+'<b>'+esc(text.slice(a,b))+'</b>'+esc(text.slice(b));
  }
  return esc(text.slice(0,i))+'<b>'+esc(text.slice(i,i+lw.length))+'</b>'+esc(text.slice(i+lw.length));
}
/* Token-Nummern der gelernten Vokabel im Beispielsatz: side 'id' = Satz der Lernsprache, 'gl' = Übersetzung (Klammer der Vorlage) */
function learnedIdx(w,s,side){
  const out=[];if(!s)return out;
  if(side==='id'){const sp=wordSpan(s.id,w.id);if(sp)for(let i=sp[0];i<=sp[1];i++)out.push(i);return out;}
  const m=s.tpl&&s.tpl.match(/\[([^\]]+)\]/);if(!m)return out;
  const pre=s.tpl.slice(0,m.index).replace(/[.,!?;:"“”]/g,' ');
  let a=tokensOf(pre).length;if(/\S$/.test(pre))a--;   // Klammer mitten im Wort (z. B. Orangen[saft])
  const n=Math.max(1,tokensOf(m[1]).length);
  for(let i=0;i<n;i++)out.push(a+i);return out;
}
/* Zuordnung: Token des Lernsprachen-Satzes → Positionen im übersetzten Satz (nur sicher gefundene, sonst null) */
function alignOf(idText,glText){
  const glT=tilesOf(glText);
  return tokensOf(idText).map(tk=>{const e=blockEquiv(tk,glT);if(e)return e;const n=normId(tk),i=glT.findIndex(x=>normId(x)===n);return i>=0?[i]:null;});
}
/* Markierung der Übersetzung oben: gesuchte Wörter (gelb) und geschenkte (dezent lila). askedId/givenId = Token-Nummern des Lernsprachen-Satzes.
   all=true: der ganze Satz wird gebaut, alles außer den geschenkten Wörtern ist gesucht (gelb). Sonst nur die zugeordneten Wörter;
   Wörter ohne Wörterbuch-Entsprechung werden nur markiert, wenn die Zahl der offenen Plätze es hergibt. */
function glPrompt(w,idText,glText,askedId,givenId,all){
  const al=alignOf(idText,glText),y=new Set(),p=new Set(),s=sentOf(w),n=tokensOf(glText).length;
  if(s&&s.id===idText&&s.plain===glText)learnedIdx(w,s,'gl').forEach(i=>y.add(i));
  let open=0;
  al.forEach((pos,i)=>{
    if(givenId.has(i)){if(pos)pos.forEach(k=>p.add(k));}
    else if(askedId.has(i)){if(pos)pos.forEach(k=>y.add(k));else open++;}
  });
  if(all){for(let k=0;k<n;k++)y.add(k);}
  else{
    const used=new Set();al.forEach(pos=>{if(pos)pos.forEach(k=>used.add(k));});
    const free=[];for(let k=0;k<n;k++)if(!used.has(k))free.push(k);
    if(open&&free.length&&free.length<=open)free.forEach(k=>y.add(k));
  }
  p.forEach(k=>y.delete(k));
  return markTokens(glText,Array.from(y),'slot',Array.from(p),'gv');
}
/* Satz der Lernsprache oben: Wörter, deren Übersetzung gesucht wird (gelb), und geschenkte (dezent lila) */
function idPrompt(w,idText,askedId,givenId,glText){
  const s=sentOf(w),y=new Set(askedId);
  if(s&&s.id===idText)learnedIdx(w,s,'id').forEach(i=>y.add(i));
  givenId.forEach(i=>y.delete(i));
  return markTokens(idText,Array.from(y),'slot',Array.from(givenId),'gv');
}

function hlSlot(tpl,repl,cls){
  const m=tpl.match(/\[([^\]]+)\]/);
  if(!m)return esc(tpl);
  const i=m.index;
  return esc(tpl.slice(0,i))+`<${cls?'span class="'+cls+'"':'b'}>`+esc(repl==null?m[1]:repl)+`</${cls?'span':'b'}>`+esc(tpl.slice(i+m[0].length));
}

let PROPER=null,PROPER_L=null,POOL={};
/* Satz-Schlüssel des aktuellen Kurses (Englisch-Schlüssel tragen den Vorsatz „en:“) */
const sentKeys=()=>Object.keys(SENT).filter(k=>state.lang==='id'?k.indexOf(':')<0:k.indexOf(state.lang+':')===0);

function tokensOf(text){return text.replace(/[.,!?;:"“”]/g,' ').split(/\s+/).filter(Boolean);}

function isProper(tk){
  if(!PROPER||PROPER_L!==state.lang){
    PROPER_L=state.lang;PROPER=new Set(PROPER_EXTRA);
    sentKeys().forEach(k=>{[SENT[k].id,SENT[k].en,SENT[k].de].forEach(tx=>{if(tx)tokensOf(tx).forEach((x,i)=>{if(i>0&&/^[A-ZÄÖÜ]/.test(x))PROPER.add(x);});});});
    const CL=curLang();if(CL)CL.words.forEach(w=>{if(/^[A-Z]/.test(w.id))w.id.split(' ').forEach(x=>PROPER.add(x));});
  }
  return /^I($|')/.test(tk)||PROPER.has(tk);
}

/* Echte Eigennamen (Orte, Namen, Monate …): gelten beim Lernstand immer als bekannt. Anreden wie „Bu“ oder „Pak“ gehören NICHT dazu,
   auch wenn sie im Satz großgeschrieben sind: Sie sind Vokabeln, die man noch nicht kennen kann. */
function isName(tk){return PROPER_EXTRA.indexOf(tk)>-1;}

/* Besteht der ganze Beispielsatz des Wortes aus gelernten Wörtern (und Namen)? Das Zielwort selbst zählt als gelernt.
   Auswahl und Lückensatz zeigen den ganzen Satz, deshalb nur mit solchen Sätzen. */
function sentKnown(w){
  const s=sentOf(w);if(!s)return false;
  if(window.__rlAll)return true;   // nur für Tests
  const kn=knownTokens(w);
  return tokensOf(s.id).every(tk=>isName(tk)||kn.has(normId(tk)));
}

const tileText=(tk,i)=>(i===0&&!isProper(tk))?tk.charAt(0).toLowerCase()+tk.slice(1):tk;

function tilesOf(text){return tokensOf(text).map(tileText);}

function poolOf(lang){
  const pk=state.lang+'|'+lang;
  if(!POOL[pk]){const set=new Set();sentKeys().forEach(k=>{const s=SENT[k],tx=lang==='id'?s.id:s[lang];if(tx)tilesOf(tx).forEach(x=>set.add(x));});POOL[pk]=Array.from(set);}
  return POOL[pk];
}

function distractors(target,lang,n){
  const have=new Set(target.map(normId)),out=[];
  for(const x of shuffle(poolOf(lang).slice())){
    const k=normId(x);if(!k||have.has(k))continue;
    have.add(k);out.push(x);if(out.length>=n)break;
  }
  return out;
}

function editDist(a,b){   // Damerau-Levenshtein: ein Buchstabendreher zählt als 1 Fehler
  const m=a.length,n=b.length,d=[];
  for(let i=0;i<=m;i++){d[i]=[i];}
  for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[m][n];
}

/* ===== modules/blocks.js ===== */
/* Quelle für Bausteine: Beispielsatz des Wortes, bei Alltagssätzen der Eintrag selbst.
   Noch nicht gelernte Wörter im Satz werden geschenkt: Sie stehen schon fest im Satz (dezent lila), man setzt nur die übrigen Kacheln ein.
   Grenzen: höchstens 2 geschenkte Wörter, mindestens 2 Kacheln selbst setzen, höchstens 7 Wörter. Das Zielwort zählt als bekannt. */
const BLOCKS_MAX_GIVEN=2,BLOCKS_MIN_FREE=2,BLOCKS_MAX_TOKENS=7;
function knownTokens(w){
  const L=curLang(),prog=state.progress[L.id]||{},set=new Set();
  L.words.forEach(x=>{const p=prog[x.k];if((p&&p.l>=1)||x.k===w.k)tokensOf(x.id).forEach(tk=>set.add(normId(tk)));});
  return set;
}
/* Deutsche/englische Entsprechung eines unbekannten indonesischen Worts im Zielsatz (Positionen) oder null */
function blockEquiv(u,target){
  const L=curLang(),nu=normId(u),nt=target.map(normId);
  for(const x of L.words){
    if(x.id.split(' ').length!==1||normId(x.id)!==nu)continue;
    for(const opt of gl(x).split(' / ')){
      const o=tokensOf(opt).map(normId);if(!o.length)continue;
      for(let i=0;i+o.length<=nt.length;i++)if(o.every((v,j)=>v&&v===nt[i+j]))return o.map((_,j)=>i+j);
    }
  }
  return null;
}
/* Plan für eine Richtung: Zielkacheln und Positionen der geschenkten Wörter, oder null wenn nicht machbar */
function blockPlan(pair,w,dir){
  const idT=tokensOf(pair.id);
  if(idT.length>BLOCKS_MAX_TOKENS)return null;
  const known=knownTokens(w),unk=idT.filter(tk=>!isName(tk)&&!known.has(normId(tk)));
  const target=tilesOf(dir==='id2gl'?pair.gl:pair.id),given=new Set();
  if(target.length<2||target.length>BLOCKS_MAX_TOKENS)return null;
  for(const u of unk){
    if(dir==='gl2id'){target.forEach((tk,i)=>{if(normId(tk)===normId(u))given.add(i);});}
    else{const eq=blockEquiv(u,target);if(!eq)return null;eq.forEach(i=>given.add(i));}
  }
  if(given.size>BLOCKS_MAX_GIVEN||target.length-given.size<BLOCKS_MIN_FREE)return null;
  return {target,given};
}
const blockDirs=(pair,w)=>['id2gl','gl2id'].filter(d=>blockPlan(pair,w,d));
function buildPair(w){
  const s=sentOf(w);
  const pair=s?{id:s.id,gl:s.plain}:{id:w.id,gl:glFirst(w)};
  return blockDirs(pair,w).length?pair:null;
}
/* Ablenker-Kacheln möglichst aus bereits gelernten Wörtern */
function blockDistractors(target,toLang,n,w){
  if(toLang!=='id')return distractors(target,toLang,n);
  const have=new Set(target.map(normId)),out=[];
  const known=shuffle(Array.from(knownTokens(w)));
  for(const k of known){if(have.has(k))continue;have.add(k);out.push(k);if(out.length>=n)return out;}
  return out.concat(distractors(target.concat(out),toLang,n-out.length));
}

/* Satz oben: alle Wörter, die man selbst setzen muss, gelb; geschenkte Wörter dezent lila */
function blockPrompt(w,pair,dir,target,given){
  if(dir==='id2gl'){
    const known=knownTokens(w),gv=new Set(),as=new Set();
    tokensOf(pair.id).forEach((tk,i)=>{if(!isName(tk)&&!known.has(normId(tk)))gv.add(i);else as.add(i);});
    return idPrompt(w,pair.id,as,gv);
  }
  const as=new Set(),gv=new Set();
  target.forEach((tk,i)=>{if(given.has(i))gv.add(i);else as.add(i);});
  return glPrompt(w,pair.id,pair.gl,as,gv,true);
}
function showBuild(pair){
  const c=S.cur,w=c.w,L=curLang();
  const dirs=blockDirs(pair,w),dir=dirs[Math.floor(Math.random()*dirs.length)],toLang=dir==='id2gl'?state.ui:'id';
  const from=dir==='id2gl'?pair.id:pair.gl,to=dir==='id2gl'?pair.gl:pair.id;
  const {target,given}=blockPlan(pair,w,dir),want=target.map(normId).join('|');
  const free=target.map((tk,i)=>i).filter(i=>!given.has(i)),nFree=free.length;
  const tiles=shuffle(free.map(i=>target[i]).concat(blockDistractors(target,toLang,2,w)));
  let ans=[],done=false,lives=triesFor('blocks');
  window.__lastBuild={dir,target,given:Array.from(given)};   // nur für Tests
  sheetBody(`<div class="smain">${kicker(c,'blocks',dir==='id2gl'?toGl():toIdl())}${roundLives()}
    <div class="sentbox hq" lang="${dir==='id2gl'?L.code.toLowerCase():state.ui}">${blockPrompt(w,pair,dir,target,given)}${helpBtn('blocks')}</div>
    <div class="ans" id="ans2" aria-label="${t('Dein Satz')}" lang="${toLang==='id'?L.code.toLowerCase():toLang}"></div>
    <div class="bank" id="bank" lang="${toLang==='id'?L.code.toLowerCase():toLang}"></div>
    <div id="exfb"></div>
    <button class="btn primary block" id="chk" disabled>${t('Prüfen')}</button></div>`);
  const A=$('#ans2'),B=$('#bank'),chk=$('#chk');
  function paint(){
    A.classList.remove('bad');if(!done)$('#exfb').innerHTML='';
    let k=0;   // geschenkte Wörter stehen fest an ihrer Stelle, die freien Felder füllen sich von links nach rechts
    A.innerHTML=target.map((tk,pi)=>given.has(pi)?`<span class="tile given">${esc(tk)}</span>`:k<ans.length?`<button class="tile" data-i="${ans[k++]}">${esc(tiles[ans[k-1]])}</button>`:'<span class="bslot" aria-hidden="true"></span>').join('');
    B.innerHTML=tiles.map((x,i)=>ans.indexOf(i)>-1?`<span class="tile ghost" aria-hidden="true">${esc(x)}</span>`:`<button class="tile" data-i="${i}">${esc(x)}</button>`).join('');
    chk.disabled=ans.length<nFree;   // erst prüfbar, wenn alle Felder gefüllt sind
  }
  A.onclick=e=>{const b=e.target.closest('button');if(!b||done)return;ans.splice(ans.indexOf(+b.dataset.i),1);paint();};
  B.onclick=e=>{const b=e.target.closest('button');if(!b||done||ans.length>=nFree)return;ans.push(+b.dataset.i);paint();};
  chk.onclick=()=>{
    if(done){nextStep();return;}
    if(ans.length<nFree)return;   // Sicherung: nur prüfen, wenn alle Felder gefüllt sind
    let k=0;const good=target.map((tk,pi)=>given.has(pi)?normId(tk):normId(tiles[ans[k++]])).join('|')===want;
    if(!good){
      lives--;
      if(lives>0){A.classList.add('bad');$('#exfb').innerHTML=`<p class="fb bad" role="status">${t('Nicht ganz. Versuch es nochmal.')}</p>`;return;}
    }
    done=true;
    c.ok=c.ok&&good;settleCard();
    A.classList.add(good?'good':'bad');
    $$('.tile',sheet).forEach(x=>{if(x.tagName==='BUTTON')x.disabled=true;});
    $('#exfb').innerHTML=`<div class="res ${good?'good':'bad'}" role="status"><div class="rl">${good?t('Richtig'):t('Nicht ganz')}</div>
      <div class="pair">${esc(to)}</div></div>${resultNote(good)}`;
    chk.textContent=t('Weiter');chk.disabled=false;
    try{chk.focus({preventScroll:true});}catch(e){}
    if(good)burst($('.res'),18);
  };
  paint();
}

/* ---- Tippen ---- */
function hintFor(c){
  let x=c.dir==='id2gl'?glFirst(c.w):c.w.id;
  x=x.replace(/\([^)]*\)/g,'').trim();
  if(state.ui==='en')x=x.replace(/^\s*to\s+(?=\S)/i,'');
  return x.slice(0,2);
}

const typoTol=(len,lvl)=>{const d=TYPO_DIV[Math.max(0,Math.min(5,lvl||0))];return d===Infinity?0:Math.floor(len/d);};

let ANS_CACHE={};

function ownAnswers(dir){   // alle Schreibweisen anderer Wörter: ein anderes echtes Wort wird nie als Tippfehler durchgewunken
  const key=state.lang+dir+state.ui;
  if(!ANS_CACHE[key]){
    const set=new Set();
    curLang().words.forEach(w=>{if(dir==='id2gl')gl(w).split('/').forEach(x=>set.add(normG(x)));else set.add(normId(w.id));});
    ANS_CACHE[key]=set;
  }
  return ANS_CACHE[key];
}

function isCorrect(c,val){
  c.typo=false;c.near=false;
  const id2gl=c.dir==='id2gl';
  const a=id2gl?normG(val):normId(val);
  if(!a)return false;
  const cands=(id2gl?gl(c.w).split('/').map(normG):c.accept).filter(Boolean);
  if(cands.indexOf(a)>-1)return true;
  if(a.length<3)return false;
  const own=ownAnswers(id2gl?'id2gl':'gl2id');
  let best=99,tolBest=0;
  for(const x of cands){
    const d=editDist(a,x),tol=typoTol(x.length,c.lvl);
    if(d<best){best=d;tolBest=tol;}
  }
  if(best<=tolBest&&best>0&&!own.has(a)){c.typo=true;return true;}
  if(best<=tolBest+1&&best>0&&cands[0].length>=4)c.near=true;
  return false;
}

  const inp=$('#ans'),iw=$('#iw');let keys=0;

    inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');inp.select();
  };
  try{inp.focus({preventScroll:true});}catch(e){inp.focus();}
}

/* ===== modules/swipe.js ===== */
/* Wörter mit Beispielsatz: Lückensatz (nur das Lernwort einsetzen) oder Bedeutungs-Auswahl. Alltagssätze: Bausteine. */
/* ===== Swipe-Modus: Wort oben, zwei ähnliche Vorschläge, einer ist richtig ===== */
function swipeWrong(w,id2gl){
  const L=curLang(),right=id2gl?glFirst(w):w.id,nr=id2gl?normG(right):normId(right);
  const ok=new Set(id2gl?gl(w).split(' / ').map(normG):[normId(w.id)].concat(S.cur&&S.cur.accept||[]));
  const cands=[];
  for(const x of L.words){
    if(x.k===w.k)continue;
    const cand=id2gl?glFirst(x):x.id,n=id2gl?normG(cand):normId(cand);
    if(!n||ok.has(n))continue;
    /* ähnlich = gleiche Kategorie, ähnliche Schreibweise, ähnliche Länge */
    const score=(x.cat===w.cat?3:0)+Math.max(0,3-editDist(n,nr)*.45)+Math.max(0,2-Math.abs(n.length-nr.length)*.4)+Math.random()*1.2;
    cands.push([score,cand]);
  }
  cands.sort((a,b)=>b[0]-a[0]);
  return cands.length?cands[0][1]:'?';
}

let swKey=null;

function showSwipe(){
  const c=S.cur,w=c.w,L=curLang(),s=sentOf(w),id2gl=Math.random()<.5;

  const card=$('#swcard'),bs=$$('.swb',sheet);

}

/* ===== modules/gap.js ===== */
function gapParts(s,w){
  const text=s.id,lt=text.toLowerCase(),lw=w.id.toLowerCase(),isL=ch=>!!ch&&/[a-zäöüß]/i.test(ch);
  let i=lt.indexOf(lw);
  while(i>-1&&(isL(lt[i-1])||isL(lt[i+lw.length])))i=lt.indexOf(lw,i+1);
  return i<0?null:{a:text.slice(0,i),b:text.slice(i+lw.length)};
}

function gapTiles(w){
  const L=curLang(),bad=new Set(gl(w).split(' / ').map(normG)),n=w.id.split(' ').length,out=[w.id];
  const pool=shuffle(L.words.filter(x=>x.k!==w.k&&x.id!==w.id&&!/^[A-Z]/.test(x.id)&&x.id.split(' ').length===n));
  const pri=pool.filter(x=>x.cat===w.cat).concat(pool.filter(x=>x.cat!==w.cat));
  for(const x of pri){
    const g=normG(glFirst(x));
    if(!g||bad.has(g))continue;
    bad.add(g);out.push(x.id);if(out.length>=4)break;
  }
  return shuffle(out);
}

function showGap(w,s,gp){
  const c=S.cur,L=curLang(),tiles=gapTiles(w),lang=L.code.toLowerCase();
  let lives=triesFor('gap'),done=false;
  sheetBody(`<div class="smain">${kicker(c,'gap')}${roundLives()}
    <div class="sentbox tr hq" lang="${state.ui}">${hlSlot(s.tpl,null,'slot')}${helpBtn('gap')}</div>
    <div class="sentbox gapbox" lang="${lang}">${esc(gp.a)}<span class="gap" id="gap"></span>${esc(gp.b)}</div>
    <div class="bank" id="bank" lang="${lang}">${tiles.map(x=>`<button class="tile" data-r="${x===w.id?1:0}">${esc(x)}</button>`).join('')}</div>
    <div id="exfb"></div></div>`);
  const gap=$('#gap'),B=$('#bank');
  function reveal(good){
    done=true;
    $$('.tile',B).forEach(x=>{x.disabled=true;if(x.dataset.r==='1')x.classList.add('ok');});
    gap.textContent=w.id;gap.className='gap '+(good?'good':'bad');
    c.ok=c.ok&&good;settleCard();
    $('#exfb').innerHTML=`<div class="res ${good?'good':'bad'}" role="status"><div class="rl">${good?t('Richtig'):t('Nicht ganz')}</div>
      <div class="pair"><span lang="${lang}">${esc(w.id)}</span><em>=</em><span lang="${state.ui}">${esc(gl(w))}</span></div>
      <p class="hint" style="margin-top:8px" lang="${lang}">${hlId(s.id,w.id)}</p></div>${resultNote(good)}
      <button class="btn primary block" id="nx" style="margin-top:12px">${t('Weiter')}</button>`;
    $('#nx').onclick=nextStep;
    try{$('#nx').focus({preventScroll:true});}catch(e){}
    if(good)burst($('.res'),18);
  }
  B.onclick=e=>{
    const b=e.target.closest('button');if(!b||done||b.disabled)return;
    const good=b.dataset.r==='1';
    gap.textContent=b.textContent;
    if(good)return reveal(true);
    lives--;b.disabled=true;b.classList.add('wrong');
    gap.className='gap bad';
    if(lives<=0)return reveal(false);
    $('#exfb').innerHTML=`<p class="fb bad" role="status">${t('Nicht ganz. Versuch es nochmal.')}</p>`;
    setTimeout(()=>{if(!done){gap.textContent='';gap.className='gap';}},650);
  };
}

/* ===== modules/reels.js ===== */
/* Modul Reels: Spielautomat. Drei Walzen tragen Wörter des Beispielsatzes (bei längeren Sätzen: das gelernte Wort und seine zwei Nachbarn).
   Hebel ziehen, dann jede Walze antippen, wenn das richtige Wort auf der Linie steht.
   Richtig: Walze rastet grün ein. Falsch: Walze zuckt rot und dreht wieder an (ein Fehler ist frei, im Survival nicht).
   Jackpot (alles beim ersten Stopp) ist nur Show und ändert nichts an Stufen oder Punkten. */
const RL_ROW=44,RL_FAST=10,RL_SLOW=2.2;   // Wörter pro Sekunde: alle rasen, nur die aktive Walze wird langsam
/* Kurzer Diamantenregen über den ganzen Bildschirm */
function diamondRain(n){
  if(reduceMotion())return;
  const box=document.createElement('div');box.className='drain';box.setAttribute('aria-hidden','true');
  const cols=[['#ff7ac6','#ffc2e6','#c93a96'],['#7ae7ff','#d3f6ff','#35a8c9'],['#ffffff','#f1e6ff','#b9a2e6'],['#c9a6ff','#eadcff','#8a63d4'],['#ffe27a','#fff3b8','#d9a520']];
  for(let i=0;i<n;i++){
    const c=cols[i%cols.length],sz=16+Math.random()*20,g=document.createElement('i');
    g.style.cssText=`left:${(Math.random()*100).toFixed(1)}%;width:${sz.toFixed(0)}px;height:${sz.toFixed(0)}px;--dx:${(Math.random()*80-40).toFixed(0)}px;--r:${(Math.random()*540-270).toFixed(0)}deg;animation-duration:${(1.1+Math.random()*.9).toFixed(2)}s;animation-delay:${(Math.random()*.7).toFixed(2)}s`;
    g.innerHTML=`<svg viewBox="0 0 24 24"><path d="M5 3h14l5 6-12 13L0 9z" fill="${c[0]}" stroke="#2a1630" stroke-width="1.4" stroke-linejoin="round"/><path d="M5 3L8 9h8l3-6z" fill="${c[1]}"/><path d="M0 9h8l4 13zM24 9h-8l-4 13z" fill="${c[2]}" opacity=".85"/><path d="M8 9l4 13 4-13z" fill="${c[0]}"/><path d="M6 5l2 3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>`;
    box.appendChild(g);
  }
  document.body.appendChild(box);setTimeout(()=>box.remove(),2900);
}
/* Reels gibt es nur, wenn alle drei Walzen Wörter tragen, die schon gelernt sind (und zusammen im Satz stehen). Das Fenster aus drei Wörtern
   weicht unbekannten Wörtern aus; findet sich keins, kommt Reels für dieses Wort nicht vor (Ersatzmodul bzw. im Solo übersprungen).
   Es gibt keine vorgesetzten (geschenkten) Walzen: alle drei müssen selbst gestoppt werden. */
const RL_MIN_OWN=3;
function reelsPlan(w,s,dir){
  const idT=tilesOf(s.id),glT=tilesOf(s.plain);
  if(idT.length<3||glT.length<3)return null;
  const from=dir==='gl2id'?s.plain:s.id,toks=dir==='gl2id'?idT:glT,toLang=dir==='gl2id'?'id':state.ui;
  let idx;
  if(dir==='gl2id'){
    const f=normId(tokensOf(w.id)[0]||'');idx=toks.findIndex(x=>normId(x)===f);
  }else{
    const m=s.tpl.match(/\[([^\]]+)\]/);idx=m?tokensOf(s.tpl.slice(0,m.index)).length:-1;
  }
  const found=idx>=0&&idx<toks.length;   // Zielwort im Satz gefunden? (z. B. „dua belas“ steht als „kedua belas“ im Satz: nicht gefunden)
  if(!found)idx=Math.floor(toks.length/2);
  const known=knownTokens(w),unk=new Set();   // Positionen unbekannter Wörter in toks
  const idUnknown=idT.filter(tk=>!isName(tk)&&!known.has(normId(tk)));
  if(dir==='gl2id'){idT.forEach((tk,i)=>{if(!isName(tk)&&!known.has(normId(tk)))unk.add(i);});}
  else for(const u of idUnknown){const eq=blockEquiv(u,glT);if(!eq)return null;eq.forEach(i=>unk.add(i));}
  if(found)unk.delete(idx);
  if(window.__rlAll)unk.clear();   // nur für Tests: alle Walzen selbst stoppen
  let best=null;
  for(let st=Math.max(0,idx-2);st<=Math.min(idx,toks.length-3);st++){
    const n=[0,1,2].filter(i=>unk.has(st+i)).length;
    if(!best||n<best.n||(n===best.n&&Math.random()<.5))best={st,n};
  }
  if(!best||3-best.n<RL_MIN_OWN)return null;
  const st=best.st,right=toks.slice(st,st+3);
  const reels=right.map((r,i)=>{
    const words=[r].concat(distractors(toks,toLang,9).filter(x=>x.length<=9).slice(0,2));
    const ws=shuffle(words);
    return {words:ws,right:ws.indexOf(r)};
  });
  return {dir,toLang,from,toks,st,right,reels,before:toks.slice(0,st).join(' '),after:toks.slice(st+3).join(' '),full:toks.join(' '),
    fullFrom:from};
}
function reelsData(w){
  const s=sentOf(w);if(!s)return null;
  const dirs=Math.random()<.5?['gl2id','id2gl']:['id2gl','gl2id'];
  for(const d of dirs){const p=reelsPlan(w,s,d);if(p)return p;}
  return null;
}
const rlMod=(a,n)=>((a%n)+n)%n;
const rlEase=k=>{const c=1.4;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);};

/* Satz oben: die drei abgefragten Wörter (gelb) */
function reelsPrompt(w,D){
  const s=sentOf(w),win=new Set([D.st,D.st+1,D.st+2]);
  if(!s)return esc(D.from);
  if(D.dir==='gl2id')return glPrompt(w,s.id,s.plain,win,new Set());
  const al=alignOf(s.id,s.plain),as=new Set(),cov=new Set(),nul=[];
  al.forEach((pos,i)=>{if(!pos){nul.push(i);return;}pos.forEach(k=>cov.add(k));if(pos.some(k=>win.has(k)))as.add(i);});
  const open=[...win].filter(k=>!cov.has(k)).length;   // Walzen-Wörter ohne Wörterbuch-Zuordnung
  if(open&&nul.length&&nul.length<=open)nul.forEach(i=>as.add(i));
  return idPrompt(w,s.id,as,new Set());
}
function showReels(w){
  const c=S.cur,L=curLang(),D=reelsData(w);
  const tries=triesFor('reels'),list=reduceMotion();
  const R={D,tries,miss:0,locked:0,state:'idle',reels:D.reels.map(r=>({words:r.words,right:r.right,p:Math.random()*6,v:RL_FAST*(.9+Math.random()*.2),st:'fast',t:0,p0:0,tgt:0})),tick:0};
  c.rl=R;
  const maxLen=Math.max(...D.reels.map(r=>Math.max(...r.words.map(x=>x.length))));
  const fs=maxLen>8?'rw-s':maxLen>6?'rw-m':'';
  const ctx='';   // der graue Rest des Satzes (außerhalb der drei Walzen) wird nicht mehr gezeigt: dort stehen oft noch unbekannte Wörter
  const bulbs=n=>'<i></i>'.repeat(n);
  const reelHtml=list?
    D.reels.map((r,i)=>`<div class="rl-pick" data-i="${i}" role="group" aria-label="${t('Walze {0}',i+1)}">${r.words.map((x,k)=>`<button class="opt" data-k="${k}" lang="${D.toLang==='id'?L.code.toLowerCase():state.ui}">${esc(x)}</button>`).join('')}</div>`).join(''):
    D.reels.map((r,i)=>`<div class="reel ${fs}" data-i="${i}" aria-label="${t('Walze {0}',i+1)}" lang="${D.toLang==='id'?L.code.toLowerCase():state.ui}">${[0,1,2,3,4].map(()=>'<div class="rw"><span></span></div>').join('')}</div>`).join('');
  sheetBody(`<div class="smain rl">${kicker(c,'reels',D.dir==='gl2id'?toIdl():toGl())}${roundLives()}
    <div id="rlm" class="rl-m">${mascot('reels_ready',null,'sm')}</div>
    <div class="sentbox hq" lang="${D.dir==='gl2id'?state.ui:L.code.toLowerCase()}">${reelsPrompt(w,D)}${helpBtn('reels')}</div>${ctx}
    ${list?`<div class="rl-list">${reelHtml}</div>`:`<div class="cab" id="cab" data-st="idle">
      <div class="bl bt">${bulbs(11)}</div><div class="bl bb">${bulbs(11)}</div><div class="bl bl2">${bulbs(5)}</div><div class="bl br2">${bulbs(5)}</div>
      <div class="sign" id="sign">DEWI REELS</div>
      <div class="cbody"><div class="win" id="win" role="button" tabindex="0" aria-label="${t('Walzen stoppen')}">${reelHtml}</div>
        <div class="lev"><div class="track"></div><div class="knob" id="knob" role="button" tabindex="0" aria-label="${t('Hebel ziehen')}"></div></div></div>
    </div>`}
    <div id="exfb"></div></div>`);
  const cab=$('#cab'),sign=$('#sign');
  const say=k=>{const m=$('#rlm');if(m)m.innerHTML=mascot(k,null,'sm');};
  const alive=()=>!!$('#rlm');
  const el=i=>$$('.reel',sheet)[i];

  function paint(i){
    const r=R.reels[i],e=el(i);if(!e)return;
    const base=Math.round(r.p),d=r.p-base,n=r.words.length;
    e.querySelectorAll('.rw').forEach((row,k)=>{
      const off=k-2,txt=r.words[rlMod(base+off,n)],sp=row.firstChild;
      if(sp.textContent!==txt)sp.textContent=txt;
      row.style.transform=`translateY(${((off-d)*RL_ROW+RL_ROW).toFixed(1)}px)`;
      row.classList.toggle('mid',off===0);
    });
    e.classList.toggle('blur',r.v>5&&(r.st==='fast'||r.st==='slow'));
    if(R.last[i]!==base){R.last[i]=base;if(r.st==='slow'){const now=performance.now();if(now-R.tick>55){R.tick=now;sfx('tick');}}}
  }
  R.last=[];
  const curIdx=()=>R.reels.findIndex(r=>r.st!=='ok');
  function paintAll(){R.reels.forEach((_,i)=>paint(i));const a=R.state==='over'?-1:curIdx();$$('.reel',sheet).forEach((e,i)=>e.classList.toggle('act',i===a&&R.state==='spin'&&(R.reels[i].st==='slow'||R.reels[i].st==='snap')));}

  const root=$('.smain.rl');if(root&&R.locked)root.dataset.lk=String(R.locked);
  function finish(win){
    R.state='over';
    const jack=win&&R.miss===0;
    R.jack=jack;
    c.ok=c.ok&&win;settleCard();
    if(cab)cab.dataset.st=jack?'jack':win?'win':'lose';
    if(sign)sign.textContent=jack?'JACKPOT':win?'YES!':'GAME OVER';
    R.reels.forEach((r,i)=>{
      if(!win&&r.st!=='ok'){r.st='rev';r.p=r.right;const e=el(i);if(e){e.classList.remove('no');e.classList.add('rev');}}
      if(jack){const e=el(i);if(e)e.classList.add('gold');}
    });
    paintAll();
    if(win)diamondRain(jack?46:28);
    if(jack){sfx('jackpot');haptic([30,40,30,40,30,40,80]);const b=cab||sheet;burst(b,46);setTimeout(()=>alive()&&burst(b,34),350);}
    else if(win){sfx('gems');haptic([20,30,20]);}
    else{sfx('end_bad');}
    say(jack?'reels_jackpot':win?'reels_win':'reels_lose');
    const L2=D.toLang==='id'?L.code.toLowerCase():state.ui;
    R.resultHtml=`<div class="res ${win?'good':'bad'}" data-snd="1" role="status"><div class="rl">${jack?t('Jackpot!'):win?t('Richtig'):t('Nicht ganz')}</div>
      <div class="pair" lang="${L2}">${esc(D.full)}</div></div>
      ${jack?`<p class="hint" style="margin-top:8px">${t('Alles beim ersten Stopp getroffen.')}</p>`:''}${resultNote(win)}
      <button class="btn primary block" id="nx" style="margin-top:12px">${t('Weiter')}</button>`;
    if(root){root.dataset.end=win?'win':'lose';root.dataset.lk=String(R.locked);}
    R.tossAt=Date.now()+(win?1200:700);
    if(cab){
      $('#exfb').innerHTML=`<p class="rl-swipe" role="status">← ${t('Wische den Automaten nach links.')}</p>`;
      cab.setAttribute('role','button');cab.setAttribute('tabindex','0');cab.setAttribute('aria-label',t('Automaten wegwerfen'));
    }else R.showResult();
  }
  R.showResult=()=>{
    $('#exfb').innerHTML=R.resultHtml;
    $('#nx').onclick=nextStep;
    try{$('#nx').focus({preventScroll:true});}catch(e){}
  };
  /* Zum Schluss fliegt der Automat nach links vom Tisch, dann erscheinen Ergebnis und „Weiter“ */
  R.toss=instant=>{
    if(R.tossed||R.state!=='over'||!cab)return;
    R.tossed=true;
    const done=()=>{cab.style.display='none';if(root)root.classList.add('done');say('reels_toss');R.showResult();};
    if(instant||reduceMotion()){done();return;}
    sfx('tossed');haptic([20,70,60]);
    cab.style.transition='transform .38s cubic-bezier(.5,0,.85,.5)';
    cab.style.transform='translate(-150%,50px) rotate(-26deg)';
    setTimeout(done,400);
  };

  /* Ein Versuch für Walze i mit Wort k (von Hand oder Liste) */
  function attempt(i,k){
    const r=R.reels[i];
    if(R.state!=='spin'&&!list)return;
    if(R.state==='over'||r.st==='ok')return;
    if(k===r.right){
      r.st='ok';R.locked++;if(root)root.dataset.lk=String(R.locked);
      const e=el(i);if(e){e.classList.remove('no');e.classList.add('ok');}
      const pk=$$('.rl-pick',sheet)[i];if(pk){pk.classList.add('ok');$$('.opt',pk).forEach((b,x)=>{b.disabled=true;if(x===k)b.classList.add('ok');});}
      sfx('rwin');haptic([22]);
      if(R.locked===3)finish(true);
      else{say('reels_ok');const nx=R.reels.find(x=>x.st==='fast');if(nx)nx.st='slow';}
    }else{
      R.miss++;r.st='no';
      const e=el(i);if(e){e.classList.add('no');}
      const pk=$$('.rl-pick',sheet)[i];if(pk){const b=$$('.opt',pk)[k];if(b){b.classList.add('no');b.disabled=true;}}
      sfx('rbad');haptic([40,30,40]);
      if(R.miss>=R.tries)finish(false);
      else{say('reels_bad');if(!list)r.t=0;else r.st='fast';}
    }
  }

  function stop(i){
    const r=R.reels[i];
    if(R.state!=='spin'||r.st!=='slow')return;
    r.st='snap';r.t=0;r.p0=r.p;r.tgt=Math.round(r.p+r.v*.07);
    sfx('thunk');haptic([8]);
  }

  R.frame=dt=>{
    if(R.state==='over')return;
    R.reels.forEach((r,i)=>{
      if(r.st==='fast'||r.st==='slow'){
        const tg=r.st==='fast'?RL_FAST:RL_SLOW;r.v+=(tg-r.v)*Math.min(1,dt*4);r.p+=r.v*dt;
      }else if(r.st==='snap'){
        r.t+=dt;const k=Math.min(1,r.t/.24);r.p=r.p0+(r.tgt-r.p0)*rlEase(k);
        if(k>=1){r.p=r.tgt;r.st='idle';attempt(i,rlMod(r.tgt,r.words.length));}
      }else if(r.st==='no'){
        r.t+=dt;
        if(r.t>=.6&&R.state==='spin'){r.st='slow';r.v=RL_SLOW*2;r.p=Math.random()*r.words.length;const e=el(i);if(e)e.classList.remove('no');}
      }
    });
    paintAll();
  };
  R.stop=stop;
  R.stopNext=()=>{const i=curIdx();if(i>=0&&R.state==='spin')stop(i);};   // immer die linkeste noch offene Walze
  R.pull=()=>{
    if(R.state!=='idle')return;
    R.state='spin';
    const f=R.reels.findIndex(r=>r.st==='fast');if(f>=0)R.reels[f].st='slow';
    if(cab)cab.dataset.st='spin';if(sign)sign.textContent='TAP!';
    paintAll();
    sfx('lever');sfx('whirr',320);haptic([14]);
    const knob=$('#knob');if(knob){knob.classList.add('pulled');knob.style.setProperty('--ly','74px');setTimeout(()=>knob.style.setProperty('--ly','0px'),170);setTimeout(()=>knob.classList.remove('pulled'),600);}
  };

  if(list){
    R.state='spin';
    $$('.rl-pick',sheet).forEach((pk,i)=>$$('.opt',pk).forEach(b=>b.onclick=()=>attempt(i,+b.dataset.k)));
    return;
  }
  paintAll();
  /* Ganzer Automat: Tippen irgendwo stoppt die nächste Walze (links nach rechts). Der Hebel hat seine eigene Bedienung. */
  let sw=null;
  cab.addEventListener('pointerdown',ev=>{
    if(R.state==='over'){
      if(R.tossed||Date.now()<R.tossAt)return;
      sw={x:ev.clientX,dx:0};try{cab.setPointerCapture(ev.pointerId);}catch(e){}cab.style.transition='none';return;
    }
    if(ev.target.closest('#knob'))return;ev.preventDefault();R.stopNext();
  });
  cab.addEventListener('pointermove',ev=>{
    if(!sw)return;sw.dx=Math.min(0,ev.clientX-sw.x);
    cab.style.transform=`translateX(${sw.dx}px) rotate(${(sw.dx/14).toFixed(1)}deg)`;
  });
  const swEnd=()=>{
    if(!sw)return;const dx=sw.dx;sw=null;
    if(dx<-70){cab.style.transition='';cab.style.transform=`translateX(${dx}px) rotate(${(dx/14).toFixed(1)}deg)`;R.toss();}
    else{cab.style.transition='transform .3s cubic-bezier(.3,1.5,.5,1)';cab.style.transform='';}
  };
  cab.addEventListener('pointerup',swEnd);cab.addEventListener('pointercancel',swEnd);
  cab.addEventListener('keydown',ev=>{if(R.state==='over'&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();if(Date.now()>=R.tossAt)R.toss();}});
  const wn=$('#win');wn.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();R.stopNext();}});
  wn.addEventListener('click',ev=>{if(ev.detail===0)R.stopNext();});   // Tastatur / Hilfsmittel
  /* Hebel: ziehen oder antippen */
  const knob=$('#knob');let drag=null;
  const setY=y=>knob.style.setProperty('--ly',y+'px');
  knob.addEventListener('pointerdown',ev=>{ev.preventDefault();if(R.state!=='idle')return;drag={y:ev.clientY};try{knob.setPointerCapture(ev.pointerId);}catch(e){}knob.classList.add('drag');});
  knob.addEventListener('pointermove',ev=>{if(!drag)return;const y=Math.max(0,Math.min(74,ev.clientY-drag.y));setY(y);if(y>=60&&R.state==='idle'){drag=null;knob.classList.remove('drag');setY(0);R.pull();}});
  const end=()=>{if(!drag)return;const moved=parseFloat(knob.style.getPropertyValue('--ly'))||0;drag=null;knob.classList.remove('drag');setY(0);if(R.state==='idle'&&moved<20)R.pull();};
  knob.addEventListener('pointerup',end);knob.addEventListener('pointercancel',()=>{drag=null;knob.classList.remove('drag');setY(0);});
  knob.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();R.pull();}});
  let last=0;
  const loop=ts=>{
    if(!alive()||R.state==='over'&&R.done)return;
    const dt=last?Math.min(.05,(ts-last)/1000):0;last=ts;
    R.frame(dt);
    if(R.state==='over'){R.done=true;return;}
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

/* ===== modules/order.js ===== */
/* Modul Reihenfolge: Die Wörter eines Satzes liegen durcheinander und werden per Ziehen in die richtige Reihenfolge gebracht.
   Aufgabe: Übersetzung steht oben, der indonesische Satz wird sortiert. Sätze mit 4 bis 7 Wörtern, keine Stufen-Grenze.
   Noch nicht gelernte Wörter stehen fest an ihrer Stelle (dezent lila), das passende Wort der Übersetzung ist lila unterstrichen, die gelernte Vokabel gelb. Ein Versuch.
   Bedienung: Kachel ziehen, die anderen weichen live aus (Platzhalter wandert), beim Loslassen rastet sie ein. Pfeiltasten verschieben ebenfalls. */
/* Feintuning des Gefühls: Dauer des Ausweichens, Pause zwischen zwei Platzwechseln, Randzone (Anteil der Breite), die nicht auslöst */
const ORDER_GLIDE=.32,ORDER_COOLDOWN=230,ORDER_EDGE=.22;
const ORDER_MIN=4,ORDER_MAX=7,ORDER_MAX_GIVEN=2,ORDER_MIN_FREE=2;
/* Plan für ein Wort oder null. Noch nicht gelernte Wörter des Satzes werden geschenkt: Sie stehen fest an ihrer Stelle (dezent lila), und das passende
   Wort der Übersetzung wird markiert. Grenzen: höchstens 2 feste Steine, mindestens 2 zum Sortieren, 4 bis 7 Wörter. Keine Stufen-Grenze. */
function orderPair(w){
  const s=sentOf(w);
  const pair=s?{id:s.id,gl:s.plain}:{id:w.id,gl:glFirst(w)};
  const target=tilesOf(pair.id);
  if(target.length<ORDER_MIN||target.length>ORDER_MAX)return null;
  const known=knownTokens(w),given=new Set(),hl=new Set(),glT=tilesOf(pair.gl);
  const unk=window.__rlAll?[]:tokensOf(pair.id).filter(tk=>!isName(tk)&&!known.has(normId(tk)));
  for(const u of unk){
    const eq=blockEquiv(u,glT);if(!eq)return null;
    eq.forEach(i=>hl.add(i));
    target.forEach((tk,i)=>{if(normId(tk)===normId(u))given.add(i);});
  }
  if(given.size>ORDER_MAX_GIVEN||target.length-given.size<ORDER_MIN_FREE)return null;
  if(new Set(target.filter((tk,i)=>!given.has(i)).map(normId)).size<2)return null;
  return {id:pair.id,gl:pair.gl,given:Array.from(given),hl:Array.from(hl)};
}
/* Übersetzung mit markierten Wörtern (gleiche Zerlegung wie tokensOf) */
function orderGlHtml(pair,w){
  const T=tilesOf(pair.id),g=new Set(pair.given),as=new Set();
  T.forEach((tk,i)=>{if(!g.has(i))as.add(i);});
  return glPrompt(w,pair.id,pair.gl,as,g,true);
}

function showOrder(pair){
  const c=S.cur,L=curLang(),lang=L.code.toLowerCase();
  const target=tilesOf(pair.id),want=target.map(normId),wantS=want.join('|'),given=new Set(pair.given),n=target.length;
  const freeIdx=target.map((tk,i)=>i).filter(i=>!given.has(i)),nFree=freeIdx.length;
  let order,guard=0;
  do{order=shuffle(freeIdx.slice());}while(nFree>2&&order.map(i=>want[i]).join('|')===freeIdx.map(i=>want[i]).join('|')&&++guard<30);
  let k=0,done=false,lives=triesFor('order'),drag=null;
  window.__lastOrder={target,order:order.slice(),given:pair.given.slice()};   // nur für Tests
  const cells=target.map((tk,pi)=>given.has(pi)?`<span class="tile given" data-i="${pi}">${esc(tk)}</span>`:`<button type="button" class="tile otile" data-i="${order[k++]}">${esc(target[order[k-1]])}</button>`).join('');
  sheetBody(`<div class="smain">${kicker(c,'order')}${roundLives()}
    <div class="sentbox hq" lang="${state.ui}">${orderGlHtml(pair,c.w)}${helpBtn('order')}</div>
    <div class="ord" id="ord" lang="${lang}" aria-label="${t('Dein Satz')}">${cells}</div>
    <p class="hint ordhint">${t('Zieh die Kacheln in die richtige Reihenfolge.')}</p>
    <div id="exfb"></div>
    <button class="btn primary block" id="chk" disabled>${t('Prüfen')}</button></div>`);   // gesperrt, bis die erste Kachel verschoben wurde (kein Prüfen aus Reflex)
  const O=$('#ord'),chk=$('#chk');
  const touched=()=>{if(!done)chk.disabled=false;};
  const fixedAt={};$$('.given',O).forEach(e=>{fixedAt[+e.dataset.i]=e;});
  const cur=()=>Array.from(O.querySelectorAll('.otile'));
  const all=()=>Array.from(O.children).filter(e=>e.dataset.i!==undefined&&!e.classList.contains('oph'));
  const clearMarks=()=>{O.classList.remove('bad');cur().forEach(e=>e.classList.remove('bad','good'));if(!done)$('#exfb').innerHTML='';};
  const dragEl=()=>drag&&drag.moved?drag.el:null;
  /* freie Kacheln (plus Platzhalter) in Anzeigereihenfolge; die festen Steine bleiben immer an ihrer Position */
  const items=()=>Array.from(O.children).filter(x=>x!==dragEl()&&(x.classList.contains('otile')||x.classList.contains('oph')));
  function layout(list){
    const el=dragEl(),wantEls=[];let q=0;
    for(let pos=0;pos<n;pos++)wantEls.push(fixedAt[pos]||list[q++]);
    let cursor=O.firstChild;
    wantEls.forEach(e=>{
      while(cursor&&cursor===el)cursor=cursor.nextSibling;
      if(cursor===e)cursor=cursor.nextSibling;else O.insertBefore(e,cursor);
    });
  }
  /* Geschwister gleiten an ihren neuen Platz (FLIP), statt zu springen */
  function flip(mut){
    const els=Array.from(O.children).filter(x=>x!==dragEl()),before=els.map(e=>e.getBoundingClientRect());
    mut();
    els.forEach((e,i)=>{
      const b=e.getBoundingClientRect(),dx=before[i].left-b.left,dy=before[i].top-b.top;
      if(!dx&&!dy)return;
      e.style.transition='none';e.style.transform=`translate(${dx}px,${dy}px)`;e.getBoundingClientRect();
      e.style.transition='transform '+ORDER_GLIDE+'s cubic-bezier(.22,.8,.24,1)';e.style.transform='';
    });
  }
  function begin(e){
    const el=drag.el,r=el.getBoundingClientRect();
    const ph=document.createElement('span');ph.className='tile oph';ph.style.width=r.width+'px';ph.style.height=r.height+'px';ph.setAttribute('aria-hidden','true');
    O.insertBefore(ph,el);drag.ph=ph;drag.moved=true;
    el.classList.add('dragging');el.style.width=r.width+'px';el.style.height=r.height+'px';el.style.left='0px';el.style.top='0px';
    const o=el.getBoundingClientRect();drag.bx=o.left;drag.by=o.top;   // Bezug auch dann richtig, wenn ein Elternteil „fixed" verschiebt
    clearMarks();sfx('pop');haptic(8);
  }
  function place(px,py){
    const el=drag.el;
    el.style.left=(px-drag.dx-drag.bx)+'px';el.style.top=(py-drag.dy-drag.by)+'px';
    drag.px=px;drag.py=py;
    const now=Date.now(),wait=drag.last+ORDER_COOLDOWN-now;
    if(wait>0){   // Pause nach dem letzten Platzwechsel; danach wird die aktuelle Fingerposition noch einmal geprüft
      clearTimeout(drag.tm);drag.tm=setTimeout(()=>{if(drag&&drag.moved)shuffleTo(drag.px,drag.py);},wait+10);
      return;
    }
    shuffleTo(px,py);
  }
  function shuffleTo(px,py){
    const ph=drag.ph;
    const list=items(),sibs=list.filter(x=>x!==ph);
    const inside=(s,x,y)=>{const r=s.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;};
    const core=(s,x,y)=>{const r=s.getBoundingClientRect(),m=r.width*ORDER_EDGE;return x>=r.left+m&&x<=r.right-m&&y>=r.top&&y<=r.bottom;};   // Randzone löst nichts aus
    let ref=null,after=false;
    const hit=sibs.find(s=>core(s,px,py));
    if(hit){ref=hit;after=list.indexOf(ph)<list.indexOf(hit);}
    else{
      if(inside(ph,px,py)||sibs.some(s=>inside(s,px,py)))return;   // noch auf einer Kachel (Randzone): nichts tun
      let bd=1e9;
      sibs.forEach(s=>{const r=s.getBoundingClientRect(),d=Math.abs(py-(r.top+r.height/2))*3+Math.abs(px-(r.left+r.width/2));if(d<bd){bd=d;ref=s;after=px>r.left+r.width/2;}});
      // über einem festen Stein: Platzhalter nicht verschieben
      if(Object.values(fixedAt).some(f=>inside(f,px,py)))return;
    }
    if(!ref)return;
    const next=sibs.slice(),at=next.indexOf(ref)+(after?1:0);next.splice(at,0,ph);
    if(next.every((x,i)=>x===list[i]))return;
    drag.last=Date.now();
    flip(()=>layout(next));
    sfx('click');haptic(5);
  }
  function drop(){
    const d=drag;if(!d)return;drag=null;clearTimeout(d.tm);
    if(!d.moved)return;
    const r=d.ph.getBoundingClientRect();
    touched();
    d.el.style.transition='left .22s cubic-bezier(.22,.8,.24,1),top .22s cubic-bezier(.22,.8,.24,1),transform .22s ease';
    d.el.style.left=(r.left-d.bx)+'px';d.el.style.top=(r.top-d.by)+'px';d.el.classList.add('landing');
    const fin=()=>{
      if(!d.ph.parentNode)return;
      O.replaceChild(d.el,d.ph);
      d.el.classList.remove('dragging','landing');['left','top','width','height','transition','transform'].forEach(p=>d.el.style[p]='');
    };
    setTimeout(fin,230);sfx('pop');haptic(10);
  }
  O.addEventListener('pointerdown',e=>{
    const el=e.target.closest&&e.target.closest('.otile');
    if(!el||done||drag||(e.button&&e.button!==0))return;
    const r=el.getBoundingClientRect();
    drag={el,id:e.pointerId,dx:e.clientX-r.left,dy:e.clientY-r.top,sx:e.clientX,sy:e.clientY,moved:false,last:0,tm:0};
    try{el.setPointerCapture(e.pointerId);}catch(x){}
  });
  O.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id)return;
    if(!drag.moved){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<5)return;begin(e);}
    e.preventDefault();place(e.clientX,e.clientY);
  });
  ['pointerup','pointercancel'].forEach(n=>O.addEventListener(n,e=>{if(drag&&e.pointerId===drag.id)drop();}));
  O.addEventListener('contextmenu',e=>e.preventDefault());
  /* Tastatur: Pfeiltasten verschieben die fokussierte Kachel */
  O.addEventListener('keydown',e=>{
    const el=e.target.closest&&e.target.closest('.otile');
    if(!el||done||(e.key!=='ArrowLeft'&&e.key!=='ArrowRight'&&e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;
    e.preventDefault();clearMarks();
    const back=e.key==='ArrowLeft'||e.key==='ArrowUp',list=items(),i=list.indexOf(el),j=i+(back?-1:1);
    if(j<0||j>=list.length)return;
    const next=list.slice();next.splice(i,1);next.splice(j,0,el);
    flip(()=>layout(next));touched();
    try{el.focus({preventScroll:true});}catch(x){}
    sfx('click');
  });
  chk.onclick=()=>{
    if(done){nextStep();return;}
    if(drag||chk.disabled)return;
    const tiles=all(),ids=tiles.map(e=>want[+e.dataset.i]),good=ids.join('|')===wantS,els=tiles;
    if(!good){
      lives--;
      if(lives>0){
        els.forEach((e,p)=>{if(!e.classList.contains('given'))e.classList.toggle('bad',ids[p]!==want[p]);});
        $('#exfb').innerHTML=`<p class="fb bad" role="status">${t('Nicht ganz. Versuch es nochmal.')}</p>`;return;
      }
    }
    done=true;
    c.ok=c.ok&&good;settleCard();
    els.forEach((e,p)=>{if(e.classList.contains('given'))return;e.classList.remove('bad');e.classList.add(ids[p]===want[p]?'good':'bad');e.disabled=true;});
    O.classList.add(good?'good':'bad');
    $('.ordhint').hidden=true;
    $('#exfb').innerHTML=`<div class="res ${good?'good':'bad'}" role="status"><div class="rl">${good?t('Richtig'):t('Nicht ganz')}</div>
      <div class="pair" lang="${lang}">${esc(target.join(' '))}</div></div>${resultNote(good)}`;
    chk.textContent=t('Weiter');
    try{chk.focus({preventScroll:true});}catch(x){}
    if(good)burst($('.res'),18);
  };
}

registerModule({id:'order',name:()=>t('Reihenfolge'),desc:()=>t('Wörter in die richtige Reihenfolge schieben'),tone:'t5',solo:true,isNew:true,fallback:'swipe',
  icon:'<svg width="46" height="40" viewBox="0 0 46 40" fill="none" aria-hidden="true"><rect x="2" y="6" width="12" height="12" rx="3.5" fill="#6ee77a"/><rect x="17" y="6" width="12" height="12" rx="3.5" fill="#35dcd2"/><rect x="32" y="6" width="12" height="12" rx="3.5" fill="#a888ff"/><path d="M8 29h30M33 25l5 4-5 4" stroke="#b9a5cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',

/* ===== music.js ===== */
/* ===== Musik: zwei Loops, live per Web Audio erzeugt (keine Dateien) =====
   lofi   = sanfter Basis-Soundtrack der ganzen App
   synth  = Synthwave nur im Modul Reels; wird mit jeder gelockten Walze voller
   Schalter: state.music (Standard aus) und state.mvol; läuft unabhängig von den Effekt-Sounds.
   Ein Timer plant die Noten ein kleines Stück voraus (Lookahead), dadurch bleibt der Takt stabil. */
const MUS={mode:null,bus:null,next:0,step:0,timer:0};
const musicOn=()=>state.music===true&&(+state.mvol||0)>0;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function musCtx(){
  try{
    if(!SND.ctx){
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
      SND.ctx=new C();SND.master=SND.ctx.createGain();SND.master.connect(SND.ctx.destination);
    }
    if(SND.ctx.state==='suspended'&&SND.ctx.resume)SND.ctx.resume();
    if(!SND.mgain){SND.mgain=SND.ctx.createGain();SND.mgain.connect(SND.ctx.destination);}
    SND.mgain.gain.value=Math.min(1,Math.max(0,(+state.mvol||0)/100))*.6;
    return SND.ctx;
  }catch(e){return null;}
}
const BPM={lofi:76,synth:118};
const stepDur=m=>60/BPM[m]/4;
/* Lo-Fi: vier Akkorde (Fmaj7, Em7, Dm7, Cmaj7), je ein Takt à 16 Schritte */
const LF_CH=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]];
const LF_ME=[[9,0,7,0,4],[7,0,4,0,2],[5,0,9,0,7],[4,0,7,0,0]];   // lockere Melodie-Töne (Halbtöne über Wurzel, 0 = Pause)
function lofiStep(c,st,at,o){
  const bar=Math.floor(st/16)%4,i=st%16,ch=LF_CH[bar],sw=(i%4===2)?.03:0,hu=Math.random()*.012;
  if(i===0||i===10){
    ch.forEach((m,k)=>{const f=mtof(m+12);tone(c,f,at+hu+k*.014,i===0?1.1:.7,{v:.034,dest:o});tone(c,f*2,at+hu+k*.014,.35,{type:'triangle',v:.01,dest:o});});
  }
  if(i===0||i===7||i===10)tone(c,mtof(ch[0]-12),at,.5,{v:.13,dest:o});
  if(i===0||i===10)tone(c,130,at,.2,{v:.2,to:44,dest:o});
  if(i===4||i===12){noise(c,at,.13,.05,3200,{dest:o});tone(c,185,at,.09,{type:'triangle',v:.03,to:140,dest:o});}
  if(i%2===0)noise(c,at+sw,.035,.016,9000,{type:'highpass',dest:o});
  const me=LF_ME[bar][Math.floor(i/4)];
  if(i%4===1&&me&&(bar+i)%3!==0)tone(c,mtof(ch[0]+24+me-(me>8?12:0)),at+sw,.5,{v:.028,dest:o});
}
/* Synthwave: Am, F, C, G; Schichten je nach gelockten Walzen (0 bis 3) */
const SY_CH=[[57,60,64],[53,57,60],[55,60,64],[55,59,62]],SY_RT=[33,29,36,31];
const SY_LEAD=[[0,0,12,0,10,0,7,0],[5,0,9,0,7,0,5,0],[7,0,12,0,11,0,7,0],[7,0,10,0,7,0,2,0]];
function synthStep(c,st,at,o,L){
  const bar=Math.floor(st/16)%4,i=st%16,ch=SY_CH[bar],rt=SY_RT[bar];
  if(i%4===0){tone(c,150,at,.2,{v:.3,to:40,dest:o});noise(c,at,.03,.05,2000,{dest:o});}
  if(i%2===0){const up=(i/2)%4===3;tone(c,mtof(rt+(up?12:0)),at,.15,{type:'sawtooth',v:.075,dest:o});}
  if(L>=1){
    if(i%4===2)noise(c,at,.04,.03,9000,{type:'highpass',dest:o});
    const a=[0,1,2,1][(i>>0)%4],n=ch[a]+24;tone(c,mtof(n),at,.1,{type:'square',v:.026,dest:o});
  }
  if(L>=2){
    if(i===4||i===12){noise(c,at,.16,.1,3500,{dest:o});tone(c,210,at,.12,{type:'triangle',v:.07,to:160,dest:o});}
    if(i%2===1)noise(c,at,.02,.02,9500,{type:'highpass',dest:o});
    if(i===0)ch.forEach(m=>tone(c,mtof(m),at,stepDur('synth')*15,{type:'triangle',v:.032,dest:o}));
  }
  if(L>=3){
    const l=SY_LEAD[bar][Math.floor(i/2)];
    if(i%2===0&&l)tone(c,mtof(ch[0]+24+l-12),at,.24,{type:'sawtooth',v:.04,dest:o});
    if(i===0)tone(c,mtof(rt+24),at,.5,{type:'square',v:.02,dest:o});
  }
}
function musSwitch(want){
  const c=SND.ctx;
  if(MUS.bus&&c){
    const old=MUS.bus;
    try{old.gain.linearRampToValueAtTime(0.0001,c.currentTime+.6);}catch(e){}
    setTimeout(()=>{try{old.disconnect();}catch(e){}},900);
  }
  MUS.bus=null;MUS.mode=want;MUS.step=0;
  if(!want||!c)return;
  const b=c.createGain();b.gain.value=.0001;
  try{b.gain.linearRampToValueAtTime(1,c.currentTime+.8);}catch(e){b.gain.value=1;}
  b.connect(SND.mgain);MUS.bus=b;MUS.next=c.currentTime+.1;
}
function musTick(){
  const on=musicOn()&&!document.hidden;
  let want=null;
  if(on)want=document.querySelector('.smain.rl')?'synth':'lofi';
  if(want&&!SND.ctx&&!musCtx())want=null;
  if(want&&SND.ctx&&SND.ctx.state==='suspended'){try{SND.ctx.resume();}catch(e){}}
  if(want!==MUS.mode)musSwitch(want);
  if(!MUS.mode||!SND.ctx||!MUS.bus)return;
  const c=SND.ctx;
  try{SND.mgain.gain.value=Math.min(1,Math.max(0,(+state.mvol||0)/100))*.6;}catch(e){}
  let L=0,duck=1;
  if(MUS.mode==='synth'){
    const rt=document.querySelector('.smain.rl');
    if(rt){
      L=Math.min(3,+rt.dataset.lk||0);
      if(document.querySelector('.reel.no'))duck=.3;
      if(rt.dataset.end==='lose'){L=0;duck=.25;}
    }
  }
  try{if(MUS.bus.gain.setTargetAtTime)MUS.bus.gain.setTargetAtTime(duck,c.currentTime,.06);}catch(e){}
  if(MUS.next<c.currentTime-.5)MUS.next=c.currentTime+.05;
  const sd=stepDur(MUS.mode);let guard=0;
  while(MUS.next<c.currentTime+.3&&guard++<12){
    const at=MUS.next-c.currentTime;
    if(MUS.mode==='lofi')lofiStep(c,MUS.step,at,MUS.bus);else synthStep(c,MUS.step,at,MUS.bus,L);
    MUS.step++;MUS.next+=sd;
  }
}
function musIcon(){
  const on=musicOn();
  return `<button class="iconbtn sm musbtn" aria-pressed="${on}" aria-label="${t('Musik')}"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9v6h4l5 4V5L8 9z"/><path class="wv" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="mt" d="M16 9l5 6M21 9l-5 6"/></svg></button>`;
}
function musRefresh(){
  $$('.musbtn').forEach(b=>b.setAttribute('aria-pressed',String(musicOn())));
  $$('[data-mus]').forEach(b=>b.setAttribute('aria-checked',String((state.music===true)===(b.dataset.mus==='true'))));
}
function musSet(on){
  state.music=!!on;save();
  if(state.music&&!(+state.mvol>0))state.mvol=35;
  if(state.music)musCtx();
  musRefresh();musTick();
}
try{
  document.addEventListener('click',e=>{const b=e.target&&e.target.closest&&e.target.closest('.musbtn');if(b){musSet(!musicOn());if(musicOn())sfx('pop');}});
  // Nach dem Neuladen darf iOS erst nach der ersten Berührung Ton abspielen
  const wake=()=>{if(musicOn()){musCtx();musTick();}};
  document.addEventListener('pointerdown',wake,{capture:true,passive:true});
  document.addEventListener('visibilitychange',musTick);
  MUS.timer=setInterval(musTick,90);
}catch(e){}
window.MUS=MUS;
