.streak{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.sl{display:flex;align-items:flex-end;gap:10px}
.streak b{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--c-orange)}
.streak small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.fl{width:46px;height:58px;flex:none;overflow:visible;filter:drop-shadow(0 0 7px rgba(255,150,0,.5))}

.fl:not(.off) .f1{animation:fl1 1.3s ease-in-out infinite}
.fl:not(.off) .f2{animation:fl2 1s ease-in-out -.3s infinite}
.fl:not(.off) .f3{animation:fl3 .8s ease-in-out -.5s infinite}
.fl:not(.off) .f4{animation:fl4 .6s ease-in-out -.2s infinite}
@keyframes fl1{0%,100%{transform:scale(1,1) skewX(0deg)}33%{transform:scale(1.04,1.08) skewX(-3deg)}66%{transform:scale(.97,.95) skewX(2.5deg)}}
@keyframes fl2{0%,100%{transform:scale(1,1) skewX(0deg)}40%{transform:scale(.96,1.1) skewX(3deg)}75%{transform:scale(1.03,.94) skewX(-2deg)}}
@keyframes fl3{0%,100%{transform:scale(1,1) skewX(0deg)}50%{transform:scale(1.06,1.14) skewX(-2deg)}}
@keyframes fl4{0%,100%{transform:scale(1,1)}50%{transform:scale(.9,1.18)}}
.week{display:flex;gap:8px}
.day{display:grid;justify-items:center;gap:6px;font-size:11px;color:var(--faint)}

.day.now i{outline:2px solid var(--dc);outline-offset:2px}

.stack{display:flex;gap:2px;height:10px;border-radius:999px;overflow:hidden;background:var(--raised);margin-top:12px}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px;min-width:0}
.legend em{width:9px;height:9px;border-radius:50%;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--raised);font-weight:600;font-size:16px}
.btn.primary{background:linear-gradient(135deg,var(--c-yellow),var(--c-orange));border-color:transparent;color:var(--accent-ink);box-shadow:0 4px 0 #b3560f;transition:transform .06s,box-shadow .06s}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #b3560f}
.btn.primary.pulse{animation:glow 2.2s ease-out infinite}
@keyframes glow{0%,100%{box-shadow:0 4px 0 #b3560f,0 0 0 0 rgba(255,194,61,.55)}50%{box-shadow:0 4px 0 #b3560f,0 0 0 12px rgba(255,194,61,0)}}
.btn.ghost{background:transparent}
.btn.block{display:flex;width:100%}
.btn.danger{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap}

.field{display:block;width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.field::placeholder{color:var(--faint)}
textarea.field{padding:12px 14px;min-height:96px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px}
.pill{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px;font-weight:600}
.pill[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

details.cat{border-bottom:1px solid var(--line)}

.cnt{margin-left:auto;font-size:13px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
ul.rows{list-style:none;margin:0 0 10px 3px;padding:0;border-left:3px solid var(--cc)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0 10px 14px;border-top:1px solid var(--line-soft)}
.row .w{flex:1;min-width:0;display:flex;flex-direction:column}
.row .id{font:600 17px/1.25 var(--display);overflow-wrap:anywhere}
.row .en{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.meta{display:grid;justify-items:end;gap:4px;flex:none}
.pips{display:flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.pips i.f{background:var(--pc,var(--accent))}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-orange)}
.empty{padding:36px 0;text-align:center;color:var(--muted)}

.set{display:grid;gap:14px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.seg button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:700 18px var(--display)}
.seg button[aria-checked=true]{background:linear-gradient(135deg,var(--c-yellow),var(--c-orange));border-color:transparent;color:var(--accent-ink)}
details.how summary{cursor:pointer;font-weight:600;min-height:32px}
ol.steps{margin:10px 0 0;padding-left:20px;display:grid;gap:6px;color:var(--muted)}
.langrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.langrow .code{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c-yellow),var(--c-pink));color:var(--accent-ink);font:700 18px var(--display);flex:none}

.flash{color:var(--good);font-size:14px;min-height:1.4em}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tab{display:grid;justify-items:center;gap:2px;min-height:52px;padding:6px 4px;border:0;border-radius:12px;background:transparent;color:var(--faint);font-size:11px;font-weight:600}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[data-v=home]{--tc:var(--c-yellow)}
.tab[data-v=book]{--tc:var(--c-cyan)}
.tab[data-v=settings]{--tc:var(--c-pink)}
.tab[aria-current=page]{color:var(--tc)}

.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.sin{max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding:max(14px,env(safe-area-inset-top,0px)) 16px max(24px,env(safe-area-inset-bottom,0px))}
.shead{display:flex;align-items:center;gap:14px}
.iconbtn{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}

.sbar{flex:1;height:6px;border-radius:999px;background:var(--raised);overflow:hidden}

.scount{min-width:42px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.inwrap.pulse::after{animation:ring .55s ease-out}
.inwrap.typing .field{border-color:var(--pc);animation:breathe 1.3s ease-in-out infinite}
@keyframes ring{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.06,1.4)}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 3px var(--pcs)}50%{box-shadow:0 0 0 9px rgba(0,0,0,0)}}

@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}

@keyframes fly{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.3);opacity:0}}
.endstreak{display:flex;align-items:flex-end;gap:14px;font-size:15px;color:var(--muted)}
.endstreak b{font:700 40px/1 var(--display);color:var(--c-orange);margin-right:4px}

.res .rl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.res.good .rl{color:var(--good)}
.res.bad .rl{color:var(--bad)}

.pair em{font-style:normal;color:var(--faint);padding:0 6px}
.missed{display:flex;flex-wrap:wrap;gap:8px}
.missed span{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}

.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

Object.values(LANGS).forEach(L=>{
  L.words=[];L.catCount=L.cats.map(()=>0);
  L.cats.forEach((c,ci)=>c[1].split('\n').forEach(line=>{
    const i=line.indexOf(' = ');if(i<1)return;
    const id=line.slice(0,i).trim(),en=line.slice(i+3).trim();if(!id||!en)return;
    L.words.push({k:id.toLowerCase(),id,en,cat:ci});L.catCount[ci]++;
  }));
});

/* ---------- Hilfsfunktionen ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const normId=s=>fold(s).replace(/[^a-z0-9]/g,'');
function normEn(s){
  s=fold(s).replace(/\([^)]*\)/g,' ').replace(/[’‘`]/g,"'");
  s=s.replace(/cannot/g,'can not').replace(/can't/g,'can not').replace(/won't/g,'will not').replace(/n't\b/g,' not')
     .replace(/\bi'm\b/g,'i am').replace(/\b(it|that|what|there|he|she|here)'s\b/g,'$1 is').replace(/'re\b/g,' are');
  s=s.replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  return s.replace(/^(to|a|an|the) (?=\S)/,'');
}
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const dayName=(s,o)=>parse(s).toLocaleDateString('de-DE',o);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}

/* ---------- Zustand ---------- */
const defaults=()=>({v:1,lang:null,newPerDay:1,dayOffset:0,progress:{},daily:{date:'',newCount:0,extra:0},done:{}});
let state=load();
function load(){try{const raw=localStorage.getItem(STORE);if(raw)return Object.assign(defaults(),JSON.parse(raw));}catch(e){}return defaults();}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}
function today(){const d=new Date();d.setDate(d.getDate()+(state.dayOffset||0));return ymd(d)}
function daily(){const t=today();if(state.daily.date!==t)state.daily={date:t,newCount:0,extra:0};return state.daily}
const curLang=()=>LANGS[state.lang];

function plan(){
  const L=curLang(),t=today(),prog=state.progress[L.id]||{};
  const due=shuffle(L.words.filter(w=>prog[w.k]&&prog[w.k].d<=t)).sort((a,b)=>prog[a.k].d<prog[b.k].d?-1:prog[a.k].d>prog[b.k].d?1:0);
  const dq=daily(),need=Math.max(0,state.newPerDay+dq.extra-dq.newCount);
  const fresh=L.words.filter(w=>!prog[w.k]).slice(0,need);
  return {due,fresh};
}
function streak(){
  const t=today();let d=state.done[t]?t:addDays(t,-1),n=0;
  while(state.done[d]){n++;d=addDays(d,-1);}
  return n;
}
function record(w,ok){
  const L=curLang(),prog=state.progress[L.id]||(state.progress[L.id]={});
  const prev=prog[w.k],dq=daily();
  const level=ok?Math.min((prev?prev.l:0)+1,5):0;
  const days=ok?INTERVALS[level-1]:1;
  prog[w.k]={l:level,d:addDays(today(),days)};
  if(!prev)dq.newCount++;
  save();
  return {level,days};
}

/* ---------- Farben & Effekte ---------- */
const PAL=['#ffc23d','#ff8a3d','#ff5c9d','#a888ff','#5aa9ff','#35dcd2','#6ee77a'];
const CATCOL=['var(--c-yellow)','var(--c-pink)','var(--c-cyan)','var(--c-violet)','var(--c-green)','var(--c-orange)','var(--c-blue)'];
const WDCOL=['var(--c-violet)','var(--c-blue)','var(--c-cyan)','var(--c-green)','var(--c-yellow)','var(--c-orange)','var(--c-pink)']; // So bis Sa
const LVCOL=['var(--lv0)','var(--lv1)','var(--lv2)','var(--lv3)','var(--lv4)','var(--lv5)'];
const reduceMotion=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};

/* Flamme im Duolingo-Stil: vier Schichten desselben Umrisses, von innen nach außen dunkler.
   Jede Schicht wackelt in eigenem Takt. Bei 0 Tagen ist sie grau und ruhig. */
const FLAME_D='M32 3C36 16 54 30 54 52C54 67 44 77 32 77C20 77 10 67 10 52C10 40 17 34 22 26C24 32 27 35 30 36C29 24 29 12 32 3Z';
function flameSvg(streak,big){
  const on=streak>0,sc=[1,.76,.54,.33];
  const cols=on?['#ff7a00','#ff9600','#ffc800','#fff3a6']:['#3b4670','#4a5686','#5e6a9b','#7681b0'];
  const layers=sc.map((k,i)=>`<g transform="translate(${(32*(1-k)).toFixed(1)} ${(77*(1-k)-i*2).toFixed(1)}) scale(${k})"><path class="f${i+1}" d="${FLAME_D}" fill="${cols[i]}"/></g>`).join('');
  return `<svg class="fl${big?' big':''}${on?'':' off'}" viewBox="0 0 64 80" role="img" aria-label="Flamme: ${streak} ${streak===1?'Tag':'Tage'} in Folge">${layers}</svg>`;
}
function burst(el,n){
  if(reduceMotion()||!el)return;
  const r=el.getBoundingClientRect(),box=document.createElement('div');
  box.className='confetti';box.style.left=(r.left+r.width/2)+'px';box.style.top=(r.top+r.height/2)+'px';
  for(let i=0;i<n;i++){
    const p=document.createElement('i'),a=Math.random()*Math.PI*2,s=70+Math.random()*140;
    p.style.setProperty('--dx',Math.round(Math.cos(a)*s)+'px');p.style.setProperty('--dy',Math.round(Math.sin(a)*s-40)+'px');
    p.style.setProperty('--r',Math.round(Math.random()*360)+'deg');p.style.setProperty('--cf',PAL[i%PAL.length]);
    p.style.animationDelay=(Math.random()*90|0)+'ms';box.appendChild(p);
  }
  document.body.appendChild(box);setTimeout(()=>box.remove(),1200);
}

let view='home',bookQ='',bookQraw='',bookF='all';
const openCats=new Set();
const app=$('#app'),tabs=$('#tabs'),sheet=$('#sheet');

function render(){
  if(!state.lang||!LANGS[state.lang]){tabs.hidden=true;app.innerHTML=langView();$$('[data-lang]',app).forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;save();view='home';render();});return;}
  tabs.hidden=false;
  $$('.tab',tabs).forEach(b=>{if(b.dataset.v===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  if(view==='home'){app.innerHTML=homeView();bindHome();}
  else if(view==='book'){app.innerHTML=bookView();bindBook();}
  else{app.innerHTML=settingsView();bindSettings();}
}
function go(v){view=v;render();try{window.scrollTo(0,0);}catch(e){}}
$$('.tab',tabs).forEach(b=>b.onclick=()=>go(b.dataset.v));

  <h1>Welche Sprache lernst du?</h1>
  <p class="hint" style="margin:8px 0 18px">„Kata“ heißt auf Indonesisch „Wort“. Dein Fortschritt bleibt auf diesem Gerät.</p>

  <p class="hint" style="margin-top:16px">Weitere Sprachen lassen sich später ergänzen.</p>`;
}

function homeView(){
  const L=curLang(),t=today(),p=plan(),prog=state.progress[L.id]||{};
  const n1=p.due.length,n2=p.fresh.length,total=n1+n2,doneToday=!!state.done[t],st=streak();
  let week='';
  for(let i=6;i>=0;i--){
    const d=addDays(t,-i),on=!!state.done[d];
    week+=`<div class="day${on?' on':''}${i===0?' now':''}" style="--dc:${WDCOL[parse(d).getDay()]}" aria-label="${esc(dayName(d,{weekday:'long',day:'numeric',month:'long'}))}: ${on?'erledigt':'offen'}"><i></i><span>${dayName(d,{weekday:'narrow'})}</span></div>`;
  }
  const tomorrow=addDays(t,1);
  const nTomorrow=L.words.filter(w=>prog[w.k]&&prog[w.k].d===tomorrow).length;
  const unseen=L.words.filter(w=>!prog[w.k]).length;
  let planHtml;
  if(total>0){
    planHtml=`<div class="eyebrow">Heute dran</div>
      <div class="nums"><div class="num"><b>${n1}</b><span>${n1===1?'Wiederholung':'Wiederholungen'}</span></div><div class="num"><b>${n2}</b><span>${n2===1?'neue Vokabel':'neue Vokabeln'}</span></div></div>
      <button class="btn primary block pulse" id="start">Abfrage starten</button>`;
  }else{
    planHtml=`<div class="eyebrow">Heute</div>
      <h2>${doneToday?'Für heute geschafft.':'Heute ist nichts fällig.'}</h2>
      <p class="hint">${nTomorrow>0?'Morgen kommen '+nTomorrow+(nTomorrow===1?' Wiederholung':' Wiederholungen')+' dran.':'Morgen steht noch keine Wiederholung an.'}</p>
      ${unseen>0?'<div class="btns" style="margin-top:14px"><button class="btn block" id="extra">Noch eine neue Vokabel</button></div>':''}`;
  }
  const lv=[0,0,0,0,0,0];let nNew=0;
  L.words.forEach(w=>{const q=prog[w.k];if(!q)nNew++;else lv[q.l]++;});
  const N=L.words.length;
  const parts=[5,4,3,2,1,0].map(n=>({c:LVCOL[n],n:lv[n],l:n===0?'Nochmal':'Stufe '+n})).concat([{c:'var(--raised)',n:nNew,l:'Noch neu'}]);
  const seg=parts.filter(p=>p.n>0).map(p=>`<i style="width:${(p.n/N*100).toFixed(2)}%;background:${p.c}"></i>`).join('');
  const legend=parts.map(p=>`<span><em style="background:${p.c}${p.l==='Noch neu'?';border:1px solid var(--line)':''}"></em>${p.l}<b>${p.n}</b></span>`).join('');
  return `<div class="top"><div class="brand"><i></i><span>kata<b>.</b><em>vito</em></span></div><button class="chip" id="chlang" aria-label="Sprache wechseln">${esc(L.name)}</button></div>
  <h1>${esc(dayName(t,{weekday:'long',day:'numeric',month:'long'}))}</h1>
  <section class="card plan">${planHtml}</section>
  <section class="card"><div class="streak"><div class="sl">${flameSvg(st,false)}<div><b>${st}</b><small>${st===1?'Tag':'Tage'} in Folge</small></div></div><div class="week">${week}</div></div></section>
  <section class="card"><div class="eyebrow">Fortschritt</div>
    <p style="margin-top:6px"><b>${N-nNew}</b> von ${N} Wörtern begonnen</p>
    <div class="stack" role="img" aria-label="${parts.map(p=>p.n+' '+p.l).join(', ')}">${seg}</div>
    <div class="legend">${legend}</div></section>`;
}
function bindHome(){
  const s=$('#start');if(s)s.onclick=startSession;
  const e=$('#extra');if(e)e.onclick=()=>{daily().extra++;save();startSession();};
  $('#chlang').onclick=()=>{state.lang=null;save();render();};
}

  return `<div class="top"><h1>Vokabelheft</h1><span class="hint">${L.words.length} Wörter</span></div>
  <input id="q" class="field" type="search" placeholder="Suchen auf Indonesisch oder Englisch" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Suchen" value="${esc(bookQraw)}">
  <div class="chips" role="group" aria-label="Filter">${[['all','Alle'],['due','Fällig'],['learned','Gelernt'],['new','Neu']].map(f=>`<button class="pill" data-f="${f[0]}" aria-pressed="${bookF===f[0]}">${f[1]}</button>`).join('')}</div>
  <div id="vlist"></div>`;
}
function bindBook(){
  $('#q').oninput=e=>{bookQraw=e.target.value;bookQ=fold(bookQraw.trim());renderList();};
  $$('.pill',app).forEach(b=>b.onclick=()=>{bookF=b.dataset.f;$$('.pill',app).forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.f===bookF)));renderList();});
  $('#vlist').addEventListener('toggle',e=>{
    if(bookQ||bookF!=='all')return;
    const d=e.target;if(!d.dataset||d.dataset.c===undefined)return;
    if(d.open)openCats.add(d.dataset.c);else openCats.delete(d.dataset.c);
  },true);
  renderList();
}
function renderList(){
  const L=curLang(),t=today(),prog=state.progress[L.id]||{};
  const groups=L.cats.map(()=>[]);
  L.words.forEach(w=>{
    const pr=prog[w.k];
    if(bookF==='due'&&!(pr&&pr.d<=t))return;
    if(bookF==='learned'&&!(pr&&pr.l>=1))return;
    if(bookF==='new'&&pr)return;
    if(bookQ&&!(fold(w.id).includes(bookQ)||fold(w.en).includes(bookQ)))return;
    groups[w.cat].push(w);
  });
  const force=!!bookQ||bookF!=='all';
  let html='';
  groups.forEach((items,ci)=>{
    if(!items.length)return;
    const learned=L.words.filter(w=>w.cat===ci&&prog[w.k]&&prog[w.k].l>=1).length;
    html+=`<details class="cat" style="--cc:${CATCOL[ci%CATCOL.length]}" data-c="${ci}"${force||openCats.has(String(ci))?' open':''}><summary>${esc(L.cats[ci][0])}<span class="cnt">${force?items.length+' Treffer':learned+' / '+L.catCount[ci]}</span></summary><ul class="rows">${items.map(w=>{
      const pr=prog[w.k],due=pr&&pr.d<=t;
      return `<li class="row"><div class="w"><span class="id" lang="${L.code.toLowerCase()}">${esc(w.id)}</span><span class="en" lang="en">${esc(w.en)}</span></div><div class="meta"><div class="pips" style="--pc:${LVCOL[pr?pr.l:0]}" role="img" aria-label="Stufe ${pr?pr.l:0} von 5">${[1,2,3,4,5].map(n=>`<i${pr&&pr.l>=n?' class="f"':''}></i>`).join('')}</div>${due?'<span class="tag">fällig</span>':''}</div></li>`;
    }).join('')}</ul></details>`;
  });
  $('#vlist').innerHTML=html||'<div class="empty">Nichts gefunden.</div>';
}

function settingsView(){
  const L=curLang(),t=today();
  return `<div class="top"><h1>Einstellungen</h1></div>
  <section class="card set"><div><div class="eyebrow">Neue Vokabeln pro Tag</div>
    <div class="seg" role="radiogroup" aria-label="Neue Vokabeln pro Tag">${[1,2,3,4,5].map(n=>`<button role="radio" data-n="${n}" aria-checked="${state.newPerDay===n}">${n}</button>`).join('')}</div></div>
    <p class="hint">Dazu kommen immer alle fälligen Wiederholungen.</p></section>
  <section class="card set"><div class="eyebrow">Tägliche Erinnerung</div>
    <p class="hint">Eine Web-App kann sich nicht selbst melden. Das übernimmt dein iPhone, die Uhrzeit stellst du dort ein.</p>
    <details class="how"><summary>So richtest du sie ein</summary><ol class="steps">
      <li>Kurzbefehle-App öffnen, Tab „Automation“, „+“, „Tageszeit“.</li>
      <li>Uhrzeit wählen, „Täglich“, „Sofort ausführen“.</li>
      <li>Aktion „URL öffnen“ mit der Adresse dieser App hinzufügen.</li>
      <li>Je nach iOS-Version musst du die Mitteilung antippen oder das iPhone entsperren, damit sich die Seite öffnet.</li>
      <li>Alternative: In der Erinnerungen-App eine tägliche Erinnerung mit der Adresse als Link anlegen.</li></ol></details></section>
  <section class="card set"><div class="eyebrow">Sicherung</div>
    <p class="hint">Kopiere den Text in eine Notiz. Zum Wiederherstellen fügst du ihn unten ein.</p>
    <div class="btns"><button class="btn" id="exp">Sicherung erstellen</button><button class="btn ghost" id="copy" hidden>Kopieren</button></div>
    <textarea class="field" id="expbox" readonly hidden aria-label="Sicherung" rows="4"></textarea><div class="flash" id="flash1" role="status"></div>
    <textarea class="field" id="impbox" placeholder="Sicherung hier einfügen" aria-label="Sicherung einfügen" rows="3"></textarea>
    <div class="btns"><button class="btn" id="imp">Sicherung einspielen</button></div><div class="flash" id="flash2" role="status"></div></section>
  <section class="card set"><div class="eyebrow">Sprache</div>
    <div class="btns"><button class="btn" id="chlang2">${esc(L.name)} ändern</button></div></section>
  <section class="card set"><div class="eyebrow">Testen</div>
    <p class="hint">Simuliert einen späteren Tag, damit du die Wiederholungen siehst. Aktuelles Datum in der App: <b>${esc(dayName(t,{weekday:'short',day:'numeric',month:'short'}))}</b>${state.dayOffset?' (+'+state.dayOffset+')':''}</p>
    <div class="btns"><button class="btn" id="skip">Einen Tag vorspulen</button><button class="btn ghost" id="unskip"${state.dayOffset?'':' disabled'}>Zurück auf heute</button></div>
    <div class="btns"><button class="btn" id="reset">Alles zurücksetzen</button></div></section>`;
}
function twoStep(btn,armed,fn){
  const orig=btn.textContent;let on=false,timer;
  btn.onclick=()=>{
    if(!on){on=true;btn.textContent=armed;btn.classList.add('danger');timer=setTimeout(()=>{on=false;btn.textContent=orig;btn.classList.remove('danger');},4000);}
    else{clearTimeout(timer);on=false;btn.textContent=orig;btn.classList.remove('danger');fn();}
  };
}
function bindSettings(){
  $$('.seg button',app).forEach(b=>b.onclick=()=>{state.newPerDay=+b.dataset.n;save();$$('.seg button',app).forEach(x=>x.setAttribute('aria-checked',String(x===b)));});
  $('#exp').onclick=()=>{
    const data=JSON.stringify({app:'kata',v:1,exported:new Date().toISOString(),data:{lang:state.lang,newPerDay:state.newPerDay,progress:state.progress,daily:state.daily,done:state.done}});
    const box=$('#expbox');box.value=data;box.hidden=false;$('#copy').hidden=false;box.select();$('#flash1').textContent='';
  };
  $('#copy').onclick=()=>{
    const box=$('#expbox');
    const ok=()=>{$('#flash1').textContent='Kopiert.';};
    const fallback=()=>{box.select();$('#flash1').textContent='Text ist markiert. Jetzt manuell kopieren.';};
    try{navigator.clipboard.writeText(box.value).then(ok,fallback);}catch(e){fallback();}
  };
  twoStep($('#imp'),'Wirklich ersetzen? Nochmal tippen',()=>{
    try{
      const o=JSON.parse($('#impbox').value);
      if(!o||o.app!=='kata'||!o.data||typeof o.data.progress!=='object')throw new Error('x');
      state=Object.assign(defaults(),o.data,{dayOffset:0});save();render();
    }catch(e){$('#flash2').style.color='var(--bad)';$('#flash2').textContent='Das ist keine gültige Sicherung.';render_keep();}
  });
  $('#chlang2').onclick=()=>{state.lang=null;save();render();};
  $('#skip').onclick=()=>{state.dayOffset=(state.dayOffset||0)+1;save();render();};
  $('#unskip').onclick=()=>{state.dayOffset=0;save();render();};
  twoStep($('#reset'),'Wirklich alles löschen? Nochmal tippen',()=>{state=defaults();save();view='home';render();});
}
function render_keep(){/* Fehlermeldung bleibt stehen, Ansicht wird nicht neu gebaut */}

/* ---------- Abfrage ---------- */
let S=null;
function startSession(){
  const p=plan();
  const items=p.due.map(w=>({w,type:'review'})).concat(p.fresh.map(w=>({w,type:'new'})));
  if(!items.length)return;
  S={items,i:0,right:0,wrong:0,missed:[],cur:null,streak0:streak()};
  sheet.hidden=false;document.body.style.overflow='hidden';
  showItem();
}
function closeSheet(){sheet.hidden=true;sheet.innerHTML='';document.body.style.overflow='';S=null;render();}
function sheetBody(inner){
  const pct=S.items.length?Math.round(S.i/S.items.length*100):0;
  sheet.innerHTML=`<div class="sin"><div class="shead"><button class="iconbtn" id="quit" aria-label="Abfrage beenden"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="sbar" role="progressbar" aria-valuemin="0" aria-valuemax="${S.items.length}" aria-valuenow="${S.i}"><i style="width:${pct}%;--p:${Math.max(pct/100,0.05)}"></i></div><div class="scount">${Math.min(S.i+1,S.items.length)} / ${S.items.length}</div></div>${inner}</div>`;
  $('#quit').onclick=closeSheet;
  sheet.scrollTop=0;
}
function showItem(){
  const it=S.items[S.i];
  if(!it)return showEnd();
  const L=curLang(),key=normEn(it.w.en);
  const same=L.words.filter(x=>normEn(x.en)===key);
  S.cur={w:it.w,type:it.type,tries:0,dir:Math.random()<.5?'id2en':'en2id',accept:same.map(x=>normId(x.id)),alts:same.filter(x=>x.k!==it.w.k).map(x=>x.id)};
  if(it.type==='new')showIntro();else showQuestion();
}
function showIntro(){
  const w=S.cur.w,L=curLang();
  sheetBody(`<div class="smain"><div class="kicker" style="--k:var(--c-violet)">Neue Vokabel · ${esc(L.cats[w.cat][0])}</div>
    <div class="bigword" lang="${L.code.toLowerCase()}">${esc(w.id)}</div><div class="gloss" lang="en">${esc(w.en)}</div>
    <p class="hint">Präg dir das Wort kurz ein. Gleich wird es abgefragt.</p>
    <button class="btn primary block" id="go">Abfragen</button></div>`);
  $('#go').onclick=showQuestion;
}
function hintFor(c){
  let t=c.dir==='id2en'?c.w.en.split('/')[0]:c.w.id;
  t=t.replace(/\([^)]*\)/g,'').replace(/^\s*to\s+(?=\S)/i,'').trim();
  return t.slice(0,2);
}
function isCorrect(c,val){
  if(c.dir==='id2en'){const a=normEn(val);return !!a&&c.w.en.split('/').map(normEn).indexOf(a)>-1;}
  const a=normId(val);return !!a&&c.accept.indexOf(a)>-1;
}
function dots(n){return [0,1,2].map(i=>`<i class="${i<n?'':'x'}"></i>`).join('')}
function showQuestion(){
  const c=S.cur,w=c.w,L=curLang(),id2en=c.dir==='id2en';
  const lvl=(state.progress[L.id]&&state.progress[L.id][w.k])?state.progress[L.id][w.k].l:0;
  const kick=(c.type==='review'?'Wiederholung · Stufe '+lvl:'Neue Vokabel')+' · '+(id2en?'ins Englische':'ins Indonesische');
  c.tries=0;
  sheetBody(`<div class="smain"><div class="kicker" style="--k:${c.type==='review'?LVCOL[lvl]:'var(--c-violet)'}">${kick}</div>
    <div class="bigword" lang="${id2en?L.code.toLowerCase():'en'}">${esc(id2en?w.id:w.en)}</div>
    <form class="qform" id="qf" autocomplete="off"><div class="inwrap" id="iw"><input class="field" id="ans" type="text" aria-label="Deine Antwort" placeholder="Antwort tippen" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done"></div>
    <button class="btn primary block" type="submit">Prüfen</button></form>
    <div class="tries" id="tries">${dots(3)}<span>Versuche übrig</span></div>
    <p class="fb" id="fb" role="status" aria-live="polite"></p></div>`);
  const inp=$('#ans'),iw=$('#iw');let keys=0;
  inp.addEventListener('input',()=>{
    const col=PAL[++keys%PAL.length];
    iw.style.setProperty('--pc',col);iw.style.setProperty('--pcs',col+'44');
    iw.classList.toggle('typing',inp.value.length>0);
    iw.classList.remove('pulse');void iw.offsetWidth;iw.classList.add('pulse');
  });
  $('#qf').onsubmit=e=>{
    e.preventDefault();
    const val=inp.value;
    if(!val.trim()){inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');return;}
    c.tries++;
    if(isCorrect(c,val))return finish(true);
    if(c.tries>=3)return finish(false);
    const left=3-c.tries,fb=$('#fb');
    fb.className='fb bad';
    fb.textContent='Nicht ganz. Noch '+left+(left===1?' Versuch.':' Versuche.')+(c.tries===2?' Tipp: beginnt mit „'+hintFor(c)+'“.':'');
    $('#tries').innerHTML=dots(left)+'<span>Versuche übrig</span>';
    inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');inp.select();
  };
  try{inp.focus({preventScroll:true});}catch(e){inp.focus();}
}
function finish(ok){
  const c=S.cur,w=c.w,r=record(w,ok);
  if(ok)S.right++;else{S.wrong++;S.missed.push(w);}
  const L=curLang();
  const alts=c.dir==='en2id'&&c.alts.length?`<p class="hint" style="margin-top:6px">Auch richtig: ${c.alts.map(esc).join(', ')}</p>`:'';
  const when=ok?'Stufe '+r.level+' von 5. Nächste Wiederholung '+(r.days===1?'morgen':'in '+r.days+' Tagen')+'.':'Die Vokabel kommt morgen wieder dran.';
  sheetBody(`<div class="smain"><div class="res ${ok?'good':'bad'}" role="status"><div class="rl">${ok?'Richtig':'Leider falsch'}</div>
    <div class="pair"><span lang="${L.code.toLowerCase()}">${esc(w.id)}</span><em>=</em><span lang="en">${esc(w.en)}</span></div>${alts}</div>
    <p class="hint">${when}</p><button class="btn primary block" id="next">Weiter</button></div>`);
  const n=$('#next');n.onclick=()=>{S.i++;showItem();};
  try{n.focus({preventScroll:true});}catch(e){}
  if(ok)burst($('.res'),28);
}
function showEnd(){
  const t=today();
  state.done[t]=true;
  Object.keys(state.done).forEach(k=>{if(k<addDays(t,-120))delete state.done[k];});
  save();
  const total=S.items.length,st=streak();
  const missed=S.missed.length?`<div><p class="hint" style="margin-bottom:8px">Morgen wieder dabei:</p><div class="missed">${S.missed.map(w=>`<span>${esc(w.id)}</span>`).join('')}</div></div>`:'';
  const grew=st>S.streak0;
  S.i=total;
  sheetBody(`<div class="smain"><div class="kicker" style="--k:var(--c-pink)">Abfrage beendet</div>
    <div class="bigword">${S.right} von ${total}</div><p class="hint">richtig beantwortet</p>
    <div class="endstreak${grew?' grew':''}">${flameSvg(st,true)}<div><b>${st}</b>${st===1?'Tag':'Tage'} in Folge<small>${grew?'Serie verlängert!':'Die Serie läuft weiter.'}</small></div></div>${missed}
    <button class="btn primary block" id="fin">Fertig</button></div>`);
  $('#fin').onclick=closeSheet;
  if(grew)burst($('.endstreak'),44);else if(S.right===total)burst($('.bigword'),32);
}

render();
})();
</script>
