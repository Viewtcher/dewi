/* ===== modules/reels.js ===== */
/* Modul Reels: Spielautomat. Drei Walzen tragen Wörter des Beispielsatzes (bei längeren Sätzen: das gelernte Wort und seine zwei Nachbarn).
   Hebel ziehen, dann jede Walze antippen, wenn das richtige Wort auf der Linie steht.
   Richtig: Walze rastet grün ein. Falsch: Walze zuckt rot und dreht wieder an (ein Fehler ist frei, im Survival nicht).
   Jackpot (alles beim ersten Stopp) ist nur Show und ändert nichts an Stufen oder Punkten. */
const RL_ROW=44,RL_FAST=10,RL_SLOW=2.2;   // Wörter pro Sekunde: alle rasen, nur die aktive Walze wird langsam
/* Reels gibt es nur, wenn alle drei Walzen Wörter tragen, die schon gelernt sind (und zusammen im Satz stehen). Das Fenster aus drei Wörtern
   weicht unbekannten Wörtern aus; findet sich keins, kommt Reels für dieses Wort nicht vor (Ersatzmodul bzw. im Solo übersprungen).
   Es gibt keine vorgesetzten (geschenkten) Walzen: alle drei müssen selbst gestoppt werden. */
const RL_MIN_OWN=3;
function reelsPlan(w,s,dir){
  const idT=tilesOf(s.id),glT=tilesOf(s.plain);
  if(idT.length<3||glT.length<3)return null;
  const from=dir==='gl2id'?s.plain:s.id,toks=dir==='gl2id'?idT:glT,toLang=dir==='gl2id'?'id':state.ui;
  let idx;
  if(dir==='gl2id'){
    const f=normId(tokensOf(w.id)[0]||'');idx=toks.findIndex(x=>normId(x)===f);
  }else{
    const m=s.tpl.match(/\[([^\]]+)\]/);idx=m?tokensOf(s.tpl.slice(0,m.index)).length:-1;
  }
  const found=idx>=0&&idx<toks.length;   // Zielwort im Satz gefunden? (z. B. „dua belas“ steht als „kedua belas“ im Satz: nicht gefunden)
  if(!found)idx=Math.floor(toks.length/2);
  const known=knownTokens(w),unk=new Set();   // Positionen unbekannter Wörter in toks
  const idUnknown=idT.filter(tk=>!isName(tk)&&!known.has(normId(tk)));
  if(dir==='gl2id'){idT.forEach((tk,i)=>{if(!isName(tk)&&!known.has(normId(tk)))unk.add(i);});}
  else for(const u of idUnknown){const eq=blockEquiv(u,glT);if(!eq)return null;eq.forEach(i=>unk.add(i));}
  if(found)unk.delete(idx);
  if(window.__rlAll)unk.clear();   // nur für Tests: alle Walzen selbst stoppen
  let best=null;
  for(let st=Math.max(0,idx-2);st<=Math.min(idx,toks.length-3);st++){
    const n=[0,1,2].filter(i=>unk.has(st+i)).length;
    if(!best||n<best.n||(n===best.n&&Math.random()<.5))best={st,n};
  }
  if(!best||3-best.n<RL_MIN_OWN)return null;
  const st=best.st,right=toks.slice(st,st+3);
  const reels=right.map((r,i)=>{
    const words=[r].concat(distractors(toks,toLang,9).filter(x=>x.length<=9).slice(0,2));
    const ws=shuffle(words);
    return {words:ws,right:ws.indexOf(r)};
  });
  return {dir,toLang,from,toks,st,right,reels,before:toks.slice(0,st).join(' '),after:toks.slice(st+3).join(' '),full:toks.join(' '),
    fullFrom:from};
}
function reelsData(w){
  const s=sentOf(w);if(!s)return null;
  const dirs=Math.random()<.5?['gl2id','id2gl']:['id2gl','gl2id'];
  for(const d of dirs){const p=reelsPlan(w,s,d);if(p)return p;}
  return null;
}
const rlMod=(a,n)=>((a%n)+n)%n;
const rlEase=k=>{const c=1.4;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);};

/* Funktionswörter ohne eigene Entsprechung in der anderen Sprache: werden nie „geraten“ markiert */
/* Satz oben: genau die Wörter, die den drei Walzen entsprechen (gelb).
   Erst die sichere Zuordnung (Wörterbuch, gebeugte Formen, Ähnlichkeit); für Walzen-Wörter ohne Treffer das nächstliegende freie Wort
   an ähnlicher Stelle im Satz (keine Funktionswörter wie der/die/das/ist). */
function reelsMarks(w,s,D){
  /* Version 118: Die drei Walzen decken drei Wörter ab. Welche Wörter das im anderen Satz sind,
     steht in der Zuordnungstabelle; ohne geprüften Eintrag wird nichts markiert. */
  const win=[D.st,D.st+1,D.st+2],gl2id=D.dir==='gl2id';
  const txt=gl2id?s.plain:s.id,al=alignFor(w,s.id,s.plain);
  const y=new Set(learnedIdx(w,s,gl2id?'gl':'id'));   // die gelernte Vokabel steht in den Daten, immer markiert
  if(al)mapIdx(al,win,gl2id?'a':'b').forEach(k=>y.add(k));
  return markTokens(txt,Array.from(y),'slot');
}
function reelsPrompt(w,D){
  const s=sentOf(w);
  if(!s)return esc(D.from);
  return reelsMarks(w,s,D);
}
function showReels(w){
  const c=S.cur,L=curLang(),D=reelsData(w);
  const tries=triesFor('reels'),list=reduceMotion();
  const R={D,tries,miss:0,locked:0,state:'idle',reels:D.reels.map(r=>({words:r.words,right:r.right,p:Math.random()*6,v:RL_FAST*(.9+Math.random()*.2),st:'fast',t:0,p0:0,tgt:0})),tick:0};
  c.rl=R;
  const maxLen=Math.max(...D.reels.map(r=>Math.max(...r.words.map(x=>x.length))));
  const fs=maxLen>8?'rw-s':maxLen>6?'rw-m':'';
  const ctx='';   // der graue Rest des Satzes (außerhalb der drei Walzen) wird nicht mehr gezeigt: dort stehen oft noch unbekannte Wörter
  const bulbs=n=>'<i></i>'.repeat(n);
  const reelHtml=list?
    D.reels.map((r,i)=>`<div class="rl-pick" data-i="${i}" role="group" aria-label="${t('Walze {0}',i+1)}">${r.words.map((x,k)=>`<button class="opt" data-k="${k}" lang="${D.toLang==='id'?L.code.toLowerCase():state.ui}">${esc(x)}</button>`).join('')}</div>`).join(''):
    D.reels.map((r,i)=>`<div class="reel ${fs}" data-i="${i}" aria-label="${t('Walze {0}',i+1)}" lang="${D.toLang==='id'?L.code.toLowerCase():state.ui}">${[0,1,2,3,4].map(()=>'<div class="rw"><span></span></div>').join('')}</div>`).join('');
  sheetBody(`<div class="smain rl">${kicker(c,'reels',D.dir==='gl2id'?toIdl():toGl())}${roundLives()}
    <div id="rlm" class="rl-m">${mascot('reels_ready',null,'sm')}</div>
    <div class="sentbox hq" lang="${D.dir==='gl2id'?state.ui:L.code.toLowerCase()}">${reelsPrompt(w,D)}${helpBtn('reels')}</div>${ctx}
    ${list?`<div class="rl-list">${reelHtml}</div>`:`<div class="cab" id="cab" data-st="idle">
      <div class="bl bt">${bulbs(11)}</div><div class="bl bb">${bulbs(11)}</div><div class="bl bl2">${bulbs(5)}</div><div class="bl br2">${bulbs(5)}</div>
      <div class="sign" id="sign">DEWI REELS</div>
      <div class="cbody"><div class="win" id="win" role="button" tabindex="0" aria-label="${t('Walzen stoppen')}">${reelHtml}</div>
        <div class="lev"><div class="track"></div><div class="knob" id="knob" role="button" tabindex="0" aria-label="${t('Hebel ziehen')}"></div></div></div>
    </div>`}
    <div id="exfb"></div></div>`);
  const cab=$('#cab'),sign=$('#sign');
  const say=k=>{const m=$('#rlm');if(m)m.innerHTML=mascot(k,null,'sm');};
  const alive=()=>!!$('#rlm');
  const el=i=>$$('.reel',sheet)[i];

  function paint(i){
    const r=R.reels[i],e=el(i);if(!e)return;
    const base=Math.round(r.p),d=r.p-base,n=r.words.length;
    e.querySelectorAll('.rw').forEach((row,k)=>{
      const off=k-2,txt=r.words[rlMod(base+off,n)],sp=row.firstChild;
      if(sp.textContent!==txt)sp.textContent=txt;
      row.style.transform=`translateY(${((off-d)*RL_ROW+RL_ROW).toFixed(1)}px)`;
      row.classList.toggle('mid',off===0);
    });
    e.classList.toggle('blur',r.v>5&&(r.st==='fast'||r.st==='slow'));
    if(R.last[i]!==base){R.last[i]=base;if(r.st==='slow'){const now=performance.now();if(now-R.tick>55){R.tick=now;sfx('tick');}}}
  }
  R.last=[];
  const curIdx=()=>R.reels.findIndex(r=>r.st!=='ok');
  function paintAll(){R.reels.forEach((_,i)=>paint(i));const a=R.state==='over'?-1:curIdx();$$('.reel',sheet).forEach((e,i)=>e.classList.toggle('act',i===a&&R.state==='spin'&&(R.reels[i].st==='slow'||R.reels[i].st==='snap')));}

  const root=$('.smain.rl');if(root&&R.locked)root.dataset.lk=String(R.locked);
  function finish(win){
    R.state='over';
    const jack=win&&R.miss===0;
    R.jack=jack;
    c.ok=c.ok&&win;settleCard();
    if(cab)cab.dataset.st=jack?'jack':win?'win':'lose';
    if(sign)sign.textContent=jack?'JACKPOT':win?'YES!':'GAME OVER';
    R.reels.forEach((r,i)=>{
      if(!win&&r.st!=='ok'){r.st='rev';r.p=r.right;const e=el(i);if(e){e.classList.remove('no');e.classList.add('rev');}}
      if(jack){const e=el(i);if(e)e.classList.add('gold');}
    });
    paintAll();
    if(win)chipRain(jack?46:28);   // Version 132: Chipregen statt Diamanten
    if(jack){sfx('jackpot');haptic([30,40,30,40,30,40,80]);const b=cab||sheet;burst(b,46);setTimeout(()=>alive()&&burst(b,34),350);}
    else if(win){sfx('chips');haptic([20,30,20]);}
    else{sfx('end_bad');}
    say(jack?'reels_jackpot':win?'reels_win':'reels_lose');
    const L2=D.toLang==='id'?L.code.toLowerCase():state.ui;
    R.resultHtml=`<div class="res ${win?'good':'bad'}" data-snd="1" role="status"><div class="rl">${jack?t('Jackpot!'):win?t('Richtig'):t('Nicht ganz')}</div>
      <div class="pair" lang="${L2}">${esc(D.full)}</div></div>
      ${jack?`<p class="hint" style="margin-top:8px">${t('Alles beim ersten Stopp getroffen.')}</p>`:''}${resultNote(win)}
      <button class="btn primary block" id="nx" style="margin-top:12px">${t('Weiter')}</button>`;
    if(root){root.dataset.end=win?'win':'lose';root.dataset.lk=String(R.locked);}
    R.tossAt=Date.now()+(win?1200:700);
    if(cab){
      $('#exfb').innerHTML=`<p class="rl-swipe" role="status">← ${t('Wische den Automaten nach links.')}</p>`;
      cab.setAttribute('role','button');cab.setAttribute('tabindex','0');cab.setAttribute('aria-label',t('Automaten wegwerfen'));
    }else R.showResult();
  }
  R.showResult=()=>{
    $('#exfb').innerHTML=R.resultHtml;
    $('#nx').onclick=nextStep;
    try{$('#nx').focus({preventScroll:true});}catch(e){}
  };
  /* Zum Schluss fliegt der Automat nach links vom Tisch, dann erscheinen Ergebnis und „Weiter“ */
  R.toss=instant=>{
    if(R.tossed||R.state!=='over'||!cab)return;
    R.tossed=true;
    const done=()=>{cab.style.display='none';if(root)root.classList.add('done');say('reels_toss');R.showResult();};
    if(instant||reduceMotion()){done();return;}
    sfx('tossed');haptic([20,70,60]);
    cab.style.transition='transform .38s cubic-bezier(.5,0,.85,.5)';
    cab.style.transform='translate(-150%,50px) rotate(-26deg)';
    setTimeout(done,400);
  };

  /* Ein Versuch für Walze i mit Wort k (von Hand oder Liste) */
  function attempt(i,k){
    const r=R.reels[i];
    if(R.state!=='spin'&&!list)return;
    if(R.state==='over'||r.st==='ok')return;
    if(k===r.right){
      r.st='ok';R.locked++;if(root)root.dataset.lk=String(R.locked);
      const e=el(i);if(e){e.classList.remove('no');e.classList.add('ok');}
      const pk=$$('.rl-pick',sheet)[i];if(pk){pk.classList.add('ok');$$('.opt',pk).forEach((b,x)=>{b.disabled=true;if(x===k)b.classList.add('ok');});}
      sfx('rwin');haptic([22]);
      if(R.locked===3)finish(true);
      else{say('reels_ok');const nx=R.reels.find(x=>x.st==='fast');if(nx)nx.st='slow';}
    }else{
      R.miss++;r.st='no';
      const e=el(i);if(e){e.classList.add('no');}
      const pk=$$('.rl-pick',sheet)[i];if(pk){const b=$$('.opt',pk)[k];if(b){b.classList.add('no');b.disabled=true;}}
      sfx('rbad');haptic([40,30,40]);
      if(R.miss>=R.tries)finish(false);
      else{say('reels_bad');if(!list)r.t=0;else r.st='fast';}
    }
  }

  function stop(i){
    const r=R.reels[i];
    if(R.state!=='spin'||r.st!=='slow')return;
    r.st='snap';r.t=0;r.p0=r.p;r.tgt=Math.round(r.p+r.v*.07);
    sfx('thunk');haptic([8]);
  }

  R.frame=dt=>{
    if(R.state==='over')return;
    R.reels.forEach((r,i)=>{
      if(r.st==='fast'||r.st==='slow'){
        const tg=r.st==='fast'?RL_FAST:RL_SLOW;r.v+=(tg-r.v)*Math.min(1,dt*4);r.p+=r.v*dt;
      }else if(r.st==='snap'){
        r.t+=dt;const k=Math.min(1,r.t/.24);r.p=r.p0+(r.tgt-r.p0)*rlEase(k);
        if(k>=1){r.p=r.tgt;r.st='idle';attempt(i,rlMod(r.tgt,r.words.length));}
      }else if(r.st==='no'){
        r.t+=dt;
        if(r.t>=.6&&R.state==='spin'){r.st='slow';r.v=RL_SLOW*2;r.p=Math.random()*r.words.length;const e=el(i);if(e)e.classList.remove('no');}
      }
    });
    paintAll();
  };
  R.stop=stop;
  R.stopNext=()=>{const i=curIdx();if(i>=0&&R.state==='spin')stop(i);};   // immer die linkeste noch offene Walze
  R.pull=()=>{
    if(R.state!=='idle')return;
    R.state='spin';
    const f=R.reels.findIndex(r=>r.st==='fast');if(f>=0)R.reels[f].st='slow';
    if(cab)cab.dataset.st='spin';if(sign)sign.textContent='TAP!';
    paintAll();
    sfx('lever');sfx('whirr',320);haptic([14]);
    const knob=$('#knob');if(knob){knob.classList.add('pulled');knob.style.setProperty('--ly','74px');setTimeout(()=>knob.style.setProperty('--ly','0px'),170);setTimeout(()=>knob.classList.remove('pulled'),600);}
  };

  if(list){
    R.state='spin';
    $$('.rl-pick',sheet).forEach((pk,i)=>$$('.opt',pk).forEach(b=>b.onclick=()=>attempt(i,+b.dataset.k)));
    return;
  }
  paintAll();
  /* Ganzer Automat: Tippen irgendwo stoppt die nächste Walze (links nach rechts). Der Hebel hat seine eigene Bedienung. */
  let sw=null;
  cab.addEventListener('pointerdown',ev=>{
    if(R.state==='over'){
      if(R.tossed||Date.now()<R.tossAt)return;
      sw={x:ev.clientX,dx:0};try{cab.setPointerCapture(ev.pointerId);}catch(e){}cab.style.transition='none';return;
    }
    if(ev.target.closest('#knob'))return;ev.preventDefault();R.stopNext();
  });
  cab.addEventListener('pointermove',ev=>{
    if(!sw)return;sw.dx=Math.min(0,ev.clientX-sw.x);
    cab.style.transform=`translateX(${sw.dx}px) rotate(${(sw.dx/14).toFixed(1)}deg)`;
  });
  const swEnd=()=>{
    if(!sw)return;const dx=sw.dx;sw=null;
    if(dx<-70){cab.style.transition='';cab.style.transform=`translateX(${dx}px) rotate(${(dx/14).toFixed(1)}deg)`;R.toss();}
    else{cab.style.transition='transform .3s cubic-bezier(.3,1.5,.5,1)';cab.style.transform='';}
  };
  cab.addEventListener('pointerup',swEnd);cab.addEventListener('pointercancel',swEnd);
  cab.addEventListener('keydown',ev=>{if(R.state==='over'&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();if(Date.now()>=R.tossAt)R.toss();}});
  const wn=$('#win');wn.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();R.stopNext();}});
  wn.addEventListener('click',ev=>{if(ev.detail===0)R.stopNext();});   // Tastatur / Hilfsmittel
  /* Hebel: ziehen oder antippen */
  const knob=$('#knob');let drag=null;
  const setY=y=>knob.style.setProperty('--ly',y+'px');
  knob.addEventListener('pointerdown',ev=>{ev.preventDefault();if(R.state!=='idle')return;drag={y:ev.clientY};try{knob.setPointerCapture(ev.pointerId);}catch(e){}knob.classList.add('drag');});
  knob.addEventListener('pointermove',ev=>{if(!drag)return;const y=Math.max(0,Math.min(74,ev.clientY-drag.y));setY(y);if(y>=60&&R.state==='idle'){drag=null;knob.classList.remove('drag');setY(0);R.pull();}});
  const end=()=>{if(!drag)return;const moved=parseFloat(knob.style.getPropertyValue('--ly'))||0;drag=null;knob.classList.remove('drag');setY(0);if(R.state==='idle'&&moved<20)R.pull();};
  knob.addEventListener('pointerup',end);knob.addEventListener('pointercancel',()=>{drag=null;knob.classList.remove('drag');setY(0);});
  knob.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();R.pull();}});
  let last=0;
  const loop=ts=>{
    if(!alive()||R.state==='over'&&R.done)return;
    const dt=last?Math.min(.05,(ts-last)/1000):0;last=ts;
    R.frame(dt);
    if(R.state==='over'){R.done=true;return;}
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

/* ===== modules/slots.js ===== */
/* ===== Modul Slots (Version 155): goldener Spielautomat mit Symbolen =====
   Statt Wörtern drehen die Walzen Bilder: Zahlen 0–10 und Früchte. Wo die Walzen stoppen, steht schon vorher fest
   (der „Zufall“ ist Show). Danach nennt man für jedes Symbol das Wort in der Lernsprache (Auswahl aus zwei Knöpfen).
   - Kommt nur, wenn das aktuelle Wort ein Symbol hat. Es zählt für die Stufen wie jedes Modul.
   - 1 bekanntes Symbolwort: alle drei Walzen gleich (erzwungen, kein Bonus, keine Jackpot-Show).
     2 bekannte: zwei gleiche und ein anderes. Ab 3: echter Zufall, das aktuelle Wort ist immer dabei.
   - Drei gleiche Symbole: nur eine Frage. Echter Dreier (ab 3 bekannten) = Jackpot-Show.
   - Alle richtig: im Survival doppelte Punkte (nicht beim erzwungenen Dreier).
   - Falsche Antwort-Option: ein Wort, das man schon kennt (bevorzugt ein anderes Symbolwort).
   Das alte Modul Reels bleibt unverändert daneben bestehen. */

const SL_NUM=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const SL_FRUIT=['apple','banana','orange','lemon','mango','pineapple','watermelon','coconut'];
const SL_SYMS=SL_NUM.concat(SL_FRUIT);
const SL_CELL=80,SL_WIN=120;   // Höhe einer Symbolzelle und des Walzenfensters in px
const SL_STRIP=16;         // Zellen pro Walzenstreifen
const SL_OUT='#2a0c20';

/* Englische Bedeutung des Wortes: im Englischkurs steht sie im Wort selbst, sonst in w.en */
function slotKey(w){
  if(!w)return null;
  const e=String(state.lang==='en'?w.id:w.en).toLowerCase().trim();
  return SL_SYMS.indexOf(e)>=0?e:null;
}
const slKnown=w=>!!(state.progress[state.lang]||{})[w.k];

/* ---- Symbole: glänzend, Comic-Kontur, Früchte mit Diva-Gesicht ---- */
function slFace(cx,cy,s){
  s=s||1;const e=(x,m)=>`M${x-5*s} ${cy} q${5*s} ${4*s*m} ${10*s} 0`;
  const lash=(x,d)=>`M${x} ${cy} l${d*3*s} ${-3*s} M${x+d*2*s} ${cy+1.2*s} l${d*3.4*s} ${-2*s}`;
  return `<g class="face" fill="none" stroke="${SL_OUT}" stroke-width="${2.4*s}" stroke-linecap="round">
    <ellipse cx="${cx-14*s}" cy="${cy+7*s}" rx="${4.5*s}" ry="${2.6*s}" fill="#ff6fa6" stroke="none" opacity=".75"/>
    <ellipse cx="${cx+14*s}" cy="${cy+7*s}" rx="${4.5*s}" ry="${2.6*s}" fill="#ff6fa6" stroke="none" opacity=".75"/>
    <path d="${e(cx-9*s,1)} ${e(cx+9*s,1)}"/>
    <path d="${lash(cx-14*s,-1)} ${lash(cx+14*s,1)}" stroke-width="${1.8*s}"/>
    <path d="M${cx-4*s} ${cy+9*s} q${4*s} ${3.5*s} ${8*s} ${-1*s}"/></g>`;
}
const slSpark=(x,y,r)=>`<path d="M${x} ${y-r}Q${x+r*.18} ${y-r*.18} ${x+r} ${y}Q${x+r*.18} ${y+r*.18} ${x} ${y+r}Q${x-r*.18} ${y+r*.18} ${x-r} ${y}Q${x-r*.18} ${y-r*.18} ${x} ${y-r}Z" fill="#fff"/>`;
const slGloss=(x,y,rx,ry,rot)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#fff" opacity=".6" transform="rotate(${rot||-30} ${x} ${y})"/><circle cx="${x+rx*.9}" cy="${y+ry*1.6}" r="${Math.max(2,ry*.35)}" fill="#fff" opacity=".7"/>`;
function slGrad(id,stops,radial){
  const st=stops.map((c,i)=>`<stop offset="${Math.round(i/(stops.length-1)*100)}%" stop-color="${c}"/>`).join('');
  return radial?`<radialGradient id="${id}" cx="38%" cy="32%" r="75%">${st}</radialGradient>`:`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">${st}</linearGradient>`;
}

function slNumArt(k){
  const n=String(SL_NUM.indexOf(k)),fs=n.length>1?62:84,y=n.length>1?74:82,id='sl-n'+n;
  const txt=a=>`<text x="50" y="${y}" text-anchor="middle" font-size="${fs}" font-weight="900" style="font-family:var(--display)" ${a}>${n}</text>`;
  return `<defs>${slGrad(id,['#ff7a7a','#ff1f45','#a8062a'])}<clipPath id="${id}c">${txt('')}</clipPath></defs>
    ${txt(`fill="none" stroke="${SL_OUT}" stroke-width="15" stroke-linejoin="round"`)}
    ${txt('fill="none" stroke="#ffd34d" stroke-width="8" stroke-linejoin="round"')}
    ${txt(`fill="url(#${id})"`)}
    <rect x="0" y="0" width="100" height="${y-fs*.42}" fill="#fff" opacity=".38" clip-path="url(#${id}c)"/>
    ${slSpark(n.length>1?88:80,20,7)}`;
}
function slSvg(k){
  const body=SL_ART[k]?SL_ART[k]():slNumArt(k);
  return `<svg class="slsym" viewBox="0 0 100 100" aria-hidden="true">${body}</svg>`;
}

/* ---- Plan: welche Symbole landen wo, welche Fragen kommen ---- */
function slotsData(w){
  const L=curLang(),key=slotKey(w);if(!key)return null;
  const bySym={};bySym[key]=w;
  L.words.forEach(x=>{const k=slotKey(x);if(k&&!bySym[k]&&x.k!==w.k&&slKnown(x))bySym[k]=x;});
  const pool=Object.keys(bySym),n=pool.length;
  let reels;
  if(n===1)reels=[key,key,key];
  else if(n===2){const o=pool.find(k=>k!==key);reels=shuffle(Math.random()<.5?[key,key,o]:[key,o,o]);}
  else{reels=[0,1,2].map(()=>pool[Math.floor(Math.random()*n)]);reels[Math.floor(Math.random()*3)]=key;}
  if(window.__slReels)reels=window.__slReels.slice();   // nur für Tests
  const triple=reels[0]===reels[1]&&reels[1]===reels[2];
  const forced=triple&&n<3;
  /* Fragen: bei drei gleichen nur eine, sonst eine pro Walze */
  const qs=(triple?[0]:[0,1,2]).map(i=>{const sw=bySym[reels[i]];return {i,sym:reels[i],w:sw,right:sw.id,opts:shuffle([sw.id,slFoil(sw,bySym)])};});
  return {key,reels,triple,forced,qs,pool:pool.length};
}
/* falsche Option: ein bekanntes Wort, bevorzugt ein anderes Symbolwort, ähnliche Länge */
function slFoil(sw,bySym){
  const L=curLang(),me=normId(sw.id);
  const ok=x=>x.k!==sw.k&&normId(x.id)!==me&&slotKey(x)!==slotKey(sw);
  const syms=shuffle(Object.values(bySym).filter(ok));
  if(syms.length)return syms[0].id;
  const known=L.words.filter(x=>ok(x)&&slKnown(x));
  const near=known.sort((a,b)=>Math.abs(a.id.length-sw.id.length)-Math.abs(b.id.length-sw.id.length)+(Math.random()-.5)*4);
  if(near.length)return near[0].id;
  const any=shuffle(L.words.filter(ok));return any.length?any[0].id:'?';
}
function slSoon(f,ms){if(window.__introMs===0||reduceMotion())return f();setTimeout(f,ms);}

function showSlots(w){
  const c=S.cur,L=curLang(),D=slotsData(w),lc=L.code.toLowerCase();
  const tries=triesFor('slots');
  const Z={D,miss:0,q:0,state:'idle'};c.sl=Z;
  const strip=(tgt,i)=>{
    const cells=[];for(let k=0;k<SL_STRIP;k++)cells.push(SL_SYMS[Math.floor(Math.random()*SL_SYMS.length)]);
    cells[SL_STRIP-2]=tgt;   // hier bleibt die Walze stehen (mit einem Nachbarn darunter)
    cells[1]=SL_SYMS[(SL_SYMS.indexOf(tgt)+3+i)%SL_SYMS.length];
    return cells.map(k=>`<div class="slc">${slSvg(k)}</div>`).join('');
  };
  sheetBody(`<div class="smain slm">${kicker(c,'slots',toIdl())}${roundLives()}
    <div id="rlm" class="rl-m">${mascot('reels_ready',null,'sm')}</div>
    <div class="slstage">${helpBtn('slots')}
      <div class="slmach" id="slmach" data-st="idle">
        <div class="slcap l"></div>
        <div class="slbody"><div class="slwin">${D.reels.map((k,i)=>`<div class="slreel" data-i="${i}" aria-label="${t('Walze {0}',i+1)}"><div class="slstrip">${strip(k,i)}</div><span class="slword" lang="${lc}"></span></div>`).join('')}
          <i class="slarr l" aria-hidden="true"></i><i class="slarr r" aria-hidden="true"></i></div></div>
        <div class="slcap r"></div>
        <div class="sllev" id="sllev" role="button" tabindex="0" aria-label="${t('Hebel ziehen')}"><i class="slrod"></i><i class="slball"></i></div>
      </div>
    </div>
    <div id="slq" class="slq"><p class="slhint">${t('Zieh den Hebel.')}</p></div>
    <div id="exfb"></div></div>`);
  const mach=$('#slmach'),lev=$('#sllev'),reels=$$('.slreel',sheet);
  const say=k=>{const m=$('#rlm');if(m)m.innerHTML=mascot(k,null,'sm');};
  /* Startstellung: zweite Zelle sichtbar */
  const pos=k=>`translate3d(0,${-(k*SL_CELL)+(SL_WIN-SL_CELL)/2}px,0)`;
  reels.forEach(r=>{r.firstChild.style.transform=pos(1);});

  function pull(){
    if(Z.state!=='idle')return;Z.state='spin';
    mach.dataset.st='spin';lev.classList.add('pulled');setTimeout(()=>lev.classList.remove('pulled'),420);
    sfx('lever');sfx('whirr',200);haptic([14]);
    $('#slq').innerHTML='';
    const instant=window.__introMs===0||reduceMotion();
    reels.forEach((r,i)=>{
      const s=r.firstChild,dur=1.15+i*.45;
      if(!instant){s.style.transition=`transform ${dur}s cubic-bezier(.12,.62,.22,1.04)`;}
      s.style.transform=pos(SL_STRIP-2);
      slSoon(()=>{r.classList.add('stop');sfx('thunk');haptic([8]);},dur*1000);
    });
    slSoon(landed,(1.15+2*.45)*1000+180);
  }
  function landed(){
    if(Z.state!=='spin'||!$('#slq'))return;
    Z.state='ask';mach.dataset.st=D.triple&&!D.forced?'jack':'ask';
    if(D.triple&&!D.forced){sfx('jackpot');haptic([30,40,30,40,80]);burst(mach,30);say('reels_jackpot');}
    ask();
  }
  function ask(){
    const q=D.qs[Z.q];
    reels.forEach((r,i)=>r.classList.toggle('act',D.triple?true:i===q.i));
    $('#slq').innerHTML=`<p class="slhint">${D.triple?t('Alle drei: Wie heißt das?'):t('Wie heißt Symbol {0}?',q.i+1)}</p>
      <div class="opts two">${q.opts.map(o=>`<button class="iopt tgt" data-r="${o===q.right?1:0}" lang="${lc}">${esc(o)}</button>`).join('')}</div>`;
    $$('#slq .iopt',sheet).forEach(b=>b.onclick=()=>answer(b,b.dataset.r==='1'));
  }
  function answer(b,good){
    if(Z.state!=='ask')return;
    const q=D.qs[Z.q];
    if(!good){
      Z.miss++;b.classList.add('no');b.disabled=true;sfx('rbad');haptic([40,30,40]);
      if(Z.miss>=tries)return finish(false);
      say('reels_bad');return;
    }
    b.classList.add('ok');$$('#slq .iopt',sheet).forEach(x=>x.disabled=true);
    sfx('rwin');haptic([22]);
    (D.triple?reels:[reels[q.i]]).forEach(r=>{r.classList.add('ok');r.classList.remove('act');r.querySelector('.slword').textContent=q.right;});
    Z.q++;
    if(Z.q>=D.qs.length)return slSoon(()=>finish(true),260);
    say('reels_ok');slSoon(ask,320);
  }
  function finish(win){
    if(Z.state==='over')return;Z.state='over';
    c.ok=c.ok&&win;
    if(win&&S.kind==='survival'&&!D.forced)c.ptsMul=2;   // alle richtig: doppelte Punkte (nicht beim erzwungenen Dreier)
    settleCard();
    mach.dataset.st=win?(D.triple&&!D.forced?'jack':'win'):'lose';
    /* nicht beantwortete Symbole aufdecken */
    D.qs.forEach(q=>(D.triple?reels:[reels[q.i]]).forEach(r=>{const s=r.querySelector('.slword');if(!s.textContent){s.textContent=q.right;r.classList.add('rev');}}));
    reels.forEach(r=>r.classList.remove('act'));
    if(win){chipRain(D.triple&&!D.forced?40:24);sfx('chips');haptic([20,30,20]);say(D.triple&&!D.forced?'reels_jackpot':'reels_win');}
    else{sfx('end_bad');say('reels_lose');}
    const words=D.reels.map(k=>D.qs.find(q=>q.sym===k).right);
    $('#slq').innerHTML='';
    $('#exfb').innerHTML=`<div class="res ${win?'good':'bad'}" role="status"><div class="rl">${win?(D.triple&&!D.forced?t('Jackpot!'):t('Richtig')):t('Nicht ganz')}</div>
      <div class="pair" lang="${lc}">${words.map(esc).join(' · ')}</div>
      ${win&&c.ptsMul===2?`<p class="hint" style="margin-top:6px">${t('Alle richtig: doppelte Punkte!')}</p>`:''}</div>${resultNote(win)}
      <button class="btn primary block" id="nx" style="margin-top:12px">${t('Weiter')}</button>`;
    $('#nx').onclick=nextStep;
    try{$('#nx').focus({preventScroll:true});}catch(e){}
  }
  c.slPull=pull;
  /* Hebel: antippen oder nach unten ziehen */
  let dy=null;
  lev.addEventListener('pointerdown',e=>{e.preventDefault();if(Z.state!=='idle')return;dy=e.clientY;try{lev.setPointerCapture(e.pointerId);}catch(x){}});
  lev.addEventListener('pointermove',e=>{if(dy===null)return;if(e.clientY-dy>40){dy=null;pull();}});
  lev.addEventListener('pointerup',()=>{if(dy!==null){dy=null;pull();}});
  lev.addEventListener('pointercancel',()=>{dy=null;});
  lev.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pull();}});
  lev.addEventListener('click',e=>{if(e.detail===0)pull();});
  /* Tippen auf den Automaten zieht auch den Hebel */
  mach.addEventListener('click',e=>{if(!e.target.closest('#sllev'))pull();});
}

/* ===== modules/order.js ===== */
/* Modul Reihenfolge: Die Wörter eines Satzes liegen durcheinander und werden per Ziehen in die richtige Reihenfolge gebracht.
   Aufgabe: Übersetzung steht oben, der indonesische Satz wird sortiert. Sätze mit 4 bis 7 Wörtern, keine Stufen-Grenze.
   Noch nicht gelernte Wörter stehen fest an ihrer Stelle (dezent lila), das passende Wort der Übersetzung ist lila unterstrichen, die gelernte Vokabel gelb. Ein Versuch.
   Bedienung: Kachel ziehen, die anderen weichen live aus (Platzhalter wandert), beim Loslassen rastet sie ein. Pfeiltasten verschieben ebenfalls. */
/* Feintuning des Gefühls: Dauer des Ausweichens, Pause zwischen zwei Platzwechseln, Randzone (Anteil der Breite), die nicht auslöst */
const ORDER_GLIDE=.32,ORDER_COOLDOWN=230,ORDER_EDGE=.22;
const ORDER_MIN=4,ORDER_MAX=7,ORDER_MAX_GIVEN=2,ORDER_MIN_FREE=2;
/* Plan für ein Wort oder null. Noch nicht gelernte Wörter des Satzes werden geschenkt: Sie stehen fest an ihrer Stelle (dezent lila), und das passende
   Wort der Übersetzung wird markiert. Grenzen: höchstens 2 feste Steine, mindestens 2 zum Sortieren, 4 bis 7 Wörter. Keine Stufen-Grenze. */
function orderPair(w){
  const s=sentOf(w);
  const pair=s?{id:s.id,gl:s.plain}:{id:w.id,gl:glFirst(w)};
  const target=tilesOf(pair.id);
  if(target.length<ORDER_MIN||target.length>ORDER_MAX)return null;
  const known=knownTokens(w),given=new Set(),hl=new Set(),glT=tilesOf(pair.gl);
  const unk=window.__rlAll?[]:tokensOf(pair.id).filter(tk=>!isName(tk)&&!known.has(normId(tk)));
  for(const u of unk){
    const eq=blockEquiv(u,glT);if(!eq)return null;
    eq.forEach(i=>hl.add(i));
    target.forEach((tk,i)=>{if(normId(tk)===normId(u))given.add(i);});
  }
  if(given.size>ORDER_MAX_GIVEN||target.length-given.size<ORDER_MIN_FREE)return null;
  if(new Set(target.filter((tk,i)=>!given.has(i)).map(normId)).size<2)return null;
  return {id:pair.id,gl:pair.gl,given:Array.from(given),hl:Array.from(hl)};
}
/* Übersetzung mit markierten Wörtern (gleiche Zerlegung wie tokensOf) */
function orderGlHtml(pair,w){
  const T=tilesOf(pair.id),g=new Set(pair.given),as=new Set();
  T.forEach((tk,i)=>{if(!g.has(i))as.add(i);});
  return glPrompt(w,pair.id,pair.gl,as,g);
}

function showOrder(pair){
  const c=S.cur,L=curLang(),lang=L.code.toLowerCase();
  const target=tilesOf(pair.id),want=target.map(normId),wantS=want.join('|'),given=new Set(pair.given),n=target.length;
  const freeIdx=target.map((tk,i)=>i).filter(i=>!given.has(i)),nFree=freeIdx.length;
  let order,guard=0;
  do{order=shuffle(freeIdx.slice());}while(nFree>2&&order.map(i=>want[i]).join('|')===freeIdx.map(i=>want[i]).join('|')&&++guard<30);
  let k=0,done=false,lives=triesFor('order'),drag=null;
  window.__lastOrder={target,order:order.slice(),given:pair.given.slice()};   // nur für Tests
  const cells=target.map((tk,pi)=>given.has(pi)?`<span class="tile given" data-i="${pi}">${esc(tk)}</span>`:`<button type="button" class="tile otile" data-i="${order[k++]}"><i class="grip" aria-hidden="true"></i>${esc(target[order[k-1]])}</button>`).join('');
  sheetBody(`<div class="smain">${kicker(c,'order')}${roundLives()}
    <div class="sentbox hq" lang="${state.ui}">${orderGlHtml(pair,c.w)}${helpBtn('order')}</div>
    <div class="ord" id="ord" lang="${lang}" aria-label="${t('Dein Satz')}">${cells}</div>
    <p class="hint ordhint">${t('Zieh die Kacheln in die richtige Reihenfolge.')}</p>
    <div id="exfb"></div>
    <button class="btn primary block" id="chk" disabled>${t('Prüfen')}</button></div>`);   // gesperrt, bis die erste Kachel verschoben wurde (kein Prüfen aus Reflex)
  const O=$('#ord'),chk=$('#chk');
  /* einmaliger Hinweis beim Erscheinen: die erste bewegliche Kachel wackelt kurz */
  const w0=$('.otile',O);if(w0){w0.classList.add('wig');w0.addEventListener('pointerdown',()=>w0.classList.remove('wig'),{once:true});}
  const touched=()=>{if(!done)chk.disabled=false;};
  const fixedAt={};$$('.given',O).forEach(e=>{fixedAt[+e.dataset.i]=e;});
  const cur=()=>Array.from(O.querySelectorAll('.otile'));
  const all=()=>Array.from(O.children).filter(e=>e.dataset.i!==undefined&&!e.classList.contains('oph'));
  const clearMarks=()=>{O.classList.remove('bad');cur().forEach(e=>e.classList.remove('bad','good'));if(!done)$('#exfb').innerHTML='';};
  const dragEl=()=>drag&&drag.moved?drag.el:null;
  /* freie Kacheln (plus Platzhalter) in Anzeigereihenfolge; die festen Steine bleiben immer an ihrer Position */
  const items=()=>Array.from(O.children).filter(x=>x!==dragEl()&&(x.classList.contains('otile')||x.classList.contains('oph')));
  function layout(list){
    const el=dragEl(),wantEls=[];let q=0;
    for(let pos=0;pos<n;pos++)wantEls.push(fixedAt[pos]||list[q++]);
    let cursor=O.firstChild;
    wantEls.forEach(e=>{
      while(cursor&&cursor===el)cursor=cursor.nextSibling;
      if(cursor===e)cursor=cursor.nextSibling;else O.insertBefore(e,cursor);
    });
  }
  /* Geschwister gleiten an ihren neuen Platz (FLIP), statt zu springen */
  function flip(mut){
    const els=Array.from(O.children).filter(x=>x!==dragEl()),before=els.map(e=>e.getBoundingClientRect());
    mut();
    els.forEach((e,i)=>{
      const b=e.getBoundingClientRect(),dx=before[i].left-b.left,dy=before[i].top-b.top;
      if(!dx&&!dy)return;
      e.style.transition='none';e.style.transform=`translate(${dx}px,${dy}px)`;e.getBoundingClientRect();
      e.style.transition='transform '+ORDER_GLIDE+'s cubic-bezier(.22,.8,.24,1)';e.style.transform='';
    });
  }
  function begin(e){
    const el=drag.el,r=el.getBoundingClientRect();
    const ph=document.createElement('span');ph.className='tile oph';ph.style.width=r.width+'px';ph.style.height=r.height+'px';ph.setAttribute('aria-hidden','true');
    O.insertBefore(ph,el);drag.ph=ph;drag.moved=true;
    el.classList.add('dragging');el.style.width=r.width+'px';el.style.height=r.height+'px';el.style.left='0px';el.style.top='0px';
    const o=el.getBoundingClientRect();drag.bx=o.left;drag.by=o.top;   // Bezug auch dann richtig, wenn ein Elternteil „fixed" verschiebt
    clearMarks();sfx('pop');haptic(8);
  }
  function place(px,py){
    const el=drag.el;
    el.style.left=(px-drag.dx-drag.bx)+'px';el.style.top=(py-drag.dy-drag.by)+'px';
    drag.px=px;drag.py=py;
    const now=Date.now(),wait=drag.last+ORDER_COOLDOWN-now;
    if(wait>0){   // Pause nach dem letzten Platzwechsel; danach wird die aktuelle Fingerposition noch einmal geprüft
      clearTimeout(drag.tm);drag.tm=setTimeout(()=>{if(drag&&drag.moved)shuffleTo(drag.px,drag.py);},wait+10);
      return;
    }
    shuffleTo(px,py);
  }
  function shuffleTo(px,py){
    const ph=drag.ph;
    const list=items(),sibs=list.filter(x=>x!==ph);
    const inside=(s,x,y)=>{const r=s.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;};
    const core=(s,x,y)=>{const r=s.getBoundingClientRect(),m=r.width*ORDER_EDGE;return x>=r.left+m&&x<=r.right-m&&y>=r.top&&y<=r.bottom;};   // Randzone löst nichts aus
    let ref=null,after=false;
    const hit=sibs.find(s=>core(s,px,py));
    if(hit){ref=hit;after=list.indexOf(ph)<list.indexOf(hit);}
    else{
      if(inside(ph,px,py)||sibs.some(s=>inside(s,px,py)))return;   // noch auf einer Kachel (Randzone): nichts tun
      let bd=1e9;
      sibs.forEach(s=>{const r=s.getBoundingClientRect(),d=Math.abs(py-(r.top+r.height/2))*3+Math.abs(px-(r.left+r.width/2));if(d<bd){bd=d;ref=s;after=px>r.left+r.width/2;}});
      // über einem festen Stein: Platzhalter nicht verschieben
      if(Object.values(fixedAt).some(f=>inside(f,px,py)))return;
    }
    if(!ref)return;
    const next=sibs.slice(),at=next.indexOf(ref)+(after?1:0);next.splice(at,0,ph);
    if(next.every((x,i)=>x===list[i]))return;
    drag.last=Date.now();
    flip(()=>layout(next));
    sfx('click');haptic(5);
  }
  function drop(){
    const d=drag;if(!d)return;drag=null;clearTimeout(d.tm);
    if(!d.moved)return;
    const r=d.ph.getBoundingClientRect();
    touched();
    d.el.style.transition='left .22s cubic-bezier(.22,.8,.24,1),top .22s cubic-bezier(.22,.8,.24,1),transform .22s ease';
    d.el.style.left=(r.left-d.bx)+'px';d.el.style.top=(r.top-d.by)+'px';d.el.classList.add('landing');
    const fin=()=>{
      if(!d.ph.parentNode)return;
      O.replaceChild(d.el,d.ph);
      d.el.classList.remove('dragging','landing');['left','top','width','height','transition','transform'].forEach(p=>d.el.style[p]='');
    };
    setTimeout(fin,230);sfx('pop');haptic(10);
  }
  O.addEventListener('pointerdown',e=>{
    const el=e.target.closest&&e.target.closest('.otile');
    if(!el||done||drag||(e.button&&e.button!==0))return;
    const r=el.getBoundingClientRect();
    drag={el,id:e.pointerId,dx:e.clientX-r.left,dy:e.clientY-r.top,sx:e.clientX,sy:e.clientY,moved:false,last:0,tm:0};
    try{el.setPointerCapture(e.pointerId);}catch(x){}
  });
  O.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id)return;
    if(!drag.moved){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<5)return;begin(e);}
    e.preventDefault();place(e.clientX,e.clientY);
  });
  ['pointerup','pointercancel'].forEach(n=>O.addEventListener(n,e=>{if(drag&&e.pointerId===drag.id)drop();}));
  O.addEventListener('contextmenu',e=>e.preventDefault());
  /* Tastatur: Pfeiltasten verschieben die fokussierte Kachel */
  O.addEventListener('keydown',e=>{
    const el=e.target.closest&&e.target.closest('.otile');
    if(!el||done||(e.key!=='ArrowLeft'&&e.key!=='ArrowRight'&&e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;
    e.preventDefault();clearMarks();
    const back=e.key==='ArrowLeft'||e.key==='ArrowUp',list=items(),i=list.indexOf(el),j=i+(back?-1:1);
    if(j<0||j>=list.length)return;
    const next=list.slice();next.splice(i,1);next.splice(j,0,el);
    flip(()=>layout(next));touched();
    try{el.focus({preventScroll:true});}catch(x){}
    sfx('click');
  });
  chk.onclick=()=>{
    if(done){nextStep();return;}
    if(drag||chk.disabled)return;
    const tiles=all(),ids=tiles.map(e=>want[+e.dataset.i]),good=ids.join('|')===wantS,els=tiles;
    if(!good){
      lives--;
      if(lives>0){
        els.forEach((e,p)=>{if(!e.classList.contains('given'))e.classList.toggle('bad',ids[p]!==want[p]);});
        $('#exfb').innerHTML=`<p class="fb bad" role="status">${t('Nicht ganz. Versuch es nochmal.')}</p>`;return;
      }
    }
    done=true;
    c.ok=c.ok&&good;settleCard();
    els.forEach((e,p)=>{if(e.classList.contains('given'))return;e.classList.remove('bad');e.classList.add(ids[p]===want[p]?'good':'bad');e.disabled=true;});
    O.classList.add(good?'good':'bad');
    $('.ordhint').hidden=true;
    $('#exfb').innerHTML=`<div class="res ${good?'good':'bad'}" role="status"><div class="rl">${good?t('Richtig'):t('Nicht ganz')}</div>
      <div class="pair" lang="${lang}">${esc(target.join(' '))}</div></div>${resultNote(good)}`;
    chk.textContent=t('Weiter');
    try{chk.focus({preventScroll:true});}catch(x){}
    if(good)burst($('.res'),18);
  };
}

/* ===== dewi-music.js ===== */
/**
 * dewi-music.js – Hintergrund-Loop "Indie" (früher "Holo-Aufstieg") für dewi.
 * ------------------------------------------------------------
 * Komposition & Sound: Claudio · Technik: reines Web Audio (keine Audiodateien, offline)
 *
 * Musik:   D-Moll, 112 BPM, 16 Takte (~34 s), läuft nahtlos endlos
 *          Teil A (Takt 1–8): Piano, Pad, Bass, Drums
 *          Teil B (Takt 9–16): + Melodie (Soft-Pulse, gedämpfter 8-Bit-Ton)
 *          Reels-Modul: zusätzlich Arpeggio (wird live ein-/ausgeblendet, kein Neustart)
 *
 * Öffentliche API (global: window.DewiMusic)
 *   DewiMusic.unlock(sharedCtx?)   beim ERSTEN Tippen des Nutzers aufrufen (iPhone-Audio-Regel).
 *                                  Optional einen vorhandenen AudioContext der Effekt-Sounds übergeben.
 *   DewiMusic.setEnabled(bool)     Musik an/aus (blendet weich), wird gespeichert
 *   DewiMusic.isEnabled()          -> bool (Standard: true)
 *   DewiMusic.setVolume(0..1)      Musik-Lautstärke (getrennt von Effekt-Sounds), wird gespeichert
 *   DewiMusic.getVolume()          -> 0..1 (Standard: 0.45)
 *   DewiMusic.setReelsMode(bool)   true beim Betreten des Reels-Moduls, false beim Verlassen
 *   DewiMusic.duck(seconds?)       optional: Musik kurz absenken (z. B. unter wichtigen Feedback-Sounds)
 *
 * Das Modul pausiert selbst, wenn die App in den Hintergrund geht, und läuft danach weiter.
 */
(function () {
  "use strict";

  // ---------- Einstellungen (localStorage, mit Fallback) ----------
  // Hinweis für Marlin: Falls dewi. bereits einen zentralen Einstellungs-Speicher hat,
  // load()/save() einfach darauf umbiegen.
  // Einbau in dewi. (Marlin, Okt. 2026): dewi. hat einen zentralen Speicher (state.music, state.mvol,
  // state.mtrack in music.js). Darum schreibt dieses Modul nichts mehr selbst in localStorage.
  // Schalter und Lautstärke setzt music.js bei jedem Takt über setEnabled()/setVolume().
  const KEY_ENABLED = "dewi.music.enabled";
  const KEY_VOLUME = "dewi.music.volume";
  function load(key, fallback) { return fallback; }
  function save(key, value) { /* bewusst leer: Speicher liegt in dewi.s state */ }

  let enabled = load(KEY_ENABLED, true);
  let volume = load(KEY_VOLUME, 0.45);
  let reels = false;

  // ---------- Musik-Daten (eigene Komposition) ----------
  const BPM = 112;
  const PROG = [
    { bass: 38, pad: [57, 62, 65, 69], arp: [62, 65, 69, 74] }, // Dm
    { bass: 34, pad: [58, 62, 65, 70], arp: [62, 65, 70, 74] }, // B
    { bass: 41, pad: [57, 60, 65, 69], arp: [60, 65, 69, 72] }, // F
    { bass: 36, pad: [55, 60, 64, 67], arp: [60, 64, 67, 72] }, // C
    { bass: 38, pad: [57, 62, 65, 69], arp: [62, 65, 69, 74] }, // Dm

    [[0, 76, 6], [6, 74, 2], [8, 72, 8]],
    [[0, 69, 4], [4, 74, 2], [6, 76, 2], [8, 77, 4], [12, 81, 4]],
    [[0, 79, 6], [6, 77, 2], [8, 74, 8]],

    const n = ctx.currentTime;
    master.gain.cancelScheduledValues(n);
    master.gain.setValueAtTime(master.gain.value, n);
    master.gain.linearRampToValueAtTime(value, n + seconds);
  }

  function start() {
    if (!ctx || running) return;
    running = true;
    if (ctx.state !== "running") ctx.resume();

    tick();

  }

  function stop() {
    if (!ctx || !running) return;
    running = false;
    fadeTo(0, 0.4);
    clearTimeout(timer); timer = null;
  }

  document.addEventListener("visibilitychange", () => {
    if (!ctx) return;
    if (document.hidden) {
      clearTimeout(timer); timer = null;
      ctx.suspend && ctx.suspend();
    } else if (running) {
      ctx.resume().then(() => { nextT = ctx.currentTime + 0.05; if (!timer) tick(); });
    }
  });

  // ---------- Öffentliche API ----------
  window.DewiMusic = {
    unlock(sharedCtx) {
      if (!ctx) build(sharedCtx);
      if (ctx.state !== "running") ctx.resume();
      if (enabled) start();
    },
    setEnabled(on) {
      enabled = !!on; save(KEY_ENABLED, enabled);

      enabled ? start() : stop();

    isEnabled() { return enabled; },
    setVolume(v) {

    getVolume() { return volume; },
    setReelsMode(on) {

      if (bus.arp) bus.arp.gain.setTargetAtTime(reels ? LV.arp : 0, ctx.currentTime, 0.3);

    duck(seconds = 0.8) {
      if (!ctx) return;
      const n = ctx.currentTime, g = duckGain.gain;
      g.cancelScheduledValues(n); g.setValueAtTime(g.value, n);
      g.linearRampToValueAtTime(0.5, n + 0.05);
      g.linearRampToValueAtTime(1, n + seconds);
    },
  };
})();

/* ===== Musik: zwei Loops, live per Web Audio erzeugt (keine Dateien) =====

  try{
    if(SND.ctx&&SND.ctx.state==='closed'){SND.ctx=null;SND.master=null;SND.mgain=null;SND.dgain=null;MUS.bus=null;MUS.mode=null;}   // iOS kann den Kontext beenden: neu aufbauen

      try{SND.ctx.onstatechange=()=>{if(SND.ctx&&SND.ctx.state!=='running'&&musicOn()&&SND.ctx.resume)SND.ctx.resume().catch(()=>{});};}catch(e){}

    if(SND.ctx.state!=='running'&&SND.ctx.resume){try{SND.ctx.resume().catch(()=>{});}catch(e){}}
    if(!SND.mgain){SND.mgain=SND.ctx.createGain();SND.mgain.connect(SND.ctx.destination);}
    SND.mgain.gain.value=Math.min(1,Math.max(0,(+state.mvol||0)/100))*.6;

  if(i%4===0){tone(c,150,at,.2,{v:.3,to:40,dest:o});noise(c,at,.03,.05,2000,{dest:o});}

  if(i%8===0)tone(c,mtof(rt),at,.2,{type:'square',v:.07,dest:o});
  if(i%8===4)tone(c,mtof(rt+7),at,.16,{type:'triangle',v:.12,dest:o});
  if(L>=2&&i%8===6)tone(c,mtof(rt+12),at,.1,{type:'square',v:.04,dest:o});

    if(i%2===0){const n=ch[[0,1,2,1][(i>>1)%4]]+24;tone(c,mtof(n),at,.2,{v:.022,dest:o});}
  }
  if(L>=2){
    const n=AR_ME[bar][i>>1];
    if(i%2===0&&n){

      tone(c,mtof(n)*3.01,at,.12,{v:.012,dest:o});

    const old=MUS.bus,now=c.currentTime;
    try{old.gain.cancelScheduledValues(now);old.gain.setValueAtTime(Math.max(.0001,old.gain.value),now);old.gain.linearRampToValueAtTime(0.0001,now+.6);}catch(e){}
    setTimeout(()=>{try{old.disconnect();}catch(e){}},900);
  }
  MUS.bus=null;MUS.mode=want;MUS.step=0;
  if(!want||!c)return;
  const b=c.createGain(),now=c.currentTime;b.gain.value=.0001;
  try{b.gain.setValueAtTime(.0001,now);b.gain.linearRampToValueAtTime(1,now+.8);}catch(e){b.gain.value=1;}
  b.connect(SND.mgain);MUS.bus=b;MUS.next=now+.1;MUS.duck=1;MUS.since=now;
}
function musTick(){
  const on=musicOn()&&!document.hidden,holo=holoWant();
  let want=null;
  if(on&&!holo)want=document.querySelector('.smain.rl')?'synth':(state.mtrack==='arcade'?'arcade':'lofi');
  if(holo)holoRun();else if(HOLO.on)holoStop();
  if(holo&&HOLO.failed&&on)want=document.querySelector('.smain.rl')?'synth':'lofi';   // Holo ist ausgefallen: sofort Lo-Fi statt Stille
  if(want&&!SND.ctx&&!musCtx())want=null;
  if(want&&SND.ctx&&SND.ctx.state!=='running'){try{SND.ctx.resume().catch(()=>{});}catch(e){}}
  if(want!==MUS.mode)musSwitch(want);
  if(!MUS.mode||!SND.ctx||!MUS.bus)return;
  const c=SND.ctx;
  try{SND.mgain.gain.value=Math.min(1,Math.max(0,(+state.mvol||0)/100))*.6;}catch(e){}
  let L=0,duck=1;
  if(MUS.mode==='synth'){
    const rt=document.querySelector('.smain.rl');
    if(rt){
      L=Math.min(3,+rt.dataset.lk||0);
      if(document.querySelector('.reel.no'))duck=.3;
      if(rt.dataset.end==='lose'){L=0;duck=.25;}
    }
  }
  if(window.__gover&&Date.now()-window.__gover<4000)duck=.2;
  /* Pegel nur bei Änderung setzen (sonst häuft sich alle 90 ms ein Automations-Ereignis an und überschreibt das Einblenden) */
  if(MUS.mode==='arcade'){   // Intensität: Survival mit Serie und wenig Leben wird dichter, sonst mittlere Stufe
    L=1;
    try{if(S&&S.kind==='survival'){L=1+((S.run||0)>=4?1:0)+((S.run||0)>=10?1:0)+(S.lives===1?1:0);}}catch(e){}
    L=Math.min(3,L);
  }
  try{if(c.currentTime-(MUS.since||0)>1&&MUS.duck!==duck&&MUS.bus.gain.setTargetAtTime){MUS.bus.gain.cancelScheduledValues(c.currentTime);MUS.bus.gain.setTargetAtTime(duck,c.currentTime,.06);MUS.duck=duck;}}catch(e){}
  if(c.state!=='running')return;   // nichts einplanen, solange iOS den Ton angehalten hat (sonst läuft der Takt beim Weiterspielen durcheinander)
  if(MUS.next<c.currentTime-.5)MUS.next=c.currentTime+.05;
  const sd=stepDur(MUS.mode);let guard=0;
  while(MUS.next<c.currentTime+.3&&guard++<12){
    const at=MUS.next-c.currentTime;
    if(MUS.mode==='lofi')lofiStep(c,MUS.step,at,MUS.bus);else if(MUS.mode==='arcade')arcadeStep(c,MUS.step,at,MUS.bus,L);else synthStep(c,MUS.step,at,MUS.bus,L);
    MUS.step++;MUS.next+=sd;
  }
}
function musIcon(){
  const on=musicOn();
  return `<button class="iconbtn sm musbtn" aria-pressed="${on}" aria-label="${t('Musik')}"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9v6h4l5 4V5L8 9z"/><path class="wv" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="mt" d="M16 9l5 6M21 9l-5 6"/></svg></button>`;
}
/* gewählter Soundtrack: lofi (Standard), arcade oder holo */
const trackOf=()=>state.mtrack==='arcade'||state.mtrack==='holo'?state.mtrack:'lofi';
function musRefresh(){
  $$('.musbtn').forEach(b=>b.setAttribute('aria-pressed',String(musicOn())));
  $$('[data-trk]').forEach(b=>b.setAttribute('aria-checked',String(trackOf()===b.dataset.trk)));
  $$('#mvol').forEach(mv=>{const v=state.music===true?(+state.mvol||0):0;if(+mv.value!==v)mv.value=v;});   // Version 151: Regler statt An/Aus, die Soundtrack-Wahl bleibt immer sichtbar
}
function musSet(on){
  state.music=!!on;save();
  if(state.music&&!(+state.mvol>0))state.mvol=35;
  if(state.music)musCtx();
  musRefresh();musTick();
}
try{
  document.addEventListener('click',e=>{const b=e.target&&e.target.closest&&e.target.closest('.musbtn');if(b){musSet(!musicOn());if(musicOn())sfx('pop');}});
  // Nach dem Neuladen darf iOS erst nach der ersten Berührung Ton abspielen
  const wake=()=>{if(musicOn()){musCtx();musTick();}};
  document.addEventListener('pointerdown',wake,{capture:true,passive:true});
  document.addEventListener('visibilitychange',musTick);
  window.addEventListener('pageshow',wake);window.addEventListener('focus',wake);
  MUS.timer=setInterval(musTick,90);
}catch(e){}
window.MUS=MUS;

/* ---- Satz-Übung ---- */
const PROPER_EXTRA='Tom Anna Paul Emma Sam Lisa Mark Peter London Paris Spain France Italy England American British Europe Indonesia Bali Jakarta Germany Berlin Bandung Medan Vito Dewi Rina Indonesian English Independence Day Monday Tuesday Wednesday Thursday Friday Saturday Sunday January February March April May June July August September October November December Indonesien Deutschland Montag Dienstag Mittwoch Donnerstag Freitag Samstag Sonntag Januar Februar März Juni Juli Oktober Dezember'.split(' ');
/* Kulanz bei der Rechtschreibung: erlaubte Tippfehler = Länge / Teiler, Teiler je Stufe. Stufe 5 ist exakt. */
const TYPO_DIV=[4,4,6,9,14,Infinity];
chipSprite();
applyTheme(equipOf('theme'));   // Version 138: gekauftes Theme
/* Version 153: Leistungsanzeige (Testbereich). Zeigt Bilder pro Sekunde, das schlechteste Bild der letzten 5 Sekunden,
   wie viele Animationen laufen und welche am häufigsten. So sehen wir auf dem iPhone, wo es heiß wird. */
let perfEl=null,perfRaf=0;
function perfSet(on){
  if(!on){if(perfRaf)cancelAnimationFrame(perfRaf);perfRaf=0;if(perfEl){perfEl.remove();perfEl=null;}return;}
  if(perfEl||typeof requestAnimationFrame!=='function')return;
  perfEl=document.createElement('div');perfEl.id='perf';perfEl.setAttribute('aria-hidden','true');document.body.appendChild(perfEl);
  let last=0,frames=0,t0=0,worst=[],slow=0;
  const loop=ts=>{
    if(!perfEl)return;
    if(last){const d=ts-last;if(d>34)slow++;worst.push(d);if(worst.length>300)worst.shift();}
    last=ts;frames++;
    if(!t0)t0=ts;
    if(ts-t0>=1000){
      const fps=Math.round(frames*1000/(ts-t0));let an=[],names={};
      try{an=document.getAnimations();an.forEach(a=>{const n=a.animationName||a.transitionProperty||'js';names[n]=(names[n]||0)+1;});}catch(e){}
      const top=Object.entries(names).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]+'×'+x[1]).join(' ');
      const w=Math.round(Math.max.apply(null,worst.concat([0])));
      perfEl.textContent=fps+' fps · max '+w+' ms · lahm '+slow+' · Anim '+an.length+(top?'\n'+top:'');
      frames=0;t0=ts;slow=0;
    }
    perfRaf=requestAnimationFrame(loop);
  };
  perfRaf=requestAnimationFrame(loop);
}
perfSet(!!state.perf);

render();
if(window.__test)window.__run=c=>eval(c);   // Prüfstand: nur wenn die Testumgebung es einschaltet
})();
