function homeMascot(p,st,nFallen,doneToday,prog){
  const any=Object.keys(prog).length>0,total=(p.fresh?1:0)+p.review.length;
  let k;
  if(lateHand())k='home_late';   // Version 135: ab 21 Uhr bei offener Hand
  else if(!any)k='home_new';
  else if(st===0&&!doneToday)k='home_sleep';
  else if(nFallen>=4)k='home_fallen';
  else if(st>=7)k='home_streak';
  else if(doneToday||total===0)k='home_done';
  else k='home_due';
  return mascot(k,{n:nFallen,s:st},'');
}

/* Version 151: Die Fortschrittsleiste ist immer voll und zeigt, wie sich die begonnenen Wörter auf die Stufen verteilen.
   Vorher war sie anteilig zu allen Wörtern gefüllt, der Regenbogen war erst ganz am Ende zu sehen. */
function progParts(L,prog){
  const lv=[0,0,0,0,0,0];let nNew=0;
  L.words.forEach(w=>{const q=prog[w.k];if(!q)nNew++;else lv[q.l]++;});
  const N=L.words.length,Ns=N-nNew;
  const parts=[5,4,3,2,1,0].map(n=>({c:LVCOL[n],n:lv[n],l:t('Stufe {0}',n)}));
  const seg=Ns?parts.filter(p=>p.n>0).map(p=>`<i style="width:${(p.n/Ns*100).toFixed(2)}%;background:${p.c}"></i>`).join(''):'';
  const bar=`<div class="stack" role="img" aria-label="${parts.map(p=>p.n+' '+p.l).join(', ')}">${seg}</div>`;
  return {parts,nNew,N,Ns,bar};
}

function renderList(){
  const L=curLang(),t0=today(),prog=state.progress[L.id]||{};
  const groups=L.cats.map(()=>[]);
  L.words.forEach(w=>{
    const pr=prog[w.k];
    if(bookF==='due'&&!(pr&&pr.d<=t0))return;
    if(bookF==='learned'&&!(pr&&pr.l>=1))return;
    if(bookF==='new'&&pr)return;
    if(bookF==='shaky'&&!isShaky(pr))return;
    if(bookQ&&!(fold(w.id).includes(bookQ)||fold(w.en).includes(bookQ)||fold(w.de).includes(bookQ)))return;
    groups[w.cat].push(w);
  });
  const force=!!bookQ||bookF!=='all';
  let html='';
  groups.forEach((items,ci)=>{
    if(!items.length)return;
    const learned=L.words.filter(w=>w.cat===ci&&prog[w.k]&&prog[w.k].l>=1).length;
    html+=`<details class="cat" style="--cc:${CATCOL[ci%CATCOL.length]}" data-c="${ci}"${force||openCats.has(String(ci))?' open':''}><summary>${esc(t(L.cats[ci][0]))}<span class="cnt">${force?items.length+' '+t('Treffer'):learned+' / '+L.catCount[ci]}</span></summary><ul class="rows">${items.map(w=>{

    }).join('')}</ul></details>`;
  });
  $('#vlist').innerHTML=html||'<div class="empty">'+t('Nichts gefunden.')+'</div>';
}

      if(!o||o.app!=='kata'||!o.data||typeof o.data.progress!=='object')throw new Error('x');

    }catch(e){$('#flash2',root).style.color='var(--bad)';$('#flash2',root).textContent=t('Das ist keine gültige Sicherung.');render_keep();}
  });
  $('#perftog',root).onclick=e=>{state.perf=!state.perf;save();perfSet(state.perf);e.currentTarget.textContent=state.perf?t('An'):t('Aus');e.currentTarget.setAttribute('aria-pressed',String(!!state.perf));};
  $('#devwordsf',root).onsubmit=e=>{e.preventDefault();devSetWords(+$('#devwords',root).value||0);$('#devwords',root).value='';};
  $('#devwordsreset',root).onclick=()=>{state.progress[curLang().id]={};save();render();};
  $('#devchipsf',root).onsubmit=e=>{e.preventDefault();devSetChips(+$('#devchips',root).value||0);$('#devchips',root).value='';};
  $('#devchipsreset',root).onclick=()=>{state.chips=0;state.chipShown=0;save();render();};
  $('#chlang2',root).onclick=()=>{endRoundIfOpen();closeOv();state.lang=null;save();render();};
  $('#skip',root).onclick=()=>{state.dayOffset=(state.dayOffset||0)+1;save();render();};
  $('#unskip',root).onclick=()=>{state.dayOffset=0;save();render();};
  twoStep($('#reset',root),t('Wirklich alles löschen? Nochmal tippen'),()=>{endRoundIfOpen();closeOv();state=defaults();migrate();save();view='home';render();});
}

/* ===== modules/_registry.js ===== */
/* ===== Modul-Register =====
   Begriffe (siehe ENTWICKLUNG.md, „Begriffe“):
   - MODUL      eine Übungsart, die EIN Wort abfragt: Bausteine, Tippen, Swipe, Lückensatz, Auswahl
                (plus das Kennenlernen als reines Vorstell-Modul ohne Wertung).
   - KARTE      ein Wort in einem Modul.
   - PLAYMODE   legt fest, welche Module eine Round einsetzt: Random (gemischt, nach Stufe) oder Solo (ein Modul).
   - ROUND      eine komplette Abfrage vom Start bis zum Ergebnis: Daily Round (Pflicht des Tages)
                oder Survival (freiwillig, alle begonnenen Wörter, 3 Leben).

   Jedes Modul liegt in einer eigenen Datei unter modules/ und meldet sich mit registerModule an:
     id        kurze Kennung (blocks, typing, swipe, gap, choice, intro)
     name()    Anzeigename
     desc()    Kurzbeschreibung für die Kachel
     tone      Farbklasse der Kachel (t1 … t5)
     icon      SVG der Kachel
     solo      true = im Playmode Solo wählbar
     isNew     true = bekommt die „NEU“-Marke
     can(w)    kann das Modul dieses Wort abfragen? (z. B. braucht Lückensatz einen Beispielsatz)
     fallback  Modul-Kennung, falls can(w) false ist
     show(w)   zeigt die Karte (liest die laufende Round aus S.cur) */
const MODULES=[],MOD={};
function registerModule(m){MODULES.push(m);MOD[m.id]=m;}
function resolveModule(id,w){let m=MOD[id],g=0;while(m&&m.can&&!m.can(w)&&m.fallback&&g++<5)m=MOD[m.fallback];return m?m.id:id;}

function chipAdd(n){n=Math.max(0,Math.round(n)||0);if(!n)return 0;state.chips=(state.chips|0)+n;save();return n;}
/* Survival: 5 Chips pro geschafftem Wort, höchstens 300 pro Tag. Kein Rekord-Bonus (sonst: Rekord um 1 knacken und aussteigen). */
function chipSurvival(words){
  const t0=today(),g=state.chipSurv&&state.chipSurv.d===t0?state.chipSurv:(state.chipSurv={d:t0,n:0});
  const n=Math.max(0,Math.min(Math.max(0,words|0)*CHIPV.survWord,CHIPV.survCap-g.n));
  g.n+=n;return chipAdd(n);
}
/* Zahlen: volle Zahl mit Tausenderpunkt (Deutsch) bzw. -komma (Englisch) */
function fmtChip(n){return String(n|0).replace(/\B(?=(\d{3})+(?!\d))/g,state.ui==='de'?'.':',');}
/* Nur für die Pille: ab 10.000 mit K/M und einer Nachkommastelle (12,5K · 1,2M), abgerundet, damit nie mehr angezeigt wird als da ist */
function fmtChipShort(n){
  n=n|0;if(n<10000)return fmtChip(n);
  const dec=state.ui==='de'?',':'.';
  const [v,u]=n<1e6?[Math.floor(n/100)/10,'K']:[Math.floor(n/1e5)/10,'M'];
  return v.toFixed(1).replace('.',dec)+u;
}
function chipPill(id){

  if(!id)return `<button class="chippill" id="chippill" type="button" aria-label="${t('{0} Chips',fmtChip(state.chips|0))} · ${t('Shop öffnen')}">${inner}</button>`;   // Startscreen: öffnet den Shop (Version 138)

/* Startscreen: Chips fliegen in die Pille, die Zahl tickt hoch */
function chipFly(){
  const pill=$('#chippill');if(!pill)return;
  const from=state.chipShown|0,to=state.chips|0;
  if(to<=from){if(to<from){state.chipShown=to;save();}return;}
  state.chipShown=to;save();
  const num=$('b',pill);
  if(reduceMotion()||typeof requestAnimationFrame!=='function'||!document.body.animate){num.textContent=fmtChipShort(to);return;}
  const pr=pill.getBoundingClientRect(),tx=pr.left+16,ty=pr.top+pr.height/2;
  const src=$('.plan')||$('.mascot'),sr=src?src.getBoundingClientRect():{left:innerWidth/2-20,top:innerHeight/2,width:40,height:40};
  const cx=sr.left+sr.width/2,cy=Math.min(innerHeight*.6,sr.top+sr.height/2);
  const k=Math.min(12,Math.max(3,Math.ceil((to-from)/50)));let landed=0;
  sfx('chips',150);
  for(let i=0;i<k;i++){
    const el=document.createElement('div');el.className='chipfly';el.innerHTML=chipSvg('pink');
    const a=i/k*Math.PI*2,r=40+((i*37)%30);
    const sx=cx+Math.cos(a)*r,sy=cy+Math.sin(a)*r*.6;
    el.style.left=sx+'px';el.style.top=sy+'px';
    document.body.appendChild(el);
    const d=380+i*70;
    el.animate([
      {transform:'translate(-50%,-50%) scale(.2)',opacity:0},
      {transform:'translate(-50%,-50%) scale(1.15)',opacity:1,offset:.25},
      {transform:`translate(calc(-50% + ${tx-sx}px),calc(-50% + ${ty-sy}px)) scale(.55)`,opacity:.9}
    ],{duration:d+260,delay:i*55,easing:'cubic-bezier(.55,0,.75,.4)',fill:'forwards'}).onfinish=()=>{
      el.remove();landed++;
      const v=Math.round(from+(to-from)*landed/k);num.textContent=fmtChipShort(v);
      pill.classList.remove('bump');void pill.offsetWidth;pill.classList.add('bump');
      sfx('tick');
    };
  }
}
/* Chipregen über den ganzen Bildschirm (Reels-Gewinn, später Royal Flush) */

/* ===== poker.js ===== */
/* ===== Poker: die Daily Round als Pokerhand (Version 133) =====
   Grundlage: konzept-poker-shop.md (Nova), Abschnitte 2 und 3. Alles Rechnen steht hier, die Anzeige in rounds.js
   und in pokerui.js (die gestalteten Poker-Screens, ab Version 134).

   BLINDS     Vor jeder Hand wählt man Small (100) oder Big (300).
              Erste Daily Round des Tages: den Small Blind zahlt Dewi, der Big Blind ist freiwillig und kostet den vollen Betrag.
              „Noch eine Runde“: beide zahlt man selbst. Reicht das Konto nicht für den Small Blind, zahlt Dewi ihn
              höchstens einmal pro Tag (Rettung, daily().rescue). Danach: Hand ohne Einsatz (Auszahlung 0, Lernen geht immer).
              Der eigene Einsatz wird beim Start abgebucht.
   HAND       Alle gewerteten Module der Round (Review-Wörter + neues Wort am Ende). Das Kennenlernen zählt nicht.
   MULTIPLIKATOR  startet bei ×0, jedes geschaffte Modul +1. Verlorenes Modul: Small bleibt stehen, Big −1 (nie unter 0).
   ROYAL FLUSH    alle Module der Hand geschafft → Multiplikator am Ende verdoppelt (auch bei kleinen Händen).
   AUSZAHLUNG nur am Ende: (Einsatz + Serien-Bonus) × Multiplikator (× 2 bei Royal Flush). Den Bonus zahlt das Haus.
   SERIEN-BONUS   nach der Serie vor der Hand (was die Flamme bei der Blind-Wahl zeigt): 7 +10 %, 14 +20 %, 30 +30 %,
              50 +40 %, 100 +50 %, 365 +100 % (Obergrenze). Gilt auch, wenn Dewi zahlt.
   VERFALLEN  Eine pausierte Daily-Hand verfällt um Mitternacht samt Einsatz (openRun). Eine Hand, die gerade
              auf dem Bildschirm läuft, darf über Mitternacht zu Ende gespielt werden. Survival ist nicht betroffen. */
const BLINDS={small:100,big:300};
const BONUS_STEPS=[[365,100],[100,50],[50,40],[30,30],[14,20],[7,10]];   // Serie ab … Tage → Bonus in Prozent
const STREAK_MILES=BONUS_STEPS.map(x=>x[0]).reverse();                     // Meilensteine = Bonus-Stufen: 7, 14, 30, 50, 100, 365
function bonusPct(st){for(const [d,p] of BONUS_STEPS)if(st>=d)return p;return 0;}

/* Was die Blind-Wahl anbietet. paid: wer den Small Blind zahlt ('dewi' | 'self' | 'rescue' | 'none' = ohne Einsatz) */
function blindOffer(){
  const first=!state.done[today()],acc=state.chips|0,st=streak();
  const paid=first?'dewi':acc>=BLINDS.small?'self':!daily().rescue?'rescue':'none';
  return {first,acc,st,pct:bonusPct(st),small:{paid,stake:paid==='none'?0:BLINDS.small},big:{stake:BLINDS.big,ok:acc>=BLINDS.big}};
}
/* Neue Hand anlegen und den eigenen Einsatz abbuchen. blind: 'small' | 'big' */
function handNew(blind){
  const o=blindOffer();
  let h;
  if(blind==='big'&&o.big.ok){h={blind:'big',stake:BLINDS.big,paid:'self'};state.chips=(state.chips|0)-BLINDS.big;}
  else{
    h={blind:'small',stake:o.small.stake,paid:o.small.paid};
    if(h.paid==='self')state.chips=(state.chips|0)-BLINDS.small;
    if(h.paid==='rescue')daily().rescue=true;
  }
  state.chipShown=Math.min(state.chipShown|0,state.chips|0);   // Pille zeigt den Abzug sofort, ohne Einflug
  h.st=o.st;h.pct=o.pct;h.bonus=Math.round(h.stake*h.pct/100);h.mult=0;h.done=0;h.lost=0;h.date=today();h.face=h.blind==='big'?'cash':'sly';
  save();
  return h;
}
/* Ein Modul der Hand ist gewertet. Gibt die Änderung des Multiplikators zurück (+1, −1 oder 0). */
function handSettle(h,ok){
  if(!h)return 0;
  h.done++;
  let d=0;
  if(ok){h.mult++;d=1;}
  else{h.lost++;if(h.blind==='big'&&h.mult>0){h.mult--;d=-1;}}
  /* Dewis Gesicht in der Dewi-Zone: Royal Flush noch drin = überlegen (ab ×4 Dollar-Augen), sonst überheblich; verloren = genervt */
  h.face=!ok?'annoyed':h.lost===0?(h.mult>=4?'cash':'superior'):'haughty';
  return d;
}
/* Abrechnung am Ende der Hand. Schreibt die Chips gut und gibt die Rechnung zurück. */
function handPayout(h){
  if(!h)return null;
  const rf=h.done>0&&h.lost===0,mult=h.mult*(rf?2:1);
  const payout=(h.stake+h.bonus)*mult;
  chipAdd(payout);
  return {stake:h.stake,bonus:h.bonus,pct:h.pct,mult:h.mult,rf,payout,paid:h.paid,blind:h.blind,net:payout-(h.paid==='self'?h.stake:0)};
}

window.__poker={bonusPct,blindOffer,handNew,handSettle,handPayout};

/* Verpasste Tage seit der letzten gespielten Daily Round (ohne heute), die noch nicht geschützt sind */
function missedSinceLast(){
  const t0=today(),y=addDays(t0,-1),sh=state.shielded||{};
  const days=Object.keys(state.done||{}).filter(d=>d<t0).sort();
  const last=days[days.length-1];if(!last)return null;
  const gap=[];for(let d=addDays(last,1);d<=y;d=addDays(d,1))if(!sh[d])gap.push(d);
  return {last,gap};
}
/* Beim Öffnen: Schutze einsetzen, wenn sie die ganze Lücke schließen. Merkt sich einen Hinweis für den Moment. */
function applyShields(){
  const m=missedSinceLast();if(!m||!m.gap.length)return 0;
  const have=state.shields|0;
  if(m.gap.length>have)return 0;   // reicht nicht: Serie ist ohnehin weg, Schutze bleiben im Vorrat
  const sh=state.shielded||(state.shielded={});
  m.gap.forEach(d=>{sh[d]=true;});
  state.shields=have-m.gap.length;
  state.shieldNote={n:m.gap.length,left:state.shields};
  save();
  return m.gap.length;
}

const ownsItem=it=>it.rar==='free'||(state.owned||[]).indexOf(it.id)>=0;

function applyTheme(id){try{const r=document.documentElement;if(id&&id!=='classic')r.dataset.theme=id;else delete r.dataset.theme;}catch(e){}}

function shopAct(act){
  const it=SHOP&&SHOP.sel;if(!it||!act)return;
  if(act==='buy'){
    const p=priceOf(it);if((state.chips|0)<p)return;
    state.chips=(state.chips|0)-p;state.chipShown=state.chips;

    else{state.owned=(state.owned||[]).concat([it.id]);state.equip=Object.assign({},state.equip,{[it.slot]:it.val});}

  }else if(act==='equip'){state.equip=Object.assign({},state.equip,{[it.slot]:it.val});sfx('lockin');haptic(15);}
  save();renderShop();
}

/* ===== rounds.js ===== */
/* ===== Rounds =====
   Eine ROUND ist eine komplette Abfrage vom Start bis zum Ergebnis. Es gibt zwei Arten:

   DAILY ROUND (kind 'daily'), immer Playmode Random, keine Leben:
     Stage 1  Einführung  das neue Wort (Modul intro, „Weiter“ erst nach ein paar Sekunden)
     Stage 2  Review      4 bekannte Wörter (Vorrang: fällige Wörter auf Stufe 0; dann überfällige und zufällige fällige,
                          aufgefüllt mit noch nicht fälligen), zum Schluss das neue Wort noch einmal (Tippen oder Bausteine).
     Pro Wort genau ein Modul, nie zweimal dasselbe Modul hintereinander. Fehlerrecht je Modul: siehe TRIES.
     Wird ein Modul verloren, fällt das Wort auf Stufe 0 und ist morgen fällig (Version 131, die Fehlerliste ist entfallen).

   SURVIVAL (kind 'survival', früher Freeplay), nur nach der Daily Round:
     Alle begonnenen Wörter (auch Stufe 0), jedes einmal, gemischt. 3 Leben insgesamt, pro Karte ein Versuch. Score mit Serienbonus,
     eigener Rekord je Playmode. Ein richtiges Wort steigt wie in der Daily Round eine Stufe (einmal pro Tag und Wort).

   S = Zustand der laufenden Round: items (Karten), i (aktuelle Karte), cur (aktuelle Karte mit Wort und Modul), kind, playmode … */
let S=null;

/* Versuche pro Modul (Daily Round): ein Fehler erlaubt = 2 Versuche, Tippen 2 Fehler = 3 Versuche, Swipe nur 1 Versuch.
   Im Survival hat jede Karte nur einen Versuch. */
const TRIES={swipe:1,typing:3,blocks:2,gap:2,choice:2,reels:2,slots:2,order:1};
const triesFor=id=>(S&&S.kind==='survival')?1:(TRIES[id]||2);
/* Version 123: Die Herzen stehen jetzt links in der Score-Zeile (siehe scoreRow), nicht mehr im Modul. */
const roundLives=()=>'';
/* Fortschritt zum nächsten Herz, 0 bis knapp 1 (nur solange ein Herz fehlt) */
const healProg=()=>(S&&S.kind==='survival'&&S.lives<HEART_MAX&&S.run>0)?(S.run%HEART_STREAK)/HEART_STREAK:0;
const HEART_STREAK=8,HEART_MAX=3;   // 8 richtige in Folge geben ein verlorenes Herz zurück, nie mehr als am Start
window.__introMs=(typeof window.__introMs==='number')?window.__introMs:3000;   // Sperre des „Weiter“ in der Einführung (Tests setzen 0)

/* Punkte pro richtigem Wort im Survival (intern und angezeigt gleich, z. B. 137):
   Grundpunkte je Modul (leichte weniger, schwere mehr), Perfekt-Bonus +25 % (ohne „?“, ohne Tippfehler),
   danach Serien-Multiplikator: ab 3 in Folge x1,5, ab 5 x2, ab 10 x2,5, ab 15 x3, ab 20 x4. */
const SURV_BASE={swipe:61,choice:73,gap:88,reels:97,slots:97,order:112,blocks:124,typing:149};
function survMult(run){return run>=20?4:run>=15?3:run>=10?2.5:run>=5?2:run>=3?1.5:1;}
function survPoints(mod,run,perfect){return Math.round((SURV_BASE[mod]||80)*(perfect?1.25:1)*survMult(run));}
const bestStore=()=>{const m=state.best||(state.best={});return m[state.lang]||(m[state.lang]={});};
const bestFor=pm=>bestStore()[pm]||0;
/* Score-Anzeige: Punkte mit Tausenderpunkt. */
function fmtSc(n){return fmtRaw(n);}
function fmtRaw(v){return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g,state.ui==='de'?'.':',');}
function scRecLine(){
  if(!S||S.kind!=='survival')return '';
  const b=S.best||0,sh=S.shown||0;
  if(b&&sh>b)return t('Neuer Rekord!');
  return b?t('Rekord: {0}',fmtSc(b)):'';
}
function scoreRow(){
  if(!S||S.kind!=='survival'||S.i>=S.items.length)return '';
  return `<div class="scrow">${livesHtml(S.lives,-1,healProg())}<div class="scbox"><div class="scline"><span class="scl">Score</span><b class="scnum" id="scnum">${fmtSc(S.shown||0)}</b></div><small id="screc">${scRecLine()}</small></div></div>`;
}
/* Nach einem Modul: Zahl wird kurz groß und tickt in 100er-Schritten nach oben. */
function scoreTick(){
  if(!S||S.kind!=='survival')return;
  const from=S.shown||0,to=S.score;
  if(to<=from)return;
  S.shown=to;
  const el=$('#scnum');if(!el)return;
  const fin=()=>{const e=$('#scnum');if(e){e.textContent=fmtSc(to);e.classList.remove('bump');}const r=$('#screc');if(r)r.textContent=scRecLine();};
  if(reduceMotion()){fin();return;}
  const t0=Date.now(),dur=Math.min(900,450+(to-from)*0.6),a=from,z=to;
  el.classList.add('bump');
  const step=()=>{
    const e=$('#scnum');if(!e)return;
    const k=Math.min(1,(Date.now()-t0)/dur),v=a+(z-a)*(1-Math.pow(1-k,2.2));   // schnell los, am Ende sanft
    e.textContent=fmtRaw(k>=1?z:v);
    if(k<1)setTimeout(step,28);else setTimeout(fin,220);
  };
  step();
}

function dailyCards(){
  const p=plan(),cards=[];
  if(p.fresh)cards.push({w:p.fresh,kind:'intro',type:'new'});
  p.review.forEach(w=>cards.push({w,kind:'review',type:'review'}));
  if(p.fresh)cards.push({w:p.fresh,kind:'final',type:'new'});
  return cards;
}
function survivalWords(){
  const L=curLang(),prog=state.progress[L.id]||{};
  return L.words.filter(w=>prog[w.k]);   // Version 131: auch Wörter auf Stufe 0
}
/* Solo-Playmode: nur Wörter, die zum gewählten Modul passen (kein Ersatzmodul). Zu wenige passende Wörter = Solo gesperrt. */
const SOLO_MIN=3;
const soloWords=pm=>{const m=MOD[pm];return survivalWords().filter(w=>!m||!m.can||m.can(w));};
/* Version 159: Für die Kacheln reicht „mindestens SOLO_MIN passende Wörter?“. Zählt nur bis zur Grenze und hört dann auf,
   statt für jedes gelernte Wort den ganzen Beispielsatz durchzurechnen (das ließ den Survival-Screen stocken). */
function soloCount(pm,limit){
  const m=MOD[pm],ws=survivalWords();
  if(!m||!m.can)return Math.min(ws.length,limit);
  let n=0;for(const w of ws){if(m.can(w)&&++n>=limit)break;}
  return n;
}
/* ===== Offener Run (Version 114) =====
   Beim Abbrechen oder Verlassen der App soll man dort weitermachen, wo man war.
   Gespeichert wird vor jeder Karte: welche Wörter in welcher Reihenfolge, die Stelle im Run,
   Leben, Punkte, Serie und die bereits gewerteten Wörter. Wörter stehen als Schlüssel drin,
   damit der Spielstand klein bleibt und sich beim Laden gegen die aktuelle Wortliste prüfen lässt.
   Die angefangene Karte beginnt beim Fortsetzen von vorn (halb gesetzte Kacheln lassen sich nicht retten). */
function saveRun(){
  if(!S||!S.items||S.i>=S.items.length)return;
  state.run={v:1,lang:state.lang,kind:S.kind,playmode:S.playmode,i:S.i,
    items:S.items.map(x=>({k:x.w.k,kind:x.kind,type:x.type,ok:x.ok})),
    right:S.right,wrong:S.wrong,missed:S.missed.map(w=>w.k),
    streak0:S.streak0,last:S.last,lives:S.lives,score:S.score,shown:S.score,run:S.run,words:S.words,lost:S.lost,best:S.best,hand:S.hand||null,date:S.date||today()};
  save();
}
function clearRun(){if(state.run){state.run=null;save();}}
/* Liefert den offenen Run, wenn er zur aktuellen Lernsprache passt und alle Wörter noch existieren */
function openRun(kind){
  const r=state.run;
  if(!r||r.v!==1||r.lang!==state.lang)return null;
  if(kind&&r.kind!==kind)return null;
  const L=curLang();if(!L)return null;
  const by={};L.words.forEach(w=>{by[w.k]=w;});
  if(!r.items||!r.items.length||r.items.some(x=>!by[x.k]||x.kind==='repair'))return null;   // Runs von vor Version 131 mit Reparatur-Karten verfallen
  if(r.i>=r.items.length)return null;
  if(r.kind==='daily'&&r.date&&r.date<today()){state.run=null;save();return null;}   // Version 133: pausierte Daily-Hand verfällt um Mitternacht samt Einsatz
  return r;
}
function resumeRun(){
  const r=openRun();if(!r)return false;
  const L=curLang(),by={};L.words.forEach(w=>{by[w.k]=w;});
  S={items:r.items.map(x=>({w:by[x.k],kind:x.kind,type:x.type,ok:x.ok})),i:r.i,right:r.right,wrong:r.wrong,
     missed:(r.missed||[]).map(k=>by[k]).filter(Boolean),
     cur:null,streak0:r.streak0,kind:r.kind,playmode:r.playmode,last:r.last,lives:r.lives,score:r.score,
     shown:r.score,run:r.run,words:r.words,lost:r.lost,best:r.best,hand:r.hand||null,date:r.date||today()};
  sheet.hidden=false;document.body.style.overflow='hidden';
  showItem();
  return true;
}
/* Kleine Rückfrage, bevor ein offener Run verworfen wird */
function askDiscard(cb){
  const r=openRun();if(!r)return cb();
  const o=document.createElement('div');o.className='askbox';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
  const what=r.kind==='survival'?t('Survival'):t('Daily Round'),hand=r.kind==='daily';   // Version 133: eine Daily-Hand lässt sich nicht verwerfen
  o.innerHTML=`<div class="ask-back"></div><div class="ask-in"><b>${hand?t('Offene Hand'):t('Offener Run: {0}',what)}</b>
    <p>${hand?t('Erst die offene Hand zu Ende spielen.'):t('Wenn du neu startest, ist der alte Run weg.')}</p>
    ${hand?'':`<button class="btn primary block" id="askgo">${t('Trotzdem neu starten')}</button>`}
    <button class="btn block" id="askon">${t('Weiterspielen')}</button>
    <button class="btn block ghost" id="askno">${t('Abbrechen')}</button></div>`;
  document.body.appendChild(o);
  const close=()=>o.remove();
  $('.ask-back',o).onclick=close;$('#askno',o).onclick=close;
  if(!hand)$('#askgo',o).onclick=()=>{close();clearRun();cb();};
  $('#askon',o).onclick=()=>{close();resumeRun();};
  try{($('#askgo',o)||$('#askon',o)).focus();}catch(e){}
}
function startRound(kind,opt){
  const o=opt||{},open=openRun();
  if(!o.force&&open){
    if(open.kind==='daily'&&kind!=='survival')return resumeRun();   // offene Daily-Hand: nur weiterspielen
    return askDiscard(()=>startRound(kind,Object.assign({force:1},o)));
  }
  if(kind!=='survival'&&!o.blind)return showBlindStage(kind,o);   // erst der Einsatz (Version 133), als eigener Screen (Version 134)
  clearRun();
  const pool=kind==='survival'&&o.playmode&&o.playmode!=='random'?soloWords(o.playmode):survivalWords();
  if(kind==='survival'&&o.playmode&&o.playmode!=='random'&&pool.length<SOLO_MIN)return;
  const items=kind==='survival'?shuffle(pool).map(w=>({w,kind:'surv',type:'review'})):dailyCards();
  if(!items.length)return;
  S={items,i:0,right:0,wrong:0,missed:[],cur:null,streak0:streak(),kind:kind||'daily',playmode:o.playmode||'random',
     last:null,lives:3,score:0,shown:0,run:0,words:0,lost:0,best:kind==='survival'?bestFor(o.playmode||'random'):0,
     hand:kind==='survival'?null:handNew(o.blind),date:today()};
  sheet.hidden=false;document.body.style.overflow='hidden';
  showItem();
}

function closeSheet(){sheet.hidden=true;sheet.innerHTML='';sheet.classList.remove('shop-open');document.body.style.overflow='';S=null;render();}

function sheetBody(inner){
  const pct=S.items.length?Math.round(S.i/S.items.length*100):0;
  const hand=S.kind==='daily'&&S.hand&&S.i<S.items.length;   // Version 134: Pokerhand mit Dewi-Chips und Dewi-Zone
  const prog=hand?chipTrack():`<div class="sbar" role="progressbar" aria-valuemin="0" aria-valuemax="${S.items.length}" aria-valuenow="${S.i}"><i style="width:${pct}%;--p:${Math.max(pct/100,0.05)}"></i></div><div class="scount">${Math.min(S.i+1,S.items.length)} / ${S.items.length}</div>`;
  sheet.innerHTML=`<div class="sin${hand?' hand':''}"><div class="shead"><button class="iconbtn" id="quit" aria-label="${hand?t('Round pausieren'):t('Round beenden')}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>${prog}<button class="iconbtn" id="setgear" aria-label="${t('Einstellungen öffnen')}">${GEARIC}</button></div>${scoreRow()}${hand?handZone():''}${inner}</div>`;
  $('#quit').onclick=closeSheet;
  $('#setgear').onclick=openSettingsOverlay;   // Version 148: Zahnrad statt Lautstärke-Knopf, Sound-Einstellungen liegen dort sowieso ganz oben
  if(hand)handAfterRender();
  sheet.scrollTop=0;
  if(S.kind==='survival'&&S.score>(S.shown||0))setTimeout(scoreTick,350);
}

/* Welches Modul bekommt diese Karte? Immer ein Modul pro Wort, nie dasselbe wie die Karte davor.
   Das neue Wort am Ende der Review-Stage bekommt bevorzugt ein schweres Modul (Tippen oder Bausteine). */
function chooseModule(card){
  const w=card.w;
  if(window.__force&&MOD[window.__force]&&MOD[window.__force].can(w))return window.__force;   // nur für Tests
  if(S.kind==='survival'&&S.playmode!=='random')return resolveModule(S.playmode,w);
  const all=MODULES.filter(m=>m.solo&&m.can(w)).map(m=>m.id);
  let pool=all.filter(id=>id!==S.last);
  if(card.kind==='final'){const heavy=pool.filter(id=>id==='typing'||id==='blocks');if(heavy.length)pool=heavy;}
  if(!pool.length)pool=all;
  return pool[Math.floor(Math.random()*pool.length)];
}

function showItem(){
  const it=S.items[S.i];
  if(!it)return showEnd();
  saveRun();
  const L=curLang(),w=it.w,key=normG(gl(w));
  const same=L.words.filter(x=>normG(gl(x))===key);
  const pr=(state.progress[L.id]||{})[w.k];
  const lvl=pr?pr.l:0;
  S.cur={w,card:it,type:it.type,lvl,tries:0,ok:true,settled:false,module:null,dir:Math.random()<.5?'id2gl':'gl2id',accept:same.reduce((a,x)=>a.concat([normId(x.id)],(x.alts||[]).map(normId)),[]),alts:same.filter(x=>x.k!==w.k).map(x=>x.id)};
  if(it.kind==='intro'){S.cur.module='intro';return MOD.intro.show(w);}
  if(S.kind==='survival'&&S.playmode!=='random'&&MOD[S.playmode]&&!MOD[S.playmode].can(w)){S.i++;return showItem();}   // Solo: nie ein fremdes Modul, Karte überspringen
  const m=chooseModule(it);
  it.module=m;S.cur.module=m;S.last=m;
  MOD[m].show(w);
  helpAuto(m);
}

/* Das Wort ist durch dieses Modul gewertet (richtig oder verloren). Wird von jedem Modul genau einmal aufgerufen. */
function settleCard(typedOk){
  const c=S.cur;
  if(c.settled)return c.res;
  c.settled=true;
  if(typedOk!==undefined)c.ok=c.ok&&typedOk;
  const ok=c.ok,w=c.w,card=c.card;
  let r={};
  if(S.kind==='survival'){
    S.run=ok?(S.run||0)+1:0;
    if(ok){
      S.words++;S.right++;
      if(S.run%HEART_STREAK===0&&S.lives<HEART_MAX){S.lives++;c.healed=true;setLives(S.lives,S.lives-1);haptic([20,40,20]);setTimeout(heartMoment,420);}
      c.perfect=!c.helped&&!c.typo;c.pts=survPoints(c.module,S.run,c.perfect)*(c.ptsMul||1);S.score+=c.pts;setTimeout(scoreTick,350);
      const dq=daily();
      if(dq.got.indexOf(w.k)<0)r=record(w,true,'review');   // Stufe +1, aber nur einmal pro Tag und Wort
      else{const pr=(state.progress[state.lang]||{})[w.k]||{};r={level:pr.l||1,days:0,same:true};}
    }else{S.wrong++;S.lives--;setLives(S.lives);if(S.kind==='survival'&&S.lives<=0)window.__gover=Date.now();}
  }else{
    r=record(w,ok,c.type);
    if(ok)S.right++;else{S.wrong++;S.lost++;S.missed.push(w);}
    c.dm=handSettle(S.hand,ok);   // Multiplikator der Pokerhand: +1, −1 (Big Blind) oder 0
    card.ok=ok;                   // für die Dewi-Chips im Kopf (auch nach dem Fortsetzen)
    S.run=ok?(S.run||0)+1:0;
  }
  c.res=r;
  return r;
}

/* Nächste Karte */
function nextStep(){
  const c=S.cur;
  if(c.module!=='intro'&&!c.settled)settleCard();
  S.i++;
  if(S.kind==='survival'&&S.lives<=0)return showEnd();
  showItem();
}

/* Kennzeile: Round, Stage, Modul */
function kicker(c,id,dir){
  const k=c.card;let base,col;
  if(S.kind==='survival'){base='Survival';col='var(--c-pink)';}
  else if(k.kind==='intro'){base=t('Daily Round · Einführung');col='var(--c-violet)';}
  else if(k.kind==='final'){base=t('Daily Round · Review · neues Wort');col='var(--c-violet)';}
  else{const rv=S.items.filter(x=>x.kind==='review'),n=rv.indexOf(k)+1;base=t('Daily Round · Review {0} von {1}',n,rv.length);col=LVCOL[c.lvl]||'var(--c-cyan)';}
  const label=id==='intro'?'':' · '+t('Modul {0}',MOD[id].name());
  const solo=(S.kind==='survival'&&S.playmode!=='random')?` · <span class="only">${t('Solo')}</span>`:'';
  return `<div class="kicker" style="--k:${col}">${base}${label}${dir?' · '+dir:''}${solo}</div>`;
}

/* Hinweis unter dem Ergebnis eines Moduls */
function resultNote(good){
  const c=S.cur;
  if(S.kind==='survival')return good?`<p class="hint" style="margin-top:8px">+${fmtSc(c.pts)} ${t('Punkte')}${S.run>=3?' · '+t('{0} in Folge',S.run):''}${c.healed?' · '+t('Serie von {0}: ein Herz kommt zurück!',HEART_STREAK):''}</p>`:`<p class="hint" style="margin-top:8px">${t('Ein Leben weniger.')}</p>`;
  return '';   // Version 149: Stufe und nächste Wiederholung nicht mehr geschrieben zeigen, Dewis Kommentar reicht als Rückmeldung
}

/* Ergebnis des Moduls Tippen (die anderen Module zeigen ihr Ergebnis selbst) */
function finish(typedOk){
  const c=S.cur,w=c.w,L=curLang(),r=settleCard(typedOk),ok=c.ok,type=c.type;
  let qk,qc={n:ok?S.run:(r.n||1),w:w.id,lv:c.lvl};
  if(ok)qk=c.tries>1&&typedOk?'ok_try2':S.run>=3&&S.run%3===0?'ok_run':'ok';
  else qk=(r.n||1)>=2?'bad_again':c.lvl>=3?'bad_rare':'bad';   // Fehlerzähler des Wortes (bleibt seit Version 131 im Wort)
  const alts=c.dir==='gl2id'&&c.alts.length?`<p class="hint" style="margin-top:6px">${t('Auch richtig: {0}',c.alts.map(esc).join(', '))}</p>`:'';
  const typoNote=c.typo?`<p class="hint" style="margin-top:6px">${t('Kleiner Tippfehler. Richtig geschrieben: {0}','<b lang="'+(c.dir==='gl2id'?L.code.toLowerCase():state.ui)+'">'+esc(c.dir==='gl2id'?w.id:glFirst(w))+'</b>')}</p>`:'';
  sheetBody(`<div class="smain">${S.kind==='survival'?roundLives():''}<div class="res ${ok?'good':'bad'}" role="status"><div class="rl">${ok?t('Richtig'):t('Leider falsch')}</div>
    <div class="pair"><span lang="${L.code.toLowerCase()}">${esc(w.id)}</span><em>=</em><span lang="${state.ui}">${esc(gl(w))}</span></div>${typoNote}${alts}</div>
    ${resultNote(ok)}${mascot(qk,qc,'sm')}<button class="btn primary block" id="next">${t('Weiter')}</button></div>`);
  const n=$('#next');n.onclick=nextStep;
  try{n.focus({preventScroll:true});}catch(e){}
  if(ok&&S.kind!=='survival')levelUp(c,r);
}

function levelUp(c,r){
  if(reduceMotion())return;
  const w=c.w,type=c.type,old=$('.lvl');if(old)old.remove();
  const lab=r.saved?t('Gerettet!'):type==='new'?t('Neues Wort!'):(r.level>c.lvl?t('Level up!'):t('Stufe gehalten'));
  const el=document.createElement('div');el.className='lvl';el.setAttribute('role','status');
  const lk=r.saved?'lvl_saved':type==='new'?'lvl_new':(r.level>c.lvl?'lvl_up':'lvl_hold');
  el.innerHTML=`<div class="lvl-rays"></div><div class="lvl-in"><div class="lvl-lab">${lab}</div>
    <div class="lvl-badge"><span>${r.level}</span></div>
    <div class="lvl-pips">${[1,2,3,4,5].map(i=>`<i class="${i<=r.level?'on':''}" style="--d:${300+i*110}ms;--pc:${LVCOL[i]}"></i>`).join('')}</div>
    <div class="lvl-word">${esc(w.id)} = ${esc(gl(w))}</div>
    ${mascot(lk,null,'col')}</div>`;   // Version 149: Zeile mit Stufe/nächster Wiederholung raus, Kreis und Punkte zeigen die Stufe schon
  document.body.appendChild(el);
  let gone=false;
  const close=()=>{if(gone)return;gone=true;el.classList.add('out');setTimeout(()=>el.remove(),300);};
  el.onclick=close;setTimeout(close,2600);
  burst($('.lvl-badge',el),46);
}

/* ===== Endscreen der Daily Round (Version 110) =====
   Zwei Momente statt einer Wand: erst das Ergebnis (ab Version 133 mit der Auszahlung der Pokerhand) und Dewis Kommentar,
   dann die Serie allein groß. Danach schließt sich die Round von selbst. */
function showEnd(){
  if(S.kind==='survival')return showSurvivalEnd();
  clearRun();
  const t0=today();
  S.i=S.items.length;
  let firstToday=false;
  if(!state.done[t0]){state.done[t0]=true;firstToday=true;if(S.lost>0){(state.flawed||(state.flawed={}))[t0]=true;}}
  Object.keys(state.done).forEach(k=>{if(k<addDays(t0,-120)){delete state.done[k];if(state.flawed)delete state.flawed[k];}});
  save();
  const total=S.right+S.wrong,st=streak();
  const grew=st>S.streak0,gray=firstToday&&S.lost>0;
  /* Version 133: Chips gibt es nur noch aus der Auszahlung der Pokerhand (poker.js) */
  const P=S.hand&&!S.paidOut?handPayout(S.hand):null;S.paidOut=true;
  const E={total,st,grew,gray,chips:P?P.payout:0,pay:P,first:firstToday};
  if(P)payoutStage(E);else endResult(E);   // Version 135: gestaltete Auszahlung; endResult nur noch für Runs von vor Version 133
}
/* ===== Bühnen-Helfer für die Endscreens (Version 126) =====
   Ein Ablaufplan (q) setzt Schritte zeitversetzt; ein Tipp auf die Bühne springt zum Endzustand.
   In Tests laufen alle Schritte sofort und der Endzustand steht gleich da. */
const CNT={p:0};
function stageSeq(){
  const q={items:[],at(ms,f){
      if(window.__test){f();return;}
      const it={f,done:false};it.id=setTimeout(()=>{it.done=true;f();},ms);q.items.push(it);},
    skip(){q.items.forEach(it=>{if(!it.done){clearTimeout(it.id);it.done=true;it.f();}});q.skipped=true;},
    stop(){q.items.forEach(it=>{if(!it.done){clearTimeout(it.id);it.done=true;}});}};
  return q;
}
/* Zahl zählt hoch (ease-out) und tickt mit steigender Tonhöhe; q.skip setzt sie sofort auf den Endwert */
function countTo(el,from,to,ms,fmt,q,tick){
  if(!el)return;
  if(window.__test||reduceMotion()||to<=from){el.textContent=fmt(to);return;}
  const t0=performance.now();let last=-1,lt=0;el.textContent=fmt(from);
  const iv=setInterval(()=>{
    const k=Math.min(1,(performance.now()-t0)/ms),v=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));
    if(v!==last){last=v;el.textContent=fmt(v);
      if(tick&&performance.now()-lt>58){lt=performance.now();CNT.p=k;sfx('counttick');}}
    if(k>=1)clearInterval(iv);},30);
  q.at(ms,()=>{clearInterval(iv);el.textContent=fmt(to);});
}
const on=id=>{const e=$('#'+id);if(e)e.classList.add('on');};
/* Tipp auf die Bühne: Ablauf überspringen. Gibt true zurück, wenn noch etwas lief. */
function stageTap(q,stage){
  stage.addEventListener('click',e=>{
    if(q.skipped||e.target.closest('button,a'))return;
    q.skip();
  });
}
/* Schritt 1: „x von y“ zählt hoch, dann der Gewinn in Chips (falls es einen gibt), dann Dewi und Weiter */
function endResult(E){
  const good=S.lost===0?'end_perfect':S.right/Math.max(1,E.total)>=.6?'end_good':'end_bad';
  const full=t('{0} von {1}','\u0001',E.total).split('\u0001');
  sheetBody(`<div class="smain endstage" id="est"><div class="kicker" style="--k:var(--c-pink)">${t('Round beendet')}</div>
    <div class="bigword es-big${S.lost===0?' perf':''}" id="ebig">${esc(full[0])}<span id="enum">0</span>${esc(full[1]||'')}</div>
    <p class="hint rv" id="esub">${t('Module geschafft')}</p>
    ${E.chips?`<div class="chipline rv" id="egem">${chipSvg('pink')}<b id="egn">+0</b></div>`:''}
    <div class="rv" id="emas">${mascot(good,null,'sm')}</div>
    <button class="btn primary block rv" id="endnext">${E.first?t('Weiter'):t('Fertig')}</button></div>`);
  const q=stageSeq(),stage=$('#est');
  stageTap(q,stage);
  const cd=Math.min(1100,350+S.right*170);
  let T=250;
  q.at(T,()=>countTo($('#enum'),0,S.right,cd,v=>String(v),q,true));
  T+=cd+120;
  q.at(T,()=>{const b=$('#ebig');if(b)b.classList.add('lock');sfx('lockin');haptic(25);on('esub');if(S.lost===0)burst($('#ebig'),34);});
  T+=520;
  if(E.chips){
    const cm=Math.min(1100,450+E.chips*.4);
    q.at(T,()=>{on('egem');sfx('chips');countTo($('#egn'),0,E.chips,cm,v=>'+'+fmtChip(v),q,true);});
    T+=cm+250;
    q.at(T-200,()=>{const g=$('#egn');if(g){g.textContent='+'+fmtChip(E.chips);g.classList.add('pulse');}});
  }
  q.at(T,()=>{on('emas');sfx(good);});
  T+=450;
  q.at(T,()=>{$$('.rv',stage).forEach(e=>e.classList.add('on'));});
  $('#endnext').onclick=()=>{if(!$('#endnext').classList.contains('on'))return;if(E.first)streakMoment(E);else closeSheet();};   // Serie nur beim ersten Spielen des Tages
  if(window.__test)$$('.rv',stage).forEach(e=>e.classList.add('on'));
}
/* ===== Große Momente (Version 123) =====
   Herz-Regeneration und Serienstand bekommen je eine eigene Bühne über dem ganzen Bildschirm.
   Ein Tipp irgendwo schließt sie. Die Einblendung hängt am body, nicht im Sheet,
   damit der Flächen-Tipp der Ergebnis-Screens nicht mitfeuert. */
function moment(kind,inner,onClose){
  const old=$('.moment');if(old)old.remove();
  const el=document.createElement('div');
  el.className='moment '+kind;el.setAttribute('role','status');
  if(kind.indexOf('streak')===0)el.id='fin';   // Tests und Tastatur finden den Abschluss
  el.innerHTML=`<div class="mm-in">${inner}<div class="mm-tap">${t('Tippen zum Fortfahren')}</div></div>`;
  document.body.appendChild(el);
  let gone=false;
  el.onclick=()=>{
    if(gone)return;gone=true;
    if(window.__test){el.remove();if(onClose)onClose();return;}   // Tests warten nicht auf das Ausblenden
    el.classList.add('out');setTimeout(()=>{el.remove();if(onClose)onClose();},260);
  };
  return el;
}
/* Herz zurück: rosa Puls, Herzschlag, Funken */
function heartMoment(){
  const el=moment('heart',`<div class="mm-art"><svg viewBox="0 0 24 24" aria-hidden="true">${HEART}</svg></div>
    <div class="mm-big">+1</div>
    <div class="mm-lab">${t('Herz zurück')}</div>
    <div class="mm-sub">${t('{0} richtige in Folge',HEART_STREAK)}</div>`);
  sfx('heartback');haptic([20,90,20]);burst($('.mm-art',el),30);
}
/* Serie am Ende der Daily Round: Flamme steigt auf, Funkenflug, Zahl groß */
function streakMoment(E){
  const st=E.st,ms=E.grew&&STREAK_MILES.indexOf(st)>=0;   // Version 133: Meilensteine = Stufen des Serien-Bonus
  const em=[];for(let i=0;i<11;i++)em.push(`<i style="left:${6+i*8.6}%;animation-delay:${(i*.19).toFixed(2)}s"></i>`);
  /* Gewachsene Serie: alte Zahl rutscht weg, neue rastet ein (Level-up) */
  const num=E.grew&&st>1?`<div class="mm-roll"><b class="ro" aria-hidden="true">${st-1}</b><b class="rn">${st}</b></div>`:`<div class="mm-big">${st}</div>`;
  const el=moment('streak'+(ms?' ms':''),`<div class="mm-art"><div class="mm-em">${em.join('')}</div>${flameSvg(st,true)}</div>
    ${num}
    <div class="mm-lab">${st===1?t('Tag'):t('Tage')} ${t('in Folge')}</div>
    ${ms?`<div class="mm-ms">${t('Meilenstein!')}</div><div class="mm-sub" id="mmbonus">${t('Serien-Bonus jetzt +{0} %',bonusPct(st))}</div>`:''}
    <div class="mm-sub">${E.grew?t('Serie verlängert!'):t('Die Serie läuft weiter.')}</div>`,closeSheet);
  if(E.grew){
    sfx(ms?'milestone':'streakup');
    setTimeout(()=>{if(document.body.contains(el)){haptic(ms?[30,60,30,60,50]:[30,70,30]);burst($('.mm-roll',el)||$('.mm-art',el),ms?90:46);}},window.__test?0:900);
  }else sfx('pop');
}

function showSurvivalEnd(){
  clearRun();
  S.i=S.items.length;
  const all=S.words>=S.items.length&&S.lives>0,best=S.best,rec=S.score>best;
  if(rec){bestStore()[S.playmode]=S.score;}
  const gS=chipSurvival(S.words);   // Version 132: 5 Chips pro Wort, max. 300 am Tag, kein Rekord-Bonus
  save();
  const pmName=S.playmode==='random'?t('Random'):playmodeLabel(S.playmode);
  const mood=rec||all?'end_perfect':S.words>=5?'end_good':'end_bad';
  sheetBody(`<div class="smain endstage" id="est"><div class="kicker" style="--k:var(--c-pink)">${all?t('Survival komplett geschafft!'):t('Survival beendet')} · ${pmName}</div>
    <div class="es-lab">${all?t('Survival komplett geschafft!'):t('Survival beendet')} · ${pmName}</div>
    <div class="bigword es-big${rec?' recd':''}" id="ebig"><span id="snum">${fmtSc(0)}</span></div>
    <p class="hint">${t('Punkte')} · ${t('{0} Wörter geschafft',S.words)}</p>
    <p class="${rec?'es-rec':'hint'} rv" id="srec">${rec?t('Neuer Rekord! Vorher: {0}',fmtSc(best)):(best?t('Rekord: {0}. Noch {1} bis zum Rekord.',fmtSc(best),fmtSc(best-S.score+1)):'')}</p>
    <div class="rv" id="sgem">${chipLine(gS)}</div>
    <div class="rv" id="smas">${mascot(mood,null,'sm')}</div>
    <div class="es-btns rv" id="sbtn"><button class="btn primary block" id="again">${t('Nochmal spielen')}</button>
    <button class="btn block" id="fin">${t('Fertig')}</button></div></div>`);
  $('#fin').onclick=closeSheet;
  $('#again').onclick=()=>startRound('survival',{playmode:S.playmode});
  const q=stageSeq(),stage=$('#est');
  stageTap(q,stage);
  const cd=Math.min(2300,Math.max(900,500+S.score*.5));
  q.at(300,()=>countTo($('#snum'),0,S.score,cd,fmtSc,q,true));
  let T=300+cd+100;
  q.at(T,()=>{const b=$('#ebig');if(b)b.classList.add('lock');sfx(rec?'milestone':'lockin');haptic(rec?[30,60,30,60,50]:25);on('srec');if(rec)burst($('#ebig'),80);});
  T+=rec?900:500;
  q.at(T,()=>{on('sgem');if(gS)sfx('chips');});T+=450;
  q.at(T,()=>{on('smas');sfx(mood);});T+=400;
  q.at(T,()=>{on('sbtn');});
  if(window.__test){$$('.rv',stage).forEach(e=>e.classList.add('on'));}
  else q.at(T,()=>{$$('.rv',stage).forEach(e=>e.classList.add('on'));});
}

/* ===== Dewi in jedem Modul + „?“ =====
   Jedes Modul zeigt von Beginn an Dewi mit einem Spruch (QUIPS.task) in ihrer normalen Sprechblase im Fluss der Seite
   (bei Reels die Blase unter dem Automaten). Das „?“ lässt sie genervt seufzen (Stimmung „sigh“) und die Kurzbeschreibung
   des Moduls vorlesen, mit einem von fünf zufälligen Zusätzen (QUIPS.help_x). */
function helpBtn(id){return `<button class="qh" type="button" data-help="${id}" aria-expanded="false" aria-label="${t('Hilfe zu diesem Modul')}">?</button>`;}
function helpBox(q){
  const box=document.createElement('div');box.className='helpm';box.innerHTML=mascotHtml(q.mood,q.text,'sm');return box;
}
/* „?“: Dewi seufzt und liest die Kurzbeschreibung des Moduls vor (dieselbe wie auf der Survival-Kachel) */
function helpOpen(btn){
  if(!btn||!btn.isConnected)return;
  if(S&&S.cur)S.cur.helped=true;

/* ===== modules/_shared.js ===== */
const toGl=()=>t(state.ui==='de'?'ins Deutsche':'ins Englische');

const toIdl=()=>t(state.lang==='en'?'ins Englische':state.lang==='de'?'ins Deutsche':'ins Indonesische');

/* Hervorhebung: Wort im Satz finden (nur ganze Wörter) */
/* Wort im Satz finden: Token-Bereich [von,bis] oder null. Erst exakt, dann gebeugte Form
   (z. B. menjawab → jawab, tagihan → tagihannya, dua belas → kedua belas). Zerlegung wie tokensOf. */
const ARTIKEL=/^(der|die|das|den|dem|des|ein|eine|einen|einem|einer)$/;
function wordSpan(text,word){
  const T=tokensOf(text).map(x=>x.toLowerCase());let W=tokensOf(word).map(x=>x.toLowerCase());
  if(W.length>1&&ARTIKEL.test(W[0]))W=W.slice(1);   // „der Nachbar“ steht im Satz als „Nachbar“
  if(!W.length)return null;
  const stems=b=>{const o=[b],m=b.match(/^(meng|meny|mem|men|me|ber|ter|di|per|pe|ke)(.{3,})$/);if(m)o.push(m[2]);return o.filter(x=>x.length>=3);};
  const find=eq=>{for(let i=0;i+W.length<=T.length;i++){let ok=true;for(let j=0;j<W.length;j++)if(!eq(T[i+j],W[j])){ok=false;break;}if(ok)return [i,i+W.length-1];}return null;};
  return find((a,b)=>a===b)||find((a,b)=>stems(b).some(x=>a.includes(x)));
}
/* Wörter eines Satzes (nach Token-Nummer) mit gelber Unterstreichung; gleiche Zerlegung wie tokensOf */
function markTokens(text,idx,cls,extra,xcls,more){
  const set=new Set(idx),ex=new Set(extra||[]),mo=new Set((more&&more.idx)||[]),re=/[^\s.,!?;:"“”]+/g;let out='',last=0,i=0,m;
  while((m=re.exec(text))){
    const c=ex.has(i)?(xcls||'gv'):mo.has(i)?more.cls:set.has(i)?(cls||'slot'):'';
    out+=esc(text.slice(last,m.index))+(c?'<span class="'+c+'">'+esc(m[0])+'</span>':esc(m[0]));
    last=m.index+m[0].length;i++;
  }
  return out+esc(text.slice(last));
}
function hlId(text,word){
  const lt=text.toLowerCase(),lw=word.toLowerCase(),isL=ch=>!!ch&&/[a-zäöüß]/i.test(ch);
  let i=lt.indexOf(lw);
  while(i>-1&&(isL(lt[i-1])||isL(lt[i+lw.length])))i=lt.indexOf(lw,i+1);
  if(i<0){
    const sp=wordSpan(text,word);if(!sp)return esc(text);
    const re=/[^\s.,!?;:"“”]+/g;let k=0,a=-1,b=-1,m;
    while((m=re.exec(text))){if(k===sp[0])a=m.index;if(k===sp[1]){b=m.index+m[0].length;break;}k++;}
    return a<0?esc(text):esc(text.slice(0,a))+'<b>'+esc(text.slice(a,b))+'</b>'+esc(text.slice(b));
  }
  return esc(text.slice(0,i))+'<b>'+esc(text.slice(i,i+lw.length))+'</b>'+esc(text.slice(i+lw.length));
}
/* Token-Nummern der gelernten Vokabel im Beispielsatz: side 'id' = Satz der Lernsprache, 'gl' = Übersetzung (Klammer der Vorlage) */
function learnedIdx(w,s,side){
  const out=[];if(!s)return out;
  if(side==='id'){const sp=wordSpan(s.id,w.id);if(sp)for(let i=sp[0];i<=sp[1];i++)out.push(i);return out;}
  const m=s.tpl&&s.tpl.match(/\[([^\]]+)\]/);if(!m)return out;
  const pre=s.tpl.slice(0,m.index).replace(/[.,!?;:"“”]/g,' ');
  let a=tokensOf(pre).length;if(/\S$/.test(pre))a--;   // Klammer mitten im Wort (z. B. Orangen[saft])
  const n=Math.max(1,tokensOf(m[1]).length);
  for(let i=0;i<n;i++)out.push(a+i);return out;
}
/* ===== Wort-zu-Wort-Zuordnung (Version 118) =====
   Früher wurde zur Laufzeit geraten, welches Wort welchem entspricht (Wörterbuch, Endungen,
   Ähnlichkeit, Position). Das war nie ganz zuverlässig. Jetzt steht die Zuordnung in den Daten:
   align.js enthält für jedes geprüfte Satzpaar zwei Zahlenreihen, eine je Satz.
   Gleiche Zahl = einander entsprechende Wörter, 0 = keine Entsprechung.
   Fehlt ein Paar, wird nichts behauptet: dann markiert die App nur die gelernte Vokabel. */
const ALIGN={};
ALIGN_RAW.split('\n').forEach(l=>{
  const q=l.split('|');if(q.length<3)return;
  ALIGN[q[0].trim()]={a:q[1].trim().split(' ').map(Number),b:q[2].trim().split(' ').map(Number)};
});
/* Zuordnung für das Wort w zwischen seinem Beispielsatz und der Übersetzung, oder null */
function alignFor(w,idText,glText){
  const e=ALIGN[w.k+':'+state.ui];
  if(!e)return null;
  if(e.a.length!==tokensOf(idText).length||e.b.length!==tokensOf(glText).length)return null;
  return e;
}
/* Positionen im übersetzten Satz, die zu den angegebenen Token des Lernsatzes gehören */
function mapIdx(al,idx,side){
  const from=side==='a'?al.a:al.b,to=side==='a'?al.b:al.a,g=new Set();
  idx.forEach(i=>{if(from[i])g.add(from[i]);});
  const out=[];to.forEach((v,k)=>{if(v&&g.has(v))out.push(k);});
  return out;
}
/* Deutscher/englischer Satz oben (Richtung „in die Lernsprache“):
   gesuchte Wörter pink unterstrichen, geschenkte bleiben neutral.
   Ohne geprüfte Zuordnung wird nur die gelernte Vokabel markiert. */
function glPrompt(w,idText,glText,askedId,givenId){
  const s=sentOf(w),lrn=[];
  if(s&&s.id===idText&&s.plain===glText)learnedIdx(w,s,'gl').forEach(i=>lrn.push(i));
  if(!givenId||!givenId.size){   // nichts geschenkt: der ganze Satz ist gesucht, dafür braucht es keine Zuordnung
    const all=[];for(let k=0;k<tokensOf(glText).length;k++)all.push(k);
    return markTokens(glText,all,'slot');
  }
  const al=alignFor(w,idText,glText);
  if(!al)return markTokens(glText,lrn,'slot');
  const given=new Set(mapIdx(al,Array.from(givenId||[]),'a'));
  const y=mapIdx(al,Array.from(askedId||[]),'a').filter(k=>!given.has(k));
  lrn.forEach(k=>{if(!given.has(k)&&y.indexOf(k)<0)y.push(k);});
  return markTokens(glText,y,'slot');
}
/* Satz der Lernsprache oben: Wörter, deren Übersetzung gesucht wird (gelb), und geschenkte (dezent lila) */
function idPrompt(w,idText,askedId,givenId,glText){
  const s=sentOf(w),y=new Set(askedId);
  if(s&&s.id===idText)learnedIdx(w,s,'id').forEach(i=>y.add(i));
  givenId.forEach(i=>y.delete(i));
  return markTokens(idText,Array.from(y),'slot',Array.from(givenId),'gv');
}

function hlSlot(tpl,repl,cls){
  const m=tpl.match(/\[([^\]]+)\]/);
  if(!m)return esc(tpl);
  const i=m.index;
  return esc(tpl.slice(0,i))+`<${cls?'span class="'+cls+'"':'b'}>`+esc(repl==null?m[1]:repl)+`</${cls?'span':'b'}>`+esc(tpl.slice(i+m[0].length));
}

let PROPER=null,PROPER_L=null,POOL={};
/* Satz-Schlüssel des aktuellen Kurses (Englisch-Schlüssel tragen den Vorsatz „en:“) */
const sentKeys=()=>Object.keys(SENT).filter(k=>state.lang==='id'?k.indexOf(':')<0:k.indexOf(state.lang+':')===0);

function tokensOf(text){return text.replace(/[.,!?;:"“”]/g,' ').split(/\s+/).filter(Boolean);}

function isProper(tk){
  if(!PROPER||PROPER_L!==state.lang){
    PROPER_L=state.lang;PROPER=new Set(PROPER_EXTRA);
    sentKeys().forEach(k=>{[SENT[k].id,SENT[k].en,SENT[k].de].forEach(tx=>{if(tx)tokensOf(tx).forEach((x,i)=>{if(i>0&&/^[A-ZÄÖÜ]/.test(x))PROPER.add(x);});});});
    const CL=curLang();if(CL)CL.words.forEach(w=>{if(/^[A-Z]/.test(w.id))w.id.split(' ').forEach(x=>PROPER.add(x));});
  }
  return /^I($|')/.test(tk)||PROPER.has(tk);
}

/* Echte Eigennamen (Orte, Namen, Monate …): gelten beim Lernstand immer als bekannt. Anreden wie „Bu“ oder „Pak“ gehören NICHT dazu,
   auch wenn sie im Satz großgeschrieben sind: Sie sind Vokabeln, die man noch nicht kennen kann. */
function isName(tk){return PROPER_EXTRA.indexOf(tk)>-1;}

/* Besteht der ganze Beispielsatz des Wortes aus gelernten Wörtern (und Namen)? Das Zielwort selbst zählt als gelernt.
   Auswahl und Lückensatz zeigen den ganzen Satz, deshalb nur mit solchen Sätzen. */
function sentKnown(w){
  const s=sentOf(w);if(!s)return false;
  if(window.__rlAll)return true;   // nur für Tests
  const kn=knownTokens(w);
  return tokensOf(s.id).every(tk=>isName(tk)||kn.has(normId(tk)));
}

const tileText=(tk,i)=>(i===0&&!isProper(tk))?tk.charAt(0).toLowerCase()+tk.slice(1):tk;

function tilesOf(text){return tokensOf(text).map(tileText);}

function poolOf(lang){
  const pk=state.lang+'|'+lang;
  if(!POOL[pk]){const set=new Set();sentKeys().forEach(k=>{const s=SENT[k],tx=lang==='id'?s.id:s[lang];if(tx)tilesOf(tx).forEach(x=>set.add(x));});POOL[pk]=Array.from(set);}
  return POOL[pk];
}

function distractors(target,lang,n){
  const have=new Set(target.map(normId)),out=[];
  for(const x of shuffle(poolOf(lang).slice())){
    const k=normId(x);if(!k||have.has(k))continue;
    have.add(k);out.push(x);if(out.length>=n)break;
  }
  return out;
}

function editDist(a,b){   // Damerau-Levenshtein: ein Buchstabendreher zählt als 1 Fehler
  const m=a.length,n=b.length,d=[];
  for(let i=0;i<=m;i++){d[i]=[i];}
  for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[m][n];
}

const HEART='<path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.4 3.2 5 6.6 5c2 0 3.4 1.1 5.4 3 2-1.9 3.4-3 5.4-3 3.4 0 5.4 3.4 4.1 6.8C19.5 16.4 12 21 12 21z"/>';

/* Herzen (Version 123): das nächste leere Herz füllt sich von unten nach oben,
   je nachdem wie weit die Regeneration ist (8 richtige in Folge geben ein Herz zurück). */
let HEART_UID=0;

/* ein falscher Gegenvorschlag, möglichst aus derselben Kategorie */
function introFoil(w,side){
  const L=curLang(),mine=side==='gl'?normG(gl(w)):normId(w.id);
  const pool=shuffle(L.words.filter(x=>x.k!==w.k));
  const pri=pool.filter(x=>x.cat===w.cat).concat(pool.filter(x=>x.cat!==w.cat));
  for(const x of pri){
    const v=side==='gl'?glFirst(x):x.id;
    if((side==='gl'?normG(v):normId(v))!==mine)return v;
  }
  return side==='gl'?glFirst(w):w.id;
}

/* Quelle für Bausteine: Beispielsatz des Wortes, bei Alltagssätzen der Eintrag selbst.
   Noch nicht gelernte Wörter im Satz werden geschenkt: Sie stehen schon fest im Satz (dezent lila), man setzt nur die übrigen Kacheln ein.
   Grenzen: höchstens 2 geschenkte Wörter, mindestens 2 Kacheln selbst setzen, höchstens 7 Wörter. Das Zielwort zählt als bekannt. */
const BLOCKS_MAX_GIVEN=2,BLOCKS_MIN_FREE=2,BLOCKS_MAX_TOKENS=7;
/* Deutsche Funktionswörter: Artikel, Pronomen, Hilfsverben, Präpositionen.
   Sie sind keine Vokabeln des Kurses, stehen aber in fast jedem Satz. Ohne sie gälte kaum
   ein deutscher Satz als „bekannt“ und die Module Lückensatz, Auswahl und Reihenfolge fielen meist aus. */
const GLUE_DE='der die das den dem des ein eine einen einem einer eines ist sind war waren bin bist seid sein ich du er sie es wir ihr man mich dich sich uns ihn ihm ihnen mein meine meinen meinem meiner dein deine deinen sein seine seinen ihre ihren unser unsere euer und oder aber nicht kein keine keinen nur auch noch schon sehr mehr viel hier dort da jetzt dann heute wenn weil dass ob wie was wer wo warum wann in im an am auf aus bei mit nach von vom vor zu zum zur über unter für ohne um durch gegen seit bis hat habe haben hatte hatten wird werde werden wurde kann kannst können konnte muss musst müssen soll sollte will willst wollen möchte darf gibt geht macht gut gute guter gutes neue neuen alte alten'.split(' ');
function knownTokens(w){
  const L=curLang(),prog=state.progress[L.id]||{},set=new Set();
  L.words.forEach(x=>{const p=prog[x.k];if((p&&p.l>=1)||x.k===w.k)tokensOf(x.id).forEach(tk=>set.add(normId(tk)));});
  if(state.lang==='de')GLUE_DE.forEach(tk=>set.add(normId(tk)));
  return set;
}
/* Deutsche/englische Entsprechung eines unbekannten indonesischen Worts im Zielsatz (Positionen) oder null */
function blockEquiv(u,target){
  const L=curLang(),nu=normId(u),nt=target.map(normId);
  for(const x of L.words){
    if(x.id.split(' ').length!==1||normId(x.id)!==nu)continue;
    for(const opt of gl(x).split(' / ')){
      const o=tokensOf(opt).map(normId);if(!o.length)continue;
      for(let i=0;i+o.length<=nt.length;i++)if(o.every((v,j)=>v&&v===nt[i+j]))return o.map((_,j)=>i+j);
    }
  }
  return null;
}
/* Plan für eine Richtung: Zielkacheln und Positionen der geschenkten Wörter, oder null wenn nicht machbar */
function blockPlan(pair,w,dir){
  const idT=tokensOf(pair.id);
  if(idT.length>BLOCKS_MAX_TOKENS)return null;
  const known=knownTokens(w),unk=idT.filter(tk=>!isName(tk)&&!known.has(normId(tk)));
  const target=tilesOf(dir==='id2gl'?pair.gl:pair.id),given=new Set();
  if(target.length<2||target.length>BLOCKS_MAX_TOKENS)return null;
  for(const u of unk){
    if(dir==='gl2id'){target.forEach((tk,i)=>{if(normId(tk)===normId(u))given.add(i);});}
    else{const eq=blockEquiv(u,target);if(!eq)return null;eq.forEach(i=>given.add(i));}
  }
  if(given.size>BLOCKS_MAX_GIVEN||target.length-given.size<BLOCKS_MIN_FREE)return null;
  return {target,given};
}
const blockDirs=(pair,w)=>['id2gl','gl2id'].filter(d=>blockPlan(pair,w,d));
function buildPair(w){
  const s=sentOf(w);
  const pair=s?{id:s.id,gl:s.plain}:{id:w.id,gl:glFirst(w)};
  return blockDirs(pair,w).length?pair:null;
}
/* Ablenker-Kacheln möglichst aus bereits gelernten Wörtern */
function blockDistractors(target,toLang,n,w){
  if(toLang!=='id')return distractors(target,toLang,n);
  const have=new Set(target.map(normId)),out=[];
  const known=shuffle(Array.from(knownTokens(w)));
  for(const k of known){if(have.has(k))continue;have.add(k);out.push(k);if(out.length>=n)return out;}
  return out.concat(distractors(target.concat(out),toLang,n-out.length));
}

/* Satz oben: alle Wörter, die man selbst setzen muss, gelb; geschenkte Wörter dezent lila */
function blockPrompt(w,pair,dir,target,given){
  if(dir==='id2gl'){
    const known=knownTokens(w),gv=new Set(),as=new Set();
    tokensOf(pair.id).forEach((tk,i)=>{if(!isName(tk)&&!known.has(normId(tk)))gv.add(i);else as.add(i);});
    return idPrompt(w,pair.id,as,gv);
  }
  const as=new Set(),gv=new Set();
  target.forEach((tk,i)=>{if(given.has(i))gv.add(i);else as.add(i);});
  return glPrompt(w,pair.id,pair.gl,as,gv);
}
function showBuild(pair){
  const c=S.cur,w=c.w,L=curLang();
  const dirs=blockDirs(pair,w),dir=dirs[Math.floor(Math.random()*dirs.length)],toLang=dir==='id2gl'?state.ui:'id';
  const from=dir==='id2gl'?pair.id:pair.gl,to=dir==='id2gl'?pair.gl:pair.id;
  const {target,given}=blockPlan(pair,w,dir),want=target.map(normId).join('|');
  const free=target.map((tk,i)=>i).filter(i=>!given.has(i)),nFree=free.length;
  const tiles=shuffle(free.map(i=>target[i]).concat(blockDistractors(target,toLang,2,w)));
  let ans=[],done=false,lives=triesFor('blocks');
  window.__lastBuild={dir,target,given:Array.from(given)};   // nur für Tests
  sheetBody(`<div class="smain">${kicker(c,'blocks',dir==='id2gl'?toGl():toIdl())}${roundLives()}
    <div class="sentbox hq" lang="${dir==='id2gl'?L.code.toLowerCase():state.ui}">${blockPrompt(w,pair,dir,target,given)}${helpBtn('blocks')}</div>
    <div class="ans" id="ans2" aria-label="${t('Dein Satz')}" lang="${toLang==='id'?L.code.toLowerCase():toLang}"></div>
    <div class="bank" id="bank" lang="${toLang==='id'?L.code.toLowerCase():toLang}"></div>
    <div id="exfb"></div>
    <button class="btn primary block" id="chk" disabled>${t('Prüfen')}</button></div>`);
  const A=$('#ans2'),B=$('#bank'),chk=$('#chk');
  function paint(){
    A.classList.remove('bad');if(!done)$('#exfb').innerHTML='';
    let k=0;   // geschenkte Wörter stehen fest an ihrer Stelle, die freien Felder füllen sich von links nach rechts
    A.innerHTML=target.map((tk,pi)=>given.has(pi)?`<span class="tile given">${esc(tk)}</span>`:k<ans.length?`<button class="tile" data-i="${ans[k++]}">${esc(tiles[ans[k-1]])}</button>`:'<span class="bslot" aria-hidden="true"></span>').join('');
    B.innerHTML=tiles.map((x,i)=>ans.indexOf(i)>-1?`<span class="tile ghost" aria-hidden="true">${esc(x)}</span>`:`<button class="tile" data-i="${i}">${esc(x)}</button>`).join('');
    chk.disabled=ans.length<nFree;   // erst prüfbar, wenn alle Felder gefüllt sind
  }
  A.onclick=e=>{const b=e.target.closest('button');if(!b||done)return;ans.splice(ans.indexOf(+b.dataset.i),1);paint();};
  B.onclick=e=>{const b=e.target.closest('button');if(!b||done||ans.length>=nFree)return;ans.push(+b.dataset.i);paint();};
  chk.onclick=()=>{
    if(done){nextStep();return;}
    if(ans.length<nFree)return;   // Sicherung: nur prüfen, wenn alle Felder gefüllt sind
    let k=0;const good=target.map((tk,pi)=>given.has(pi)?normId(tk):normId(tiles[ans[k++]])).join('|')===want;
    if(!good){
      lives--;
      if(lives>0){A.classList.add('bad');$('#exfb').innerHTML=`<p class="fb bad" role="status">${t('Nicht ganz. Versuch es nochmal.')}</p>`;return;}
    }
    done=true;
    c.ok=c.ok&&good;settleCard();
    A.classList.add(good?'good':'bad');
    $$('.tile',sheet).forEach(x=>{if(x.tagName==='BUTTON')x.disabled=true;});
    $('#exfb').innerHTML=`<div class="res ${good?'good':'bad'}" role="status"><div class="rl">${good?t('Richtig'):t('Nicht ganz')}</div>
      <div class="pair">${esc(to)}</div></div>${resultNote(good)}`;
    chk.textContent=t('Weiter');chk.disabled=false;
    try{chk.focus({preventScroll:true});}catch(e){}
    if(good)burst($('.res'),18);
  };
  paint();
}

/* ---- Tippen ---- */
function hintFor(c){
  let x=c.dir==='id2gl'?glFirst(c.w):c.w.id;
  x=x.replace(/\([^)]*\)/g,'').trim();
  if(state.ui==='en')x=x.replace(/^\s*to\s+(?=\S)/i,'');
  return x.slice(0,2);
}

const typoTol=(len,lvl)=>{const d=TYPO_DIV[Math.max(0,Math.min(5,lvl||0))];return d===Infinity?0:Math.floor(len/d);};

let ANS_CACHE={};

function ownAnswers(dir){   // alle Schreibweisen anderer Wörter: ein anderes echtes Wort wird nie als Tippfehler durchgewunken
  const key=state.lang+dir+state.ui;
  if(!ANS_CACHE[key]){
    const set=new Set();
    curLang().words.forEach(w=>{if(dir==='id2gl')gl(w).split('/').forEach(x=>set.add(normG(x)));else set.add(normId(w.id));});
    ANS_CACHE[key]=set;
  }
  return ANS_CACHE[key];
}

function isCorrect(c,val){
  c.typo=false;c.near=false;
  const id2gl=c.dir==='id2gl';
  const a=id2gl?normG(val):normId(val);
  if(!a)return false;
  const cands=(id2gl?gl(c.w).split('/').map(normG):c.accept).filter(Boolean);
  if(cands.indexOf(a)>-1)return true;
  if(a.length<3)return false;
  const own=ownAnswers(id2gl?'id2gl':'gl2id');
  let best=99,tolBest=0;
  for(const x of cands){
    const d=editDist(a,x),tol=typoTol(x.length,c.lvl);
    if(d<best){best=d;tolBest=tol;}
  }
  if(best<=tolBest&&best>0&&!own.has(a)){c.typo=true;return true;}
  if(best<=tolBest+1&&best>0&&cands[0].length>=4)c.near=true;
  return false;
}

  const c=S.cur,w=c.w,L=curLang(),id2gl=c.dir==='id2gl';
  c.tries=0;

    <div class="bigword hq" lang="${id2gl?L.code.toLowerCase():state.ui}">${esc(id2gl?w.id:gl(w))}${helpBtn('typing')}</div>
    <form class="qform" id="qf" autocomplete="off"><div class="inwrap" id="iw"><input class="field" id="ans" type="text" aria-label="${t('Deine Antwort')}" placeholder="${t('Antwort tippen')}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done"></div>
    <button class="btn primary block" type="submit">${t('Prüfen')}</button></form>
    <p class="fb" id="fb" role="status" aria-live="polite"></p></div>`);
  const inp=$('#ans'),iw=$('#iw');let keys=0;
  inp.addEventListener('input',()=>{
    const col=PAL[++keys%PAL.length];
    iw.style.setProperty('--pc',col);iw.style.setProperty('--pcs',col+'44');
    iw.classList.toggle('typing',inp.value.length>0);
    iw.classList.remove('pulse');void iw.offsetWidth;iw.classList.add('pulse');
  });
  $('#qf').onsubmit=e=>{
    e.preventDefault();
    const val=inp.value;
    if(!val.trim()){inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');return;}
    c.tries++;
    if(isCorrect(c,val))return finish(true);
    if(c.tries>=triesFor('typing'))return finish(false);
    const fb=$('#fb');
    fb.className='fb bad';
    fb.textContent=(c.near?t('Fast! Achte auf die Schreibweise.'):t('Nicht ganz. Versuch es nochmal.'))+(c.tries===triesFor('typing')-1?t(' Tipp: beginnt mit „{0}“.',hintFor(c)):'');
    inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');inp.select();
  };
  try{inp.focus({preventScroll:true});}catch(e){inp.focus();}
}

/* ===== modules/swipe.js ===== */
/* Wörter mit Beispielsatz: Lückensatz (nur das Lernwort einsetzen) oder Bedeutungs-Auswahl. Alltagssätze: Bausteine. */
/* ===== Swipe-Modus: Wort oben, zwei ähnliche Vorschläge, einer ist richtig ===== */
function swipeWrong(w,id2gl){
  const L=curLang(),right=id2gl?glFirst(w):w.id,nr=id2gl?normG(right):normId(right);
  const ok=new Set(id2gl?gl(w).split(' / ').map(normG):[normId(w.id)].concat(S.cur&&S.cur.accept||[]));
  const cands=[];
  for(const x of L.words){
    if(x.k===w.k)continue;
    const cand=id2gl?glFirst(x):x.id,n=id2gl?normG(cand):normId(cand);
    if(!n||ok.has(n))continue;
    /* ähnlich = gleiche Kategorie, ähnliche Schreibweise, ähnliche Länge */
    const score=(x.cat===w.cat?3:0)+Math.max(0,3-editDist(n,nr)*.45)+Math.max(0,2-Math.abs(n.length-nr.length)*.4)+Math.random()*1.2;
    cands.push([score,cand]);
  }
  cands.sort((a,b)=>b[0]-a[0]);
  return cands.length?cands[0][1]:'?';
}

let swKey=null;

function showSwipe(){
  const c=S.cur,w=c.w,L=curLang(),s=sentOf(w),id2gl=Math.random()<.5;

  const opts=Math.random()<.5?[[right,1],[wrong,0]]:[[wrong,0],[right,1]];
  const word=id2gl?w.id:gl(w),wl=id2gl?L.code.toLowerCase():state.ui,ol=id2gl?state.ui:L.code.toLowerCase();

    </div>`);
  const card=$('#swcard'),bs=$$('.swb',sheet);
  let done=false,drag=false,x0=0,dx=0,tm=0,raf=0;
  /* Karte pro Bild höchstens einmal bewegen (spart Rechenarbeit auf dem Handy) */
  const move=()=>{raf=0;card.style.transform=`translate3d(${dx}px,0,0) rotate(${dx/14}deg)`;};
  const lean=d=>{bs[0].classList.toggle('lean',d<-24);bs[1].classList.toggle('lean',d>24);card.classList.toggle('lean',Math.abs(d)>24);};
  const choose=i=>{
    if(done)return;done=true;drag=false;
    const good=opts[i][1]===1,dir=i?1:-1;
    lean(0);card.classList.remove('drag');
    cancelAnimationFrame(raf);raf=0;
    card.style.transform=`translate3d(${dir*Math.max(380,window.innerWidth)}px,0,0) rotate(${dir*24}deg)`;card.classList.add('gone');
    sfx('swipe');
    $('.swstage').classList.add('answered');   // Version 154: Das Ergebnis erscheint an der Stelle der Karte, nichts rückt mehr nach oben
    bs.forEach((b,k)=>{b.disabled=true;if(opts[k][1]===1)b.classList.add('ok');else if(k===i)b.classList.add('no');});
    c.ok=c.ok&&good;settleCard();
    $('#exfb').innerHTML=`<div class="res ${good?'good':'bad'}" role="status"><div class="rl">${good?t('Richtig'):t('Nicht ganz')}</div>
      <div class="pair"><span lang="${L.code.toLowerCase()}">${esc(w.id)}</span><em>=</em><span lang="${state.ui}">${esc(gl(w))}</span></div>
      ${s?`<p class="hint" style="margin-top:8px" lang="${L.code.toLowerCase()}">${hlId(s.id,w.id)}</p>`:''}</div>${resultNote(good)}
      <button class="btn primary block" id="nx" style="margin-top:12px">${t('Weiter')}</button>`;
    $('#nx').onclick=nextStep;
    try{$('#nx').focus({preventScroll:true});}catch(e){}
    if(good)burst($('.res'),18);
  };
  bs.forEach((b,i)=>b.onclick=()=>choose(i));
  card.addEventListener('pointerdown',e=>{if(done)return;drag=true;x0=e.clientX;dx=0;tm=Date.now();card.classList.add('drag');try{card.setPointerCapture(e.pointerId);}catch(x){}});
  card.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-x0;lean(dx);if(!raf)raf=requestAnimationFrame(move);});
  const end=()=>{
    if(!drag)return;drag=false;card.classList.remove('drag');cancelAnimationFrame(raf);raf=0;
    const v=Math.abs(dx)/Math.max(1,Date.now()-tm);
    if(Math.abs(dx)>70||(v>.6&&Math.abs(dx)>25))choose(dx<0?0:1);
    else{card.style.transform='';lean(0);}
  };
  card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
  /* Pfeiltasten am PC */
  if(swKey)document.removeEventListener('keydown',swKey);
  swKey=e=>{
    if(!document.body.contains(card)){document.removeEventListener('keydown',swKey);swKey=null;return;}
    if(e.key==='ArrowLeft'){e.preventDefault();choose(0);}else if(e.key==='ArrowRight'){e.preventDefault();choose(1);}
  };
  document.addEventListener('keydown',swKey);
}

/* ===== modules/gap.js ===== */
function gapParts(s,w){
  const text=s.id,lt=text.toLowerCase(),lw=w.id.toLowerCase(),isL=ch=>!!ch&&/[a-zäöüß]/i.test(ch);
  let i=lt.indexOf(lw);
  while(i>-1&&(isL(lt[i-1])||isL(lt[i+lw.length])))i=lt.indexOf(lw,i+1);
  return i<0?null:{a:text.slice(0,i),b:text.slice(i+lw.length)};
}

function gapTiles(w){
  const L=curLang(),bad=new Set(gl(w).split(' / ').map(normG)),n=w.id.split(' ').length,out=[w.id];
  const pool=shuffle(L.words.filter(x=>x.k!==w.k&&x.id!==w.id&&!/^[A-Z]/.test(x.id)&&x.id.split(' ').length===n));
  const pri=pool.filter(x=>x.cat===w.cat).concat(pool.filter(x=>x.cat!==w.cat));
  for(const x of pri){
    const g=normG(glFirst(x));
    if(!g||bad.has(g))continue;
    bad.add(g);out.push(x.id);if(out.length>=4)break;
  }
  return shuffle(out);
}

function showGap(w,s,gp){
  const c=S.cur,L=curLang(),tiles=gapTiles(w),lang=L.code.toLowerCase();
  let lives=triesFor('gap'),done=false;
  sheetBody(`<div class="smain">${kicker(c,'gap')}${roundLives()}
    <div class="sentbox tr hq" lang="${state.ui}">${hlSlot(s.tpl,null,'slot')}${helpBtn('gap')}</div>
    <div class="sentbox gapbox" lang="${lang}">${esc(gp.a)}<span class="gap" id="gap"></span>${esc(gp.b)}</div>
    <div class="bank" id="bank" lang="${lang}">${tiles.map(x=>`<button class="tile" data-r="${x===w.id?1:0}">${esc(x)}</button>`).join('')}</div>
    <div id="exfb"></div></div>`);
  const gap=$('#gap'),B=$('#bank');
  function reveal(good){
    done=true;
    $$('.tile',B).forEach(x=>{x.disabled=true;if(x.dataset.r==='1')x.classList.add('ok');});
    gap.textContent=w.id;gap.className='gap '+(good?'good':'bad');
    c.ok=c.ok&&good;settleCard();
    $('#exfb').innerHTML=`<div class="res ${good?'good':'bad'}" role="status"><div class="rl">${good?t('Richtig'):t('Nicht ganz')}</div>
      <div class="pair"><span lang="${lang}">${esc(w.id)}</span><em>=</em><span lang="${state.ui}">${esc(gl(w))}</span></div>
      <p class="hint" style="margin-top:8px" lang="${lang}">${hlId(s.id,w.id)}</p></div>${resultNote(good)}
      <button class="btn primary block" id="nx" style="margin-top:12px">${t('Weiter')}</button>`;
    $('#nx').onclick=nextStep;
    try{$('#nx').focus({preventScroll:true});}catch(e){}
    if(good)burst($('.res'),18);
  }
  B.onclick=e=>{
    const b=e.target.closest('button');if(!b||done||b.disabled)return;
    const good=b.dataset.r==='1';
    gap.textContent=b.textContent;
    if(good)return reveal(true);
    lives--;b.disabled=true;b.classList.add('wrong');
    gap.className='gap bad';
    if(lives<=0)return reveal(false);
    $('#exfb').innerHTML=`<p class="fb bad" role="status">${t('Nicht ganz. Versuch es nochmal.')}</p>`;
    setTimeout(()=>{if(!done){gap.textContent='';gap.className='gap';}},650);
  };
}
